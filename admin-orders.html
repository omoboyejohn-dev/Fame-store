<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fame Store | Admin Orders</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#101828;
}

.header{
    background:#0757d9;
    color:#fff;
    padding:22px 18px;
}

.header-inner{
    width:min(1200px,100%);
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.brand{
    font-size:24px;
    font-weight:800;
}

.brand small{
    display:block;
    font-size:12px;
    opacity:.85;
    margin-top:4px;
}

.logout-btn{
    border:0;
    background:#fff;
    color:#0757d9;
    padding:10px 15px;
    border-radius:9px;
    font-weight:800;
    cursor:pointer;
}

.container{
    width:min(1200px,100%);
    margin:auto;
    padding:25px 16px 50px;
}

.page-title{
    margin-bottom:22px;
}

.page-title h1{
    font-size:27px;
    margin-bottom:7px;
}

.page-title p{
    color:#667085;
    font-size:14px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:#fff;
    border:1px solid #e4e9f0;
    border-radius:15px;
    padding:18px;
    box-shadow:0 5px 20px rgba(16,24,40,.05);
}

.stat-label{
    color:#667085;
    font-size:13px;
    margin-bottom:8px;
}

.stat-number{
    font-size:26px;
    font-weight:800;
}

.orders{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.order-card{
    background:#fff;
    border:1px solid #e4e9f0;
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 7px 25px rgba(16,24,40,.06);
}

.order-top{
    padding:17px 18px;
    background:#f8fafc;
    border-bottom:1px solid #e4e9f0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.order-id{
    font-size:13px;
    font-weight:800;
    word-break:break-all;
}

.order-date{
    color:#667085;
    font-size:12px;
    margin-top:5px;
}

.status{
    display:inline-block;
    padding:7px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
}

.status.pending{
    background:#fff4d6;
    color:#946200;
}

.status.successful{
    background:#e8fff2;
    color:#087443;
}

.status.cancelled{
    background:#fff0f0;
    color:#c1121f;
}

.order-body{
    padding:18px;
}

.product-section{
    display:flex;
    align-items:center;
    gap:15px;
    padding-bottom:18px;
    border-bottom:1px solid #edf0f4;
}

.product-image{
    width:85px;
    height:85px;
    object-fit:cover;
    border-radius:12px;
    background:#eef2f6;
}

.product-name{
    font-size:16px;
    font-weight:800;
    margin-bottom:7px;
}

.product-price{
    color:#0757d9;
    font-size:17px;
    font-weight:800;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
    margin-top:18px;
}

.detail{
    background:#f8fafc;
    border-radius:10px;
    padding:12px;
}

.detail.full{
    grid-column:1 / -1;
}

.detail-label{
    color:#667085;
    font-size:11px;
    font-weight:700;
    margin-bottom:5px;
    text-transform:uppercase;
}

.detail-value{
    font-size:14px;
    font-weight:700;
    line-height:1.5;
    word-break:break-word;
}

.order-actions{
    padding:16px 18px;
    border-top:1px solid #edf0f4;
    display:flex;
    gap:10px;
}

.success-btn{
    flex:1;
    border:0;
    background:#087443;
    color:#fff;
    padding:13px;
    border-radius:9px;
    font-weight:800;
    cursor:pointer;
}

.success-btn:hover{
    background:#065b35;
}

.success-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.cancel-btn{
    border:0;
    background:#fff0f0;
    color:#c1121f;
    padding:13px 18px;
    border-radius:9px;
    font-weight:800;
    cursor:pointer;
}

.empty{
    background:#fff;
    border:1px solid #e4e9f0;
    border-radius:15px;
    padding:40px 20px;
    text-align:center;
    color:#667085;
}

.loading{
    text-align:center;
    padding:40px;
    color:#667085;
}

.message-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(16,24,40,.55);
    z-index:9999;
    padding:20px;
    align-items:center;
    justify-content:center;
}

.message-overlay.show{
    display:flex;
}

.message-box{
    width:min(390px,100%);
    background:#fff;
    border-radius:20px;
    padding:28px 22px;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.2);
}

.message-icon{
    width:58px;
    height:58px;
    border-radius:50%;
    display:grid;
    place-items:center;
    margin:0 auto 15px;
    font-size:27px;
    background:#e8fff2;
}

.message-box h3{
    font-size:20px;
    margin-bottom:10px;
}

.message-box p{
    color:#667085;
    font-size:14px;
    line-height:1.6;
    margin-bottom:20px;
}

.close-btn{
    width:100%;
    border:0;
    background:#0757d9;
    color:#fff;
    padding:13px;
    border-radius:10px;
    font-weight:800;
    cursor:pointer;
}

@media(max-width:700px){

    .header-inner{
        align-items:flex-start;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .details{
        grid-template-columns:1fr;
    }

    .detail.full{
        grid-column:auto;
    }

    .order-top{
        align-items:flex-start;
        flex-direction:column;
    }

    .order-actions{
        flex-direction:column;
    }

    .cancel-btn{
        width:100%;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="brand">
            🛍️ Fame Store
            <small>Admin Order Management</small>
        </div>

        <button
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </button>

    </div>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            Customer Orders
        </h1>

        <p>
            View and manage all gift orders placed by customers.
        </p>

    </div>


    <div class="stats">

        <div class="stat-card">

            <div class="stat-label">
                Total Orders
            </div>

            <div
                class="stat-number"
                id="totalOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Pending Orders
            </div>

            <div
                class="stat-number"
                id="pendingOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Successful Orders
            </div>

            <div
                class="stat-number"
                id="successfulOrders"
            >
                0
            </div>

        </div>

    </div>


    <div
        class="orders"
        id="orders"
    >

        <div class="loading">
            Loading orders...
        </div>

    </div>

</main>


<!-- MESSAGE -->

<div
    class="message-overlay"
    id="messageOverlay"
>

    <div class="message-box">

        <div
            class="message-icon"
            id="messageIcon"
        >
            ✓
        </div>

        <h3 id="messageTitle">
            Done
        </h3>

        <p id="messageText">
            Order updated successfully.
        </p>

        <button
            class="close-btn"
            id="closeMessage"
        >
            OK
        </button>

    </div>

</div>


<script type="module">

import {
    auth,
    db
} from "./firebase-config.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ==========================================
   ELEMENTS
========================================== */

const ordersContainer =
    document.getElementById("orders");

const totalOrders =
    document.getElementById("totalOrders");

const pendingOrders =
    document.getElementById("pendingOrders");

const successfulOrders =
    document.getElementById("successfulOrders");

const logoutBtn =
    document.getElementById("logoutBtn");

const messageOverlay =
    document.getElementById("messageOverlay");

const messageIcon =
    document.getElementById("messageIcon");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");

const closeMessage =
    document.getElementById("closeMessage");


/* ==========================================
   MONEY
========================================== */

function money(value){

    return "₦" +
        Number(value || 0).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   DATE
========================================== */

function formatDate(timestamp){

    if(!timestamp)
        return "Date unavailable";

    try{

        if(typeof timestamp.toDate === "function"){

            return timestamp.toDate().toLocaleString(
                "en-NG",
                {
                    dateStyle:"medium",
                    timeStyle:"short"
                }
            );

        }

        return "Date unavailable";

    }catch{

        return "Date unavailable";

    }

}


/* ==========================================
   POPUP
========================================== */

function showMessage(
    title,
    text,
    success = true
){

    messageIcon.textContent =
        success ? "✓" : "⚠️";

    messageTitle.textContent =
        title;

    messageText.textContent =
        text;

    messageOverlay.classList.add("show");

}


closeMessage.addEventListener(
    "click",
    () => {

        messageOverlay.classList.remove("show");

    }
);


/* ==========================================
   ADMIN CHECK
========================================== */

async function checkAdmin(user){

    try{

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );

        const userSnap =
            await getDoc(userRef);


        if(!userSnap.exists()){

            return false;

        }


        const userData =
            userSnap.data();


        return userData.role === "admin";

    }catch(error){

        console.error(
            "ADMIN CHECK ERROR:",
            error
        );

        return false;

    }

}


/* ==========================================
   AUTHENTICATION
========================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "admin-login.html";

            return;

        }


        const admin =
            await checkAdmin(user);


        if(!admin){

            showMessage(
                "Access Denied",
                "You are not authorized to access the admin order page.",
                false
            );


            setTimeout(
                async () => {

                    try{

                        await signOut(auth);

                    }catch(error){

                        console.error(error);

                    }

                    window.location.href =
                        "admin-login.html";

                },
                1800
            );

            return;

        }


        await loadOrders();

    }
);


/* ==========================================
   LOAD ORDERS
========================================== */

async function loadOrders(){

    ordersContainer.innerHTML = `
        <div class="loading">
            Loading orders...
        </div>
    `;

    try{

        const ordersRef =
            collection(
                db,
                "giftOrders"
            );


        let snapshot;


        /*
         * Try newest orders first.
         */

        try{

            const ordersQuery =
                query(
                    ordersRef,
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                );


            snapshot =
                await getDocs(
                    ordersQuery
                );

        }catch(error){

            console.warn(
                "Order sorting unavailable:",
                error
            );


            snapshot =
                await getDocs(
                    ordersRef
                );

        }


        const orders = [];


        snapshot.forEach(
            orderDoc => {

                orders.push({

                    id:
                        orderDoc.id,

                    ...orderDoc.data()

                });

            }
        );


        /*
         * Sort newest first.
         */

        orders.sort(
            (a,b) => {

                const aTime =
                    a.createdAt?.toMillis?.() || 0;

                const bTime =
                    b.createdAt?.toMillis?.() || 0;

                return bTime - aTime;

            }
        );


        renderOrders(
            orders
        );


    }catch(error){

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        ordersContainer.innerHTML = `
            <div class="empty">

                <h3>
                    Unable to load orders
                </h3>

                <p style="margin-top:8px;">
                    Please check your Firestore rules and try again.
                </p>

            </div>
        `;

    }

}


/* ==========================================
   RENDER ORDERS
========================================== */

function renderOrders(orders){

    totalOrders.textContent =
        orders.length;


    const pending =
        orders.filter(
            order =>
                String(
                    order.status || "pending"
                ).toLowerCase() === "pending"
        ).length;


    const successful =
        orders.filter(
            order =>
                String(
                    order.status || ""
                ).toLowerCase() === "successful"
        ).length;


    pendingOrders.textContent =
        pending;


    successfulOrders.textContent =
        successful;


    if(!orders.length){

        ordersContainer.innerHTML = `
            <div class="empty">

                <h3>
                    No orders yet
                </h3>

                <p style="margin-top:8px;">
                    Customer gift orders will appear here.
                </p>

            </div>
        `;

        return;

    }


    ordersContainer.innerHTML = "";


    orders.forEach(
        order => {

            const status =
                order.status ||
                "pending";


            const normalizedStatus =
                String(status).toLowerCase();


            let statusClass =
                "pending";


            if(normalizedStatus === "successful"){

                statusClass =
                    "successful";

            }


            if(normalizedStatus === "cancelled"){

                statusClass =
                    "cancelled";

            }


            const card =
                document.createElement("div");


            card.className =
                "order-card";


            card.innerHTML = `

                <div class="order-top">

                    <div>

                        <div class="order-id">
                            Order ID:
                            ${escapeHTML(order.id)}
                        </div>

                        <div class="order-date">
                            ${formatDate(order.createdAt)}
                        </div>

                    </div>


                    <span
                        class="status ${statusClass}"
                    >
                        ${escapeHTML(status)}
                    </span>

                </div>


                <div class="order-body">

                    <div class="product-section">

                        ${
                            order.productImage
                            ?
                            `
                            <img
                                class="product-image"
                                src="${escapeHTML(order.productImage)}"
                                alt="Gift"
                                onerror="this.style.display='none'"
                            >
                            `
                            :
                            `
                            <div
                                class="product-image"
                                style="
                                    display:grid;
                                    place-items:center;
                                    font-size:30px;
                                "
                            >
                                🎁
                            </div>
                            `
                        }


                        <div>

                            <div class="product-name">
                                ${escapeHTML(
                                    order.productName ||
                                    "Gift"
                                )}
                            </div>

                            <div class="product-price">
                                ${money(
                                    order.total ??
                                    order.productPrice ??
                                    order.basePrice ??
                                    0
                                )}
                            </div>

                        </div>

                    </div>


                    <div class="details">

                        <div class="detail">

                            <div class="detail-label">
                                Customer Email
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    order.customerEmail ||
                                    "Not provided"
                                )}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Customer Phone
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    order.yourPhone ||
                                    order.customerPhone ||
                                    "Not provided"
                                )}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Sender
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    order.senderName ||
                                    "Not provided"
                                )}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Recipient
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    order.recipientName ||
                                    "Not provided"
                                )}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Recipient Phone
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    order.recipientPhone ||
                                    "Not provided"
                                )}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Country
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    order.country ||
                                    order.destination ||
                                    "Not provided"
                                )}
                            </div>

                        </div>


                        <div class="detail full">

                            <div class="detail-label">
                                Delivery Address
                            </div>

                            <div class="detail-value">

                                ${
                                    order.streetAddress
                                    ?
                                    escapeHTML(
                                        order.streetAddress
                                    )
                                    :
                                    ""
                                }

                                ${
                                    order.city
                                    ?
                                    ", " +
                                    escapeHTML(
                                        order.city
                                    )
                                    :
                                    ""
                                }

                                ${
                                    order.state
                                    ?
                                    ", " +
                                    escapeHTML(
                                        order.state
                                    )
                                    :
                                    ""
                                }

                                ${
                                    order.zipCode
                                    ?
                                    ", " +
                                    escapeHTML(
                                        order.zipCode
                                    )
                                    :
                                    ""
                                }

                                ${
                                    order.country
                                    ?
                                    ", " +
                                    escapeHTML(
                                        order.country
                                    )
                                    :
                                    ""
                                }

                            </div>

                        </div>


                        <div class="detail full">

                            <div class="detail-label">
                                Additional Notes
                            </div>

                            <div class="detail-value">

                                ${escapeHTML(
                                    order.additionalNotes ||
                                    order.message ||
                                    "No additional notes"
                                )}

                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Payment
                            </div>

                            <div class="detail-value">

                                ${escapeHTML(
                                    order.paymentMethod ||
                                    "Wallet"
                                )}

                                -

                                ${escapeHTML(
                                    order.paymentStatus ||
                                    "Paid"
                                )}

                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Product ID
                            </div>

                            <div class="detail-value">

                                ${escapeHTML(
                                    order.productId ||
                                    "Not provided"
                                )}

                            </div>

                        </div>

                    </div>

                </div>


                ${
                    normalizedStatus === "pending"
                    ?
                    `

                    <div class="order-actions">

                        <button
                            class="success-btn"
                            data-id="${escapeHTML(order.id)}"
                        >
                            ✓ Mark as Successful
                        </button>

                    </div>

                    `
                    :
                    ""
                }

            `;


            const successButton =
                card.querySelector(
                    ".success-btn"
                );


            if(successButton){

                successButton.addEventListener(
                    "click",
                    () => markSuccessful(
                        order.id,
                        successButton
                    )
                );

            }


            ordersContainer.appendChild(
                card
            );

        }
    );

}


/* ==========================================
   MARK SUCCESSFUL
========================================== */

async function markSuccessful(
    orderId,
    button
){

    const confirmed =
        confirm(
            "Are you sure you want to change this order from Pending to Successful?"
        );


    if(!confirmed){

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "Updating...";


    try{

        const orderRef =
            doc(
                db,
                "giftOrders",
                orderId
            );


        await updateDoc(
            orderRef,
            {

                status:
                    "successful",

                updatedAt:
                    serverTimestamp(),

                successfulAt:
                    serverTimestamp(),

                successfulBy:
                    auth.currentUser?.email || ""

            }
        );


        showMessage(
            "Order Successful",
            "The order has been changed from Pending to Successful."
        );


        await loadOrders();


    }catch(error){

        console.error(
            "MARK SUCCESSFUL ERROR:",
            error
        );


        button.disabled =
            false;

        button.textContent =
            "✓ Mark as Successful";


        showMessage(
            "Update Failed",
            "Unable to update this order. Please check your Firestore rules.",
            false
        );

    }

}


/* ==========================================
   LOGOUT
========================================== */

logoutBtn.addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

            window.location.href =
                "admin-login.html";

        }catch(error){

            console.error(
                "Logout error:",
                error
            );

        }

    }
);

</script>

</body>
</html>
