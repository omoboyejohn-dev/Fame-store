<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fame Store | Send Gifts</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f6f9ff;
    color:#101828;
}

button,input,textarea{
    font-family:inherit;
}

.header{
    background:#fff;
    border-bottom:1px solid #e7edf5;
    padding:22px 18px;
    text-align:center;
}

.brand-icon{
    font-size:34px;
    margin-bottom:5px;
}

.brand-name{
    color:#0757d9;
    font-size:25px;
    font-weight:800;
}

.brand-text{
    color:#667085;
    font-size:13px;
    margin-top:5px;
}

.wallet-box{
    display:inline-block;
    margin-top:14px;
    background:#eef5ff;
    color:#0757d9;
    padding:9px 15px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
}

.container{
    width:min(1200px,100%);
    margin:auto;
    padding:25px 16px 35px;
}

.page-title{
    text-align:center;
    margin-bottom:25px;
}

.page-title h1{
    font-size:27px;
    margin-bottom:7px;
}

.page-title p{
    color:#667085;
    font-size:13px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:18px;
}

.product-card{
    background:#fff;
    border:1px solid #e4e9f0;
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(16,24,40,.06);
}

.product-image{
    width:100%;
    height:220px;
    display:block;
    object-fit:cover;
    background:#eef2f6;
}

.product-info{
    padding:15px;
}

.product-name{
    font-size:15px;
    font-weight:700;
    line-height:1.4;
    min-height:42px;
}

.product-price{
    color:#0757d9;
    font-size:18px;
    font-weight:800;
    margin:10px 0 13px;
}

.gift-btn{
    width:100%;
    border:0;
    background:#0757d9;
    color:#fff;
    padding:12px;
    border-radius:9px;
    font-weight:700;
    cursor:pointer;
}

.gift-btn:hover{
    background:#063b91;
}

/* FOOTER */

.bottom-area{
    text-align:center;
    padding:10px 18px 35px;
}

.dashboard-btn{
    display:inline-block;
    text-decoration:none;
    background:#fff;
    border:1px solid #d9e1eb;
    color:#344054;
    padding:12px 20px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
}

/* CHECKOUT */

#checkout{
    display:none;
}

#checkout.active{
    display:block;
}

#productsSection.hidden{
    display:none;
}

.checkout-container{
    width:min(720px,100%);
    margin:auto;
    padding:25px 16px 40px;
}

.checkout-card{
    background:#fff;
    border:1px solid #e4e9f0;
    border-radius:20px;
    padding:22px;
    box-shadow:0 10px 35px rgba(16,24,40,.08);
}

.back-products{
    border:0;
    background:#eef3f8;
    color:#344054;
    padding:10px 14px;
    border-radius:9px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:20px;
}

.checkout-card h2{
    font-size:26px;
    margin-bottom:20px;
}

.selected-product{
    display:flex;
    align-items:center;
    gap:14px;
    background:#f5f8fc;
    padding:12px;
    border-radius:12px;
    margin-bottom:25px;
}

.selected-product img{
    width:75px;
    height:75px;
    object-fit:cover;
    border-radius:10px;
}

.selected-name{
    font-weight:800;
    font-size:14px;
}

.selected-price{
    color:#0757d9;
    font-weight:800;
    margin-top:6px;
}

.section-title{
    font-size:17px;
    font-weight:800;
    margin:23px 0 13px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
}

.form-group input,
.form-group textarea{
    width:100%;
    border:1px solid #d9e1eb;
    border-radius:10px;
    outline:none;
    padding:13px;
    font-size:14px;
}

.form-group input{
    height:49px;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#0757d9;
    box-shadow:0 0 0 3px rgba(7,87,217,.08);
}

.two-columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.summary{
    background:#f5f8fc;
    border-radius:13px;
    padding:17px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:13px;
    font-size:14px;
}

.summary-total{
    border-top:1px solid #dce3ec;
    padding-top:13px;
    font-size:18px;
    font-weight:800;
}

.balance{
    color:#087443;
    font-weight:800;
}

.confirm-btn{
    width:100%;
    border:0;
    background:#ffc928;
    color:#101828;
    padding:15px;
    border-radius:10px;
    margin-top:18px;
    font-weight:800;
    cursor:pointer;
}

.confirm-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:17px;
    font-size:13px;
    line-height:1.5;
}

.message.error{
    display:block;
    color:#b42318;
    background:#fff1f0;
    border:1px solid #ffd3d0;
}

.message.success{
    display:block;
    color:#087443;
    background:#ecfff4;
    border:1px solid #b9efd1;
}

@media(max-width:600px){

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .product-image{
        height:175px;
    }

    .product-info{
        padding:11px;
    }

    .product-name{
        font-size:13px;
    }

    .product-price{
        font-size:16px;
    }

    .gift-btn{
        font-size:12px;
        padding:11px 5px;
    }

    .two-columns{
        grid-template-columns:1fr;
        gap:0;
    }

    .checkout-card{
        padding:18px;
    }
}
</style>
</head>

</section>

                    ></div>

                    <div
                        class="selected-price"
                        id="selectedPrice"
                    ></div>

                </div>

            </div>


            <!-- CONTACT -->

            <div class="section-title">
                Contact Info
            </div>

            <div class="form-group">

                <label>
                    Your Phone
                </label>

                <input
                    id="yourPhone"
                    type="tel"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <!-- DELIVERY -->

            <div class="section-title">
                Delivery Info
            </div>

            <div class="form-group">

                <label>
                    Sender Name
                </label>

                <input
                    id="senderName"
                    type="text"
                    placeholder="Sender name"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Recipient Name
                </label>

                <input
                    id="recipientName"
                    type="text"
                    placeholder="Recipient name"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Recipient Phone
                </label>

                <input
                    id="recipientPhone"
                    type="tel"
                    placeholder="Recipient phone"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Street / House Address
                </label>

                <input
                    id="streetAddress"
                    type="text"
                    placeholder="Street / house address"
                    required
                >

            </div>


            <div class="two-columns">

                <div class="form-group">

                    <label>
                        City
                    </label>

                    <input
                        id="city"
                        type="text"
                        placeholder="City"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        State
                    </label>

                    <input
                        id="state"
                        type="text"
                        placeholder="State"
                        required
                    >

                </div>

            </div>


            <div class="two-columns">

                <div class="form-group">

                    <label>
                        Country
                    </label>

                    <input
                        id="country"
                        type="text"
                        placeholder="Country"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        ZIP Code
                    </label>

                    <input
                        id="zipCode"
                        type="text"
                        placeholder="ZIP Code"
                        required
                    >

                </div>

            </div>


            <!-- NOTES -->

            <div class="section-title">
                Additional Notes
            </div>

            <div class="form-group">

                <textarea
                    id="additionalNotes"
                    placeholder="Gift message or delivery instructions"
                ></textarea>

            </div>


            <!-- PAYMENT -->

            <div class="section-title">
                Payment Summary
            </div>

            <div class="summary">

                <div class="summary-row">

                    <span>
                        Base Price
                    </span>

                    <strong id="basePrice">
                        ₦0.00
                    </strong>

                </div>

                <div class="summary-row summary-total">

                    <span>
                        Total
                    </span>

                    <strong id="totalPrice">
                        ₦0.00
                    </strong>

                </div>

                <div class="summary-row">

                    <span>
                        Your Balance
                    </span>

                    <strong
                        class="balance"
                        id="checkoutBalance"
                    >
                        ₦0.00
                    </strong>

                </div>

            </div>


            <button
                type="button"
                class="confirm-btn"
                id="confirmOrder"
            >
                Confirm Order
            </button>

        </div>

    </div>

</section>


<!-- BOTTOM -->

<div class="bottom-area">

    <a
        href="dashboard.html"
        class="dashboard-btn"
    >
        ← Back to Dashboard
    </a>

</div>

    card.className =
        "product-card";

    card.innerHTML = `

        <img
            class="product-image"
            src="${product.image}"
            alt="${product.name}"
            loading="lazy"
        >

        <div class="product-info">

            <div class="product-name">
                ${product.name}
            </div>

            <div class="product-price">
                ${money(product.price)}
            </div>

            <button
                class="gift-btn"
                type="button"
            >
                Send as Gift
            </button>

        </div>
    `;

    card
        .querySelector(".gift-btn")
        .addEventListener(
            "click",
            ()=>openCheckout(product)
        );

    productsContainer.appendChild(card);

});


/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
    auth,
    async user=>{

        if(!user){

            currentUser = null;

            walletBalance.textContent =
                "₦0.00";

            return;
        }

        currentUser = user;

        await loadWallet();

    }
);


/* =====================================
   LOAD WALLET
===================================== */

async function loadWallet(){

    if(!currentUser)
        return;

    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );

        const snap =
            await getDoc(userRef);

        if(!snap.exists()){

            currentBalance = 0;

        }else{

            const data = snap.data();

            /*
             * Uses walletBalance from
             * your existing user document.
             */

            currentBalance =
                Number(
                    data.walletBalance || 0
                );
        }

        walletBalance.textContent =
            money(currentBalance);

        checkoutBalance.textContent =
            money(currentBalance);

    }catch(error){

        console.error(
            "Wallet error:",
            error
        );

    }
}


/* =====================================
   OPEN CHECKOUT
===================================== */

function openCheckout(product){

    if(!currentUser){

        alert(
            "Please login to your Fame Store account first."
        );

        return;
    }

    currentProduct = product;

    productsSection.classList.add("hidden");

    checkout.classList.add("active");

    document.getElementById(
        "selectedImage"
    ).src = product.image;

    document.getElementById(
        "selectedName"
    ).textContent = product.name;

    document.getElementById(
        "selectedPrice"
    ).textContent = money(product.price);

    document.getElementById(
        "basePrice"
    ).textContent = money(product.price);

    document.getElementById(
        "totalPrice"
    ).textContent = money(product.price);

    checkoutBalance.textContent =
        money(currentBalance);

    hideMessage();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================
   BACK TO PRODUCTS
===================================== */

document
    .getElementById("backProducts")
    .addEventListener(
        "click",
        ()=>{

            checkout.classList.remove("active");

            productsSection.classList.remove("hidden");

            hideMessage();
        }
    );


/* =====================================
   FORM VALIDATION
===================================== */

function validateForm(){

    const ids = [

        "yourPhone",
        "senderName",
        "recipientName",
        "recipientPhone",
        "streetAddress",
        "city",
        "state",
        "country",
        "zipCode"

    ];

    for(const id of ids){

        const field =
            document.getElementById(id);

        if(!field.value.trim()){

            showMessage(
                "Please complete all delivery information.",
                "error"
            );

            field.focus();

            return false;
        }
    }

    return true;
}


/* =====================================
   CONFIRM ORDER
===================================== */

document
    .getElementById("confirmOrder")
    .addEventListener(
        "click",
        async ()=>{

            if(orderProcessing)
                return;

            if(!currentUser){

                alert(
                    "Please login first."
                );

                return;
            }

            if(!currentProduct){

                showMessage(
                    "Please select a gift.",
                    "error"
                );

                return;
            }

            if(!validateForm())
                return;

            await loadWallet();

            const total =
                Number(
                    currentProduct.price
                );

            if(currentBalance < total){

                showMessage(
                    "Insufficient wallet balance.",
                    "error"
                );

                return;
            }

            orderProcessing = true;

            const button =
                document.getElementById(
                    "confirmOrder"
                );

            button.disabled = true;

            button.textContent =
                "Processing...";

            try{

                /*
                 * Create order.
                 */

                const orderRef =
                    await addDoc(
                        collection(
                            db,
                            "giftOrders"
                        ),
                        {

                            customerUID:
                                currentUser.uid,

                            customerEmail:
                                currentUser.email || "",

                            productName:
                                currentProduct.name,

                            productImage:
                                currentProduct.image,

                            basePrice:
                                total,

                            total:
                                total,

                            yourPhone:
                                document
                                    .getElementById(
                                        "yourPhone"
                                    )
                                    .value
                                    .trim(),

                            senderName:
                                document
                                    .getElementById(
                                        "senderName"
                                    )
                                    .value
                                    .trim(),

                            recipientName:
                                document
                                    .getElementById(
                                        "recipientName"
                                    )
                                    .value
                                    .trim(),

                            recipientPhone:
                                document
                                    .getElementById(
                                        "recipientPhone"
                                    )
                                    .value
                                    .trim(),

                            streetAddress:
                                document
                                    .getElementById(
                                        "streetAddress"
                                    )
                                    .value
                                    .trim(),

                            city:
                                document
                                    .getElementById(
                                        "city"
                                    )
                                    .value
                                    .trim(),

                            state:
                                document
                                    .getElementById(
                                        "state"
                                    )
                                    .value
                                    .trim(),

                            country:
                                document
                                    .getElementById(
                                        "country"
                                    )
                                    .value
                                    .trim(),

                            zipCode:
                                document
                                    .getElementById(
                                        "zipCode"
                                    )
                                    .value
                                    .trim(),

                            additionalNotes:
                                document
                                    .getElementById(
                                        "additionalNotes"
                                    )
                                    .value
                                    .trim(),

                            paymentMethod:
                                "Wallet",

                            paymentStatus:
                                "Paid",

                            status:
                                "Pending",

                            createdAt:
                                serverTimestamp()
                        }
                    );


                /*
                 * Deduct wallet.
                 */

                const userRef =
                    doc(
                        db,
                        "users",
                        currentUser.uid
                    );

                await updateDoc(
                    userRef,
                    {
                        walletBalance:
                            currentBalance - total
                    }
                );


                currentBalance -= total;

                walletBalance.textContent =
                    money(currentBalance);

                checkoutBalance.textContent =
                    money(currentBalance);


                button.textContent =
                    "Order Confirmed";


                showMessage(
                    "Your gift order has been submitted successfully.",
                    "success"
                );


                setTimeout(
                    ()=>{

                        window.location.href =
                            "dashboard.html";

                    },
                    1800
                );


            }catch(error){

                console.error(
                    "ORDER ERROR:",
                    error
                );

                showMessage(
                    error.message ||
                    "Unable to submit your order. Please try again.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Confirm Order";

            }finally{

                orderProcessing = false;

            }

        }
    );


/* =====================================
   MESSAGES
===================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;
}

function hideMessage(){

    message.textContent = "";

    message.className =
        "message";
}

</script>
