<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>USA Gifts | Fame Store</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f9ff;
            color: #101828;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        header {
            background: linear-gradient(
                135deg,
                #0757d9,
                #0d6efd
            );

            color: white;
            padding: 17px 20px;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
        }

        .wallet {
            background: rgba(255,255,255,.15);
            padding: 10px 14px;
            border-radius: 10px;

            font-size: 13px;
            font-weight: 700;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 18px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #667085;
            font-size: 14px;
        }

        .products {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 20px;
        }

        .product-card {
            background: white;

            border: 1px solid #e5eaf1;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 10px 30px
                rgba(7,87,217,.08);

            transition: .2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
        }

        .product-image {
            width: 100%;
            height: 245px;

            object-fit: cover;

            display: block;

            background: #edf2f7;
        }

        .product-info {
            padding: 17px;
        }

        .product-info h3 {
            font-size: 16px;
            margin-bottom: 9px;
        }

        .product-description {
            color: #667085;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .price {
            color: #0757d9;
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .gift-btn {
            width: 100%;
            border: 0;

            background: #0757d9;
            color: white;

            padding: 13px;

            border-radius: 10px;

            font-size: 14px;
            font-weight: 700;
        }

        .gift-btn:hover {
            background: #063b91;
        }

        #checkout {
            display: none;
        }

        #checkout.active {
            display: block;
        }

        #productsSection.hidden {
            display: none;
        }

        .checkout-container {
            max-width: 720px;
            margin: auto;
            padding: 30px 18px;
        }

        .checkout-card {
            background: white;

            border: 1px solid #e5eaf1;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 15px 45px
                rgba(7,87,217,.10);
        }

        .back-btn {
            border: 0;

            background: #eef3f9;
            color: #344054;

            padding: 11px 15px;

            border-radius: 9px;

            font-weight: 700;

            margin-bottom: 20px;
        }

        .checkout-title {
            font-size: 27px;
            margin-bottom: 20px;
        }

        .selected-product {
            display: flex;
            align-items: center;

            gap: 15px;

            padding: 13px;

            background: #f5f9ff;

            border-radius: 13px;

            margin-bottom: 25px;
        }

        .selected-product img {
            width: 75px;
            height: 75px;

            border-radius: 10px;

            object-fit: cover;
        }

        .selected-product-name {
            font-weight: 800;
            margin-bottom: 6px;
        }

        .selected-product-price {
            color: #0757d9;
            font-weight: 800;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;

            margin-top: 25px;
            margin-bottom: 13px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;

            border: 1px solid #d9e0ea;

            border-radius: 10px;

            padding: 13px;

            outline: none;

            font-size: 14px;

            background: white;
        }

        input {
            height: 50px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #0757d9;

            box-shadow:
                0 0 0 3px
                rgba(7,87,217,.08);
        }

        .row {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }

        .summary {
            background: #f5f9ff;

            border-radius: 14px;

            padding: 18px;

            margin-top: 10px;
        }

        .summary-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 13px;

            font-size: 14px;
        }

        .summary-total {
            border-top: 1px solid #dce4ef;

            padding-top: 14px;

            font-size: 18px;

            font-weight: 800;
        }

        .balance {
            color: #087443;
            font-weight: 800;
        }

        .confirm-btn {
            width: 100%;

            border: 0;

            background: #ffc928;

            color: #101828;

            padding: 15px;

            border-radius: 11px;

            font-size: 15px;

            font-weight: 800;

            margin-top: 18px;
        }

        .confirm-btn:hover {
            background: #f0b900;
        }

        .confirm-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;

            padding: 13px;

            border-radius: 10px;

            font-size: 13px;

            margin-bottom: 18px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            background: #fff1f0;

            color: #b42318;

            border: 1px solid #ffd3d0;
        }

        .message.success {
            display: block;

            background: #ecfff4;

            color: #087443;

            border: 1px solid #b9efd1;
        }

        @media(max-width:600px) {

            .logo {
                font-size: 20px;
            }

            .wallet {
                font-size: 12px;
            }

            .page-title h1 {
                font-size: 25px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .checkout-card {
                padding: 19px;
            }

            .checkout-title {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <div class="logo">
            Fame Store
        </div>

        <div class="wallet">
            Wallet:
            <span id="walletBalance">
                ₦0.00
            </span>
        </div>

    </div>

</header>



<section id="productsSection">

    <div class="container">

        <div class="page-title">

            <h1>
                🇺🇸 Gifts for United States
            </h1>

            <p>
                Choose a gift to send to someone special.
            </p>

        </div>

        <div
            class="products"
            id="products"
        ></div>

    </div>

</section>



<section id="checkout">

    <div class="checkout-container">

        <div class="checkout-card">

            <button
                class="back-btn"
                type="button"
                id="backButton"
            >
                ← Back to Gifts
            </button>

            <h2 class="checkout-title">
                Checkout
            </h2>

            <div
                id="message"
                class="message"
            ></div>


            <div class="selected-product">

                <img
                    id="selectedImage"
                    src=""
                    alt="Selected gift"
                >

                <div>

                    <div
                        class="selected-product-name"
                        id="selectedName"
                    ></div>

                    <div
                        class="selected-product-price"
                        id="selectedPrice"
                    ></div>

                </div>

            </div>


            <div class="section-title">
                Contact Info
            </div>


            <div class="form-group">

                <label>
                    Your Phone
                </label>

                <input
                    type="tel"
                    id="yourPhone"
                    placeholder="Enter your phone number"
                >

            </div>


            <div class="section-title">
                Delivery Info
            </div>


            <div class="form-group">

                <label>
                    Sender Name
                </label>

                <input
                    type="text"
                    id="senderName"
                    placeholder="Enter sender name"
                >

            </div>


            <div class="form-group">

                <label>
                    Recipient Name
                </label>

                <input
                    type="text"
                    id="recipientName"
                    placeholder="Enter recipient name"
                >

            </div>


            <div class="form-group">

                <label>
                    Recipient Phone
                </label>

                <input
                    type="tel"
                    id="recipientPhone"
                    placeholder="Recipient phone number"
                >

            </div>


            <div class="form-group">

                <label>
                    Street / House Address
                </label>

                <input
                    type="text"
                    id="streetAddress"
                    placeholder="Street / house address"
                >

            </div>


            <div class="row">

                <div class="form-group">

                    <label>
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="City"
                    >

                </div>


                <div class="form-group">

                    <label>
                        State
                    </label>

                    <input
                        type="text"
                        id="state"
                        placeholder="State"
                    >

                </div>

            </div>


            <div class="row">

                <div class="form-group">

                    <label>
                        Country
                    </label>

                    <input
                        type="text"
                        id="country"
                        value="United States"
                    >

                </div>


                <div class="form-group">

                    <label>
                        ZIP Code
                    </label>

                    <input
                        type="text"
                        id="zipCode"
                        placeholder="ZIP Code"
                    >

                </div>

            </div>


            <div class="section-title">
                Additional Notes
            </div>


            <textarea
                id="additionalNotes"
                placeholder="Gift message or additional delivery instructions..."
            ></textarea>


            <div class="section-title">
                Payment Summary
            </div>


            <div class="summary">

                <div class="summary-row">

                    <span>
                        Base Price
                    </span>

                    <strong id="basePrice">
                        ₦0.00
                    </strong>

                </div>


                <div class="summary-row summary-total">

                    <span>
                        Total
                    </span>

                    <strong id="totalPrice">
                        ₦0.00
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Your Balance
                    </span>

                    <strong
                        class="balance"
                        id="checkoutBalance"
                    >
                        ₦0.00
                    </strong>

                </div>

            </div>


            <button
                type="button"
                class="confirm-btn"
                id="confirmOrderBtn"
            >
                Confirm Order
            </button>

        </div>

    </div>

</section>



<script type="module">


/* =====================================
   FIREBASE
===================================== */

import {
    auth,
    db
} from "./firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    doc,
    getDoc,
    runTransaction,
    collection,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* =====================================
   VARIABLES
===================================== */

let currentUser = null;
let currentProduct = null;
let currentBalance = 0;
let submitting = false;



/* =====================================
   PRODUCTS
===================================== */

const products = [

    {
        id: "glass-flower-1",
        name: "Glass Flower",
        price: 25000,
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782105552_6a38c5d0188b3_media_698d3fd3b5d0a"
    },


    {
        id: "glass-flower-2",
        name: "Glass Flower",
        price: 25000,
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782105552_6a38c5d018a52_media_698d3fd332f71"
    },


    {
        id: "glass-flower-3",
        name: "Glass Flower",
        price: 25000,
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782108227_6a38d043ac1c8_media_698764375caff"
    },


    {
        id: "glass-flower-4",
        name: "Glass Flower",
        price: 25000,
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782108227_6a38d043ac419_Red"
    },


    {
        id: "glass-flower-5",
        name: "Glass Flower",
        price: 25000,
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782108227_6a38d043ac377_White"
    },


    {
        id: "preserved-roses-1",
        name: "Preserved Roses 4",
        price: 40000,
        description:
        "Preserved Roses in a Box, Eternal Rose Flowers for Delivery, Forever Preserved Roses",
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782109307_6a38d47b378c1_White"
    },


    {
        id: "preserved-roses-2",
        name: "Preserved Roses 4",
        price: 40000,
        description:
        "Preserved Roses in a Box, Eternal Rose Flowers for Delivery, Forever Preserved Roses",
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782109307_6a38d47b37620_Red"
    },


    {
        id: "artificial-rose-1",
        name: "Artificial Rose Flower Bouquet",
        price: 45000,
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782105871_6a38c70f8f05e_Mixed_White"
    },


    {
        id: "artificial-rose-2",
        name: "Artificial Rose Flower Bouquet",
        price: 45000,
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782105871_6a38c70f8f05e_Mixed_White"
    },


    {
        id: "artificial-rose-3",
        name: "Artificial Rose Flower Bouquet",
        price: 45000,
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782104837_6a38c3058ab65_Purple_1"
    },


    {
        id: "fresh-cut-1",
        name: "Fresh Cut Flower",
        price: 50000,
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782104837_6a38c3058ac3f_Blue"
    },


    {
        id: "fresh-cut-2",
        name: "Fresh Cut Flower",
        price: 50000,
        image:
        "https://res.cloudinary.com/lr5eqmp3/image/upload/f_auto,q_auto/1782108514_6a38d1621186d_media_699832785cec8"
    }

];



/* =====================================
   MONEY
===================================== */

function money(amount) {

    return "₦" +
        Number(amount).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}



/* =====================================
   RENDER PRODUCTS
===================================== */

const productsContainer =
    document.getElementById(
        "products"
    );


function renderProducts() {

    productsContainer.innerHTML = "";


    products.forEach(product => {


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "product-card";


        card.innerHTML = `

            <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
                loading="lazy"
            >

            <div class="product-info">

                <h3>
                    ${product.name}
                </h3>

                ${
                    product.description
                    ? `
                        <div class="product-description">
                            ${product.description}
                        </div>
                    `
                    : ""
                }

                <div class="price">
                    ${money(product.price)}
                </div>

                <button
                    class="gift-btn"
                    type="button"
                >
                    Send as Gift
                </button>

            </div>

        `;


        card
            .querySelector(".gift-btn")
            .addEventListener(
                "click",
                () => openCheckout(product)
            );


        productsContainer.appendChild(
            card
        );

    });

}


renderProducts();



/* =====================================
   AUTH STATE
===================================== */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            currentUser = null;

            document.getElementById(
                "walletBalance"
            ).textContent = "₦0.00";

            document.getElementById(
                "checkoutBalance"
            ).textContent = "₦0.00";

            return;

        }


        currentUser = user;

        console.log(
            "Logged in UID:",
            user.uid
        );


        await loadWallet();

    }
);



/* =====================================
   LOAD WALLET
===================================== */

async function loadWallet() {

    if (!currentUser)
        return;


    try {

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const userSnap =
            await getDoc(
                userRef
            );


        if (
            !userSnap.exists()
        ) {

            currentBalance = 0;

        } else {

            const data =
                userSnap.data();


            currentBalance =
                Number(
                    data.walletBalance || 0
                );

        }


        document.getElementById(
            "walletBalance"
        ).textContent =
            money(currentBalance);


        document.getElementById(
            "checkoutBalance"
        ).textContent =
            money(currentBalance);


    } catch (error) {

        console.error(
            "WALLET ERROR:",
            error
        );

    }

}



/* =====================================
   OPEN CHECKOUT
===================================== */

function openCheckout(product) {

    if (!currentUser) {

        alert(
            "Please login to your Fame Store account first."
        );

        return;

    }


    currentProduct =
        product;


    document
        .getElementById(
            "productsSection"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "checkout"
        )
        .classList.add(
            "active"
        );


    document.getElementById(
        "selectedImage"
    ).src =
        product.image;


    document.getElementById(
        "selectedName"
    ).textContent =
        product.name;


    document.getElementById(
        "selectedPrice"
    ).textContent =
        money(product.price);


    document.getElementById(
        "basePrice"
    ).textContent =
        money(product.price);


    document.getElementById(
        "totalPrice"
    ).textContent =
        money(product.price);


    document.getElementById(
        "checkoutBalance"
    ).textContent =
        money(currentBalance);


    hideMessage();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* =====================================
   BACK
===================================== */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "checkout"
                )
                .classList.remove(
                    "active"
                );


            document
                .getElementById(
                    "productsSection"
                )
                .classList.remove(
                    "hidden"
                );


            hideMessage();

        }
    );



/* =====================================
   VALIDATION
===================================== */

function validateForm() {

    const fields = [

        "yourPhone",
        "senderName",
        "recipientName",
        "recipientPhone",
        "streetAddress",
        "city",
        "state",
        "country",
        "zipCode"

    ];


    for (
        const id of fields
    ) {

        const field =
            document.getElementById(
                id
            );


        if (
            !field.value.trim()
        ) {

            showMessage(
                "Please complete all required delivery information.",
                "error"
            );


            field.focus();


            return false;

        }

    }


    return true;

}



/* =====================================
   CONFIRM ORDER
===================================== */

document
    .getElementById(
        "confirmOrderBtn"
    )
    .addEventListener(
        "click",
        async () => {


            if (submitting)
                return;


            if (!currentUser) {

                alert(
                    "Your login session has expired. Please login again."
                );

                return;

            }


            if (!currentProduct) {

                alert(
                    "Please select a gift first."
                );

                return;

            }


            if (!validateForm())
                return;


            await loadWallet();


            const total =
                Number(
                    currentProduct.price
                );


            if (
                currentBalance < total
            ) {

                showMessage(
                    `Insufficient wallet balance. Your balance is ${money(currentBalance)}.`,
                    "error"
                );

                return;

            }


            submitting = true;


            const button =
                document.getElementById(
                    "confirmOrderBtn"
                );


            button.disabled = true;

            button.textContent =
                "Processing...";


            try {


                const userRef =
                    doc(
                        db,
                        "users",
                        currentUser.uid
                    );


                const orderRef =
                    doc(
                        collection(
                            db,
                            "giftOrders"
                        )
                    );


                await runTransaction(
                    db,
                    async transaction => {


                        const userSnap =
                            await transaction.get(
                                userRef
                            );


                        if (
                            !userSnap.exists()
                        ) {

                            throw new Error(
                                "Customer profile was not found."
                            );

                        }


                        const userData =
                            userSnap.data();


                        const wallet =
                            Number(
                                userData.walletBalance || 0
                            );


                        if (
                            wallet < total
                        ) {

                            throw new Error(
                                "Insufficient wallet balance."
                            );

                        }


                        /*
                         * DEDUCT WALLET
                         */

                        transaction.update(
                            userRef,
                            {
                                walletBalance:
                                    wallet - total
                            }
                        );


                        /*
                         * CREATE GIFT ORDER
                         */

                        transaction.set(
                            orderRef,
                            {

                                customerUID:
                                    currentUser.uid,

                                customerEmail:
                                    currentUser.email || "",

                                productId:
                                    currentProduct.id,

                                productName:
                                    currentProduct.name,

                                productImage:
                                    currentProduct.image,

                                basePrice:
                                    total,

                                total:
                                    total,

                                yourPhone:
                                    document
                                        .getElementById(
                                            "yourPhone"
                                        )
                                        .value
                                        .trim(),

                                senderName:
                                    document
                                        .getElementById(
                                            "senderName"
                                        )
                                        .value
                                        .trim(),

                                recipientName:
                                    document
                                        .getElementById(
                                            "recipientName"
                                        )
                                        .value
                                        .trim(),

                                recipientPhone:
                                    document
                                        .getElementById(
                                            "recipientPhone"
                                        )
                                        .value
                                        .trim(),

                                streetAddress:
                                    document
                                        .getElementById(
                                            "streetAddress"
                                        )
                                        .value
                                        .trim(),

                                city:
                                    document
                                        .getElementById(
                                            "city"
                                        )
                                        .value
                                        .trim(),

                                state:
                                    document
                                        .getElementById(
                                            "state"
                                        )
                                        .value
                                        .trim(),

                                country:
                                    document
                                        .getElementById(
                                            "country"
                                        )
                                        .value
                                        .trim(),

                                zipCode:
                                    document
                                        .getElementById(
                                            "zipCode"
                                        )
                                        .value
                                        .trim(),

                                additionalNotes:
                                    document
                                        .getElementById(
                                            "additionalNotes"
                                        )
                                        .value
                                        .trim(),

                                deliveryCountry:
                                    "United States",

                                paymentMethod:
                                    "wallet",

                                paymentStatus:
                                    "paid",

                                status:
                                    "pending",

                                createdAt:
                                    serverTimestamp()

                            }
                        );

                    }
                );


                currentBalance -=
                    total;


                document.getElementById(
                    "walletBalance"
                ).textContent =
                    money(currentBalance);


                document.getElementById(
                    "checkoutBalance"
                ).textContent =
                    money(currentBalance);


                button.textContent =
                    "Order Confirmed";


                showMessage(
                    "Gift order confirmed successfully. Your wallet has been charged and your order is pending.",
                    "success"
                );


                setTimeout(
                    () => {

                        /*
                         * Change this filename if
                         * your order-history page
                         * has a different name.
                         */

                        window.location.href =
                            "gift-orders.html";

                    },
                    1500
                );


            } catch (error) {

                console.error(
                    "GIFT ORDER ERROR:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to complete the gift order.",
                    "error"
                );


                button.disabled =
                    false;


                button.textContent =
                    "Confirm Order";


                await loadWallet();

            } finally {

                submitting = false;

            }

        }
    );



/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;

}


function hideMessage() {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        "";


    message.className =
        "message";

}

</script>
