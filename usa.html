<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>USA Gifts | Fame Store</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f9ff;
            color: #101828;
        }


        button,
        input,
        textarea {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        /* HEADER */

        header {
            background: linear-gradient(
                135deg,
                #0757d9,
                #0d6efd
            );

            color: white;
            padding: 17px 20px;

            position: sticky;
            top: 0;

            z-index: 100;
        }


        .header-inner {
            max-width: 1200px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }


        .logo {
            font-size: 23px;
            font-weight: 800;
        }


        .wallet {
            background: rgba(255,255,255,.15);
            padding: 10px 14px;
            border-radius: 10px;

            font-size: 13px;
            font-weight: 700;
        }


        /* CONTAINER */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 18px;
        }


        .page-title {
            text-align: center;
            margin-bottom: 28px;
        }


        .page-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }


        .page-title p {
            color: #667085;
            font-size: 14px;
        }


        /* PRODUCTS */

        .products {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 20px;
        }


        .product-card {
            background: white;

            border: 1px solid #e5eaf1;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 10px 30px
                rgba(7,87,217,.08);

            transition: .2s;
        }


        .product-card:hover {
            transform: translateY(-4px);
        }


        .product-image {
            width: 100%;
            height: 245px;

            object-fit: cover;

            display: block;

            background: #edf2f7;
        }


        .product-info {
            padding: 17px;
        }


        .product-info h3 {
            font-size: 16px;
            margin-bottom: 9px;
        }


        .product-description {
            color: #667085;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 10px;
        }


        .price {
            color: #0757d9;
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 14px;
        }


        .gift-btn {
            width: 100%;
            border: 0;

            background: #0757d9;
            color: white;

            padding: 13px;

            border-radius: 10px;

            font-size: 14px;
            font-weight: 700;
        }


        .gift-btn:hover {
            background: #063b91;
        }


        /* CHECKOUT */

        #checkout {
            display: none;
        }


        #checkout.active {
            display: block;
        }


        #productsSection.hidden {
            display: none;
        }


        .checkout-container {
            max-width: 720px;
            margin: auto;
            padding: 30px 18px;
        }


        .checkout-card {
            background: white;

            border: 1px solid #e5eaf1;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 15px 45px
                rgba(7,87,217,.10);
        }


        .back-btn {
            border: 0;

            background: #eef3f9;
            color: #344054;

            padding: 11px 15px;

            border-radius: 9px;

            font-weight: 700;

            margin-bottom: 20px;
        }


        .checkout-title {
            font-size: 27px;
            margin-bottom: 20px;
        }


        /* SELECTED PRODUCT */

        .selected-product {
            display: flex;
            align-items: center;

            gap: 15px;

            padding: 13px;

            background: #f5f9ff;

            border-radius: 13px;

            margin-bottom: 25px;
        }


        .selected-product img {
            width: 75px;
            height: 75px;

            border-radius: 10px;

            object-fit: cover;
        }


        .selected-product-name {
            font-weight: 800;
            margin-bottom: 6px;
        }


        .selected-product-price {
            color: #0757d9;
            font-weight: 800;
        }


        /* SECTION */

        .section-title {
            font-size: 18px;
            font-weight: 800;

            margin-top: 25px;
            margin-bottom: 13px;
        }


        .form-group {
            margin-bottom: 15px;
        }


        label {
            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;
        }


        input,
        textarea {
            width: 100%;

            border: 1px solid #d9e0ea;

            border-radius: 10px;

            padding: 13px;

            outline: none;

            font-size: 14px;

            background: white;
        }


        input {
            height: 50px;
        }


        textarea {
            min-height: 100px;

            resize: vertical;
        }


        input:focus,
        textarea:focus {
            border-color: #0757d9;

            box-shadow:
                0 0 0 3px
                rgba(7,87,217,.08);
        }


        .row {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }


        /* SUMMARY */

        .summary {
            background: #f5f9ff;

            border-radius: 14px;

            padding: 18px;

            margin-top: 10px;
        }


        .summary-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 13px;

            font-size: 14px;
        }


        .summary-row:last-child {
            margin-bottom: 0;
        }


        .summary-total {
            border-top: 1px solid #dce4ef;

            padding-top: 14px;

            font-size: 18px;

            font-weight: 800;
        }


        .balance {
            color: #087443;
            font-weight: 800;
        }


        /* CONFIRM */

        .confirm-btn {
            width: 100%;

            border: 0;

            background: #ffc928;

            color: #101828;

            padding: 15px;

            border-radius: 11px;

            font-size: 15px;

            font-weight: 800;

            margin-top: 18px;
        }


        .confirm-btn:hover {
            background: #f0b900;
        }


        .confirm-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }


        /* MESSAGE */

        .message {
            display: none;

            padding: 13px;

            border-radius: 10px;

            font-size: 13px;

            margin-bottom: 18px;

            line-height: 1.5;
        }


        .message.error {
            display: block;

            background: #fff1f0;

            color: #b42318;

            border: 1px solid #ffd3d0;
        }


        .message.success {
            display: block;

            background: #ecfff4;

            color: #087443;

            border: 1px solid #b9efd1;
        }


        /* MOBILE */

        @media(max-width: 600px) {

            .header-inner {
                align-items: flex-start;
            }


            .logo {
                font-size: 20px;
            }


            .wallet {
                font-size: 12px;
            }


            .page-title h1 {
                font-size: 25px;
            }


            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }


            .checkout-card {
                padding: 19px;
            }


            .checkout-title {
                font-size: 24px;
            }


            .product-image {
                height: 230px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

</header>



<!-- =====================================

===================================== -->

<section

>

<!-- =====================================

<section

    <div class="checkout-container">

            <!-- CONTACT INFO -->

            <!-- DELIVERY INFO -->

            <!-- PAYMENT SUMMARY -->

            <div class="section-title">
                Payment Summary
            </div>


            <div class="summary">


                <div class="summary-row">

                    <span>
                        Base Price
                    </span>

                    <strong id="basePrice">
                        ₦0.00
                    </strong>

                </div>


                <div
                    class="summary-row summary-total"
                >

                    <span>
                        Total
                    </span>

                    <strong id="totalPrice">
                        ₦0.00
                    </strong>

                    <span>
                        Your Balance

</section>



<!-- =====================================
     FIREBASE
===================================== -->

<script type="module">


/* =====================================
   USE EXISTING FAME STORE FIREBASE
===================================== */

import {

    auth,

    db

} from "./firebase-config.js";


import {

    onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {

    doc,
    getDoc,
    runTransaction,
    collection,
    serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* =====================================
   VARIABLES
===================================== */

let currentUser = null;

let currentProduct = null;

let currentBalance = 0;

let submitting = false;



/* =====================================
   ELEMENTS
===================================== */

const productsContainer =
    document.getElementById(
        "products"
    );


const productsSection =
    document.getElementById(
        "productsSection"
    );


const checkout =
    document.getElementById(
        "checkout"
    );


const walletBalance =
    document.getElementById(
        "walletBalance"
    );


const checkoutBalance =
    document.getElementById(
        "checkoutBalance"
    );


const message =
    document.getElementById(
        "message"
    );


const confirmButton =
    document.getElementById(
        "confirmOrderBtn"
    );



/* =====================================
   MONEY
===================================== */

function money(amount) {

    return "₦" +
        Number(amount).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}



/* =====================================
   PRODUCTS
===================================== */

/*
 * These are your 11 products.
 *
 * The links you supplied are ImgBB
 * page links. They are stored below
 * so you don't lose them.
 *
 * When you click "Direct link" in ImgBB,
 * replace the image value with the
 * i.ibb.co direct URL.
 */

const products = [

    {
        id: "glass-flower-1",
        name: "Glass Flower",
        price: 25000,
        image: "https://ibb.co/1G4w6FcY"
    },


    {
        id: "glass-flower-2",
        name: "Glass Flower",
        price: 25000,
        image: "https://ibb.co/kVYZJqYQ"
    },


    {
        id: "glass-flower-3",
        name: "Glass Flower",
        price: 25000,
        image: "https://ibb.co/fVC8n5bm"
    },


    {
        id: "glass-flower-4",
        name: "Glass Flower",
        price: 25000,
        image: "https://ibb.co/wNH6FcrG"
    },


    {
        id: "preserved-roses-1",
        name: "Preserved Roses 4",
        price: 40000,

        description:
            "Preserved Roses in a Box, Eternal Rose Flowers for Delivery, Forever Preserved Roses",

        image: "https://ibb.co/99DG2t7z"
    },


    {
        id: "preserved-roses-2",
        name: "Preserved Roses 4",
        price: 40000,

        description:
            "Preserved Roses in a Box, Eternal Rose Flowers for Delivery, Forever Preserved Roses",

        image: "https://ibb.co/67HSNCxw"
    },


    {
        id: "artificial-rose-1",
        name: "Artificial Rose Flower Bouquet",
        price: 45000,
        image: "https://ibb.co/xtSHGCpG"
    },


    {
        id: "artificial-rose-2",
        name: "Artificial Rose Flower Bouquet",
        price: 45000,
        image: "https://ibb.co/Ps6nVhPg"
    },


    {
        id: "artificial-rose-3",
        name: "Artificial Rose Flower Bouquet",
        price: 45000,
        image: "https://ibb.co/CsnTknXS"
    },


    {
        id: "fresh-cut-1",
        name: "Fresh Cut Flower",
        price: 50000,
        image: "https://ibb.co/D0g5XDw"
    },


    {
        id: "fresh-cut-2",
        name: "Fresh Cut Flower",
        price: 50000,
        image: "https://ibb.co/DhFkJ9Y"
    }

];



/* =====================================
   SHOW PRODUCTS
===================================== */

function renderProducts() {

    productsContainer.innerHTML = "";


    products.forEach(product => {


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "product-card";


        card.innerHTML = `

            <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
            >

            <div class="product-info">

                <h3>
                    ${product.name}
                </h3>

                ${
                    product.description
                    ? `
                        <div class="product-description">
                            ${product.description}
                        </div>
                    `
                    : ""
                }

                <div class="price">
                    ${money(product.price)}
                </div>

                <button
                    class="gift-btn"
                    type="button"
                >
                    Send as Gift
                </button>

            </div>

        `;


        card
            .querySelector(".gift-btn")
            .addEventListener(
                "click",
                () => openCheckout(product)
            );


        productsContainer.appendChild(
            card
        );

    });

}


renderProducts();



/* =====================================
   AUTH STATE
===================================== */

onAuthStateChanged(
    auth,
    async user => {


        if (!user) {

            currentUser = null;

            walletBalance.textContent =
                "₦0.00";

            checkoutBalance.textContent =
                "₦0.00";

            console.log(
                "Fame Store: customer is not logged in."
            );

            return;

        }


        currentUser = user;


        console.log(
            "Fame Store logged-in UID:",
            user.uid
        );


        await loadWallet();

    }
);



/* =====================================
   LOAD WALLET
===================================== */

async function loadWallet() {


    if (!currentUser) return;


    try {


        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const userSnap =
            await getDoc(
                userRef
            );


        if (!userSnap.exists()) {

            currentBalance = 0;

        } else {

            const data =
                userSnap.data();


            currentBalance =
                Number(
                    data.walletBalance || 0
                );

        }


        walletBalance.textContent =
            money(currentBalance);


        checkoutBalance.textContent =
            money(currentBalance);


    } catch (error) {


        console.error(
            "Wallet loading error:",
            error
        );


    }

}



/* =====================================
   OPEN CHECKOUT
===================================== */

function openCheckout(product) {


    if (!currentUser) {

        alert(
            "Please login to your Fame Store account first."
        );

        return;

    }


    currentProduct =
        product;


    productsSection.classList.add(
        "hidden"
    );


    checkout.classList.add(
        "active"
    );


    document.getElementById(
        "selectedImage"
    ).src =
        product.image;


    document.getElementById(
        "selectedName"
    ).textContent =
        product.name;


    document.getElementById(
        "selectedPrice"
    ).textContent =
        money(product.price);


    document.getElementById(
        "basePrice"
    ).textContent =
        money(product.price);


    document.getElementById(
        "totalPrice"
    ).textContent =
        money(product.price);


    checkoutBalance.textContent =
        money(currentBalance);


    hideMessage();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* =====================================
   BACK
===================================== */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        () => {


            checkout.classList.remove(
                "active"
            );


            productsSection.classList.remove(
                "hidden"
            );


            hideMessage();


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }
    );



/* =====================================
   VALIDATE FORM
===================================== */

function validateForm() {


    const fields = [

        "yourPhone",
        "senderName",
        "recipientName",
        "recipientPhone",
        "streetAddress",
        "city",
        "state",
        "country",
        "zipCode"

    ];


    for (
        const id of fields
    ) {


        const field =
            document.getElementById(
                id
            );


        if (
            !field.value.trim()
        ) {


            showMessage(
                "Please complete all required delivery information.",
                "error"
            );


            field.focus();


            return false;

        }

    }


    return true;

}



/* =====================================
   CONFIRM ORDER
===================================== */

confirmButton.addEventListener(
    "click",
    async () => {


        if (submitting)
            return;


        if (!currentUser) {

            alert(
                "Your login session has expired. Please login again."
            );

            return;

        }


        if (!currentProduct) {

            alert(
                "Please select a gift first."
            );

            return;

        }


        if (!validateForm())
            return;


        /*
         * Refresh balance from Firestore
         * before processing payment.
         */

        await loadWallet();


        const total =
            Number(
                currentProduct.price
            );


        if (
            currentBalance < total
        ) {


            showMessage(
                `Insufficient wallet balance. Your balance is ${money(currentBalance)}.`,
                "error"
            );


            return;

        }


        submitting = true;


        confirmButton.disabled =
            true;


        confirmButton.textContent =
            "Processing...";


        try {


            const userRef =
                doc(
                    db,
                    "users",
                    currentUser.uid
                );


            const orderRef =
                doc(
                    collection(
                        db,
                        "giftOrders"
                    )
                );


            await runTransaction(
                db,
                async transaction => {


                    const userSnap =
                        await transaction.get(
                            userRef
                        );


                    if (
                        !userSnap.exists()
                    ) {

                        throw new Error(
                            "Customer profile was not found."
                        );

                    }


                    const userData =
                        userSnap.data();


                    const wallet =
                        Number(
                            userData.walletBalance || 0
                        );


                    /*
                     * IMPORTANT:
                     * Check balance again
                     * inside transaction.
                     */

                    if (
                        wallet < total
                    ) {

                        throw new Error(
                            "Insufficient wallet balance."
                        );

                    }


                    /*
                     * DEDUCT WALLET
                     */

                    transaction.update(
                        userRef,
                        {
                            walletBalance:
                                wallet - total
                        }
                    );


                    /*
                     * CREATE ORDER
                     */

                    transaction.set(
                        orderRef,
                        {

                            customerUID:
                                currentUser.uid,


                            customerEmail:
                                currentUser.email || "",


                            productId:
                                currentProduct.id,


                            productName:
                                currentProduct.name,


                            productImage:
                                currentProduct.image,


                            basePrice:
                                total,


                            total:
                                total,


                            customerPhone:
                                document
                                    .getElementById(
                                        "yourPhone"
                                    )
                                    .value
                                    .trim(),


                            senderName:
                                document
                                    .getElementById(
                                        "senderName"
                                    )
                                    .value
                                    .trim(),


                            recipientName:
                                document
                                    .getElementById(
                                        "recipientName"
                                    )
                                    .value
                                    .trim(),


                            recipientPhone:
                                document
                                    .getElementById(
                                        "recipientPhone"
                                    )
                                    .value
                                    .trim(),


                            streetAddress:
                                document
                                    .getElementById(
                                        "streetAddress"
                                    )
                                    .value
                                    .trim(),


                            city:
                                document
                                    .getElementById(
                                        "city"
                                    )
                                    .value
                                    .trim(),


                            state:
                                document
                                    .getElementById(
                                        "state"
                                    )
                                    .value
                                    .trim(),


                            country:
                                document
                                    .getElementById(
                                        "country"
                                    )
                                    .value
                                    .trim(),


                            zipCode:
                                document
                                    .getElementById(
                                        "zipCode"
                                    )
                                    .value
                                    .trim(),


                            additionalNotes:
                                document
                                    .getElementById(
                                        "additionalNotes"
                                    )
                                    .value
                                    .trim(),


                            deliveryCountry:
                                "United States",


                            paymentMethod:
                                "wallet",


                            paymentStatus:
                                "paid",


                            status:
                                "pending",


                            createdAt:
                                serverTimestamp()

                        }
                    );

                }
            );


            /*
             * UPDATE DISPLAYED BALANCE
             */

            currentBalance -=
                total;


            walletBalance.textContent =
                money(currentBalance);


            checkoutBalance.textContent =
                money(currentBalance);


            confirmButton.textContent =
                "Order Confirmed";


            showMessage(
                "Gift order confirmed successfully. Your wallet has been charged and the order is now pending.",
                "success"
            );


            /*
             * Send customer to order
             * history after success.
             */

            setTimeout(
                () => {

                    window.location.href =
                        "gift-orders.html";

                },
                1500
            );


        } catch (error) {


            console.error(
                "Gift order error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to complete the gift order.",
                "error"
            );


            confirmButton.disabled =
                false;


            confirmButton.textContent =
                "Confirm Order";


            await loadWallet();


        } finally {

            submitting = false;

        }

    }
);



/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;


    message.className =
        "message " + type;

}


function hideMessage() {

    message.textContent =
        "";


    message.className =
        "message";

}


</script>


</body>

</html>
