<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>USA 🇺🇸 Gifts | Fame Store</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f9ff;
    color: #101828;
}

/* =========================
   HEADER
========================= */

.header {
    background: #ffffff;
    border-bottom: 1px solid #e5eaf1;
    padding: 15px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.header-inner {
    width: min(1150px, 100%);
    margin: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 45px;
    height: 45px;
    background: #ffc928;
    border-radius: 13px;
    display: grid;
    place-items: center;
    font-size: 22px;
}

.brand h1 {
    color: #0757d9;
    font-size: 19px;
}

.brand p {
    color: #667085;
    font-size: 11px;
    margin-top: 3px;
}


/* =========================
   MAIN
========================= */

.container {
    width: min(1150px, 100%);
    margin: auto;
    padding: 25px 15px 50px;
}


/* =========================
   TITLE
========================= */

.page-title {
    margin-bottom: 22px;
}

.page-title h2 {
    font-size: 25px;
    margin-bottom: 6px;
}

.page-title p {
    color: #667085;
    font-size: 13px;
    line-height: 1.5;
}


/* =========================
   COUNTRY
========================= */

.country-box {
    background: #ffffff;
    border: 1px solid #e5eaf1;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.country-flag {
    font-size: 32px;
}

.country-box h3 {
    font-size: 15px;
}

.country-box p {
    color: #667085;
    font-size: 11px;
    margin-top: 3px;
}


/* =========================
   PRODUCTS GRID
========================= */

.products-grid {

    display: grid;

    /*
       3 products per row on phone
    */
    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}


/* =========================
   PRODUCT CARD
========================= */

.product-card {

    background: #ffffff;

    border: 1px solid #e5eaf1;

    border-radius: 14px;

    overflow: hidden;

    cursor: pointer;

    text-decoration: none;

    color: #101828;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;

}

.product-card:hover {

    transform: translateY(-4px);

    border-color: #b9d0ff;

    box-shadow:
        0 10px 25px
        rgba(7, 87, 217, .10);

}


/* =========================
   IMAGE
========================= */

.product-image {

    width: 100%;

    aspect-ratio: 1 / 1;

    background: #f2f5f9;

    overflow: hidden;

    position: relative;

}

.product-image img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    transition:
        transform .3s ease;

}

.product-card:hover
.product-image img {

    transform: scale(1.06);

}


/* =========================
   EMOJI FALLBACK
========================= */

.image-fallback {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 45px;

    background:
        linear-gradient(
            135deg,
            #f5f9ff,
            #fffbea
        );

}


/* =========================
   PRODUCT NAME
========================= */

.product-info {

    padding: 10px 8px 12px;

    text-align: center;

}

.product-name {

    font-size: 11px;

    font-weight: 700;

    line-height: 1.3;

}


/* =========================
   BACK
========================= */

.back {

    display: block;

    width: fit-content;

    margin: 25px auto 0;

    color: #0757d9;

    text-decoration: none;

    font-size: 12px;

    font-weight: 700;

}

.back:hover {
    text-decoration: underline;
}


/* =========================
   TABLET
========================= */

@media (min-width: 700px) {

    .products-grid {

        grid-template-columns:
            repeat(4, 1fr);

        gap: 15px;

    }

    .product-name {
        font-size: 13px;
    }

}


/* =========================
   DESKTOP
========================= */

@media (min-width: 1000px) {

    .products-grid {

        grid-template-columns:
            repeat(4, 1fr);

        gap: 18px;

    }

    .product-info {
        padding: 13px;
    }

    .product-name {
        font-size: 14px;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 360px) {

    .products-grid {

        gap: 8px;

    }

    .product-name {

        font-size: 10px;

    }

    .product-info {

        padding: 8px 5px 10px;

    }

}

</style>

</head>


<body>


<!-- =========================
