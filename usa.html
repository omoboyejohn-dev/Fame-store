<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>USA Gifts | Fame Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #0d47a1, #1565c0);
      color: white;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .wallet {
      background: rgba(255,255,255,.15);
      padding: 10px 15px;
      border-radius: 12px;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 18px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .page-title h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #687386;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
      transition: .25s;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .product-info {
      padding: 16px;
    }

    .product-info h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .price {
      color: #0d47a1;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 13px 16px;
      font-weight: 700;
      width: 100%;
    }

    .gift-btn {
      background: #0d47a1;
      color: white;
    }

    .gift-btn:hover {
      background: #083579;
    }

    /* CHECKOUT */

    .checkout {
      display: none;
      max-width: 700px;
      margin: 20px auto;
    }

    .checkout.active {
      display: block;
    }

    .products-section.hidden {
      display: none;
    }

    .back-btn {
      background: #e9eef7;
      color: #172033;
      margin-bottom: 15px;
    }

    .checkout-card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .checkout-card h2 {
      margin-bottom: 22px;
    }

    .selected-product {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px;
      background: #f5f7fb;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .selected-product img {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin: 25px 0 12px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8deea;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      margin-bottom: 14px;
    }

    input:focus,
    textarea:focus {
      border-color: #1565c0;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary {
      background: #f5f7fb;
      padding: 18px;
      border-radius: 14px;
      margin-top: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .summary-row.total {
      border-top: 1px solid #d8deea;
      padding-top: 14px;
      font-size: 18px;
      font-weight: 800;
    }

    .balance {
      color: #16803c;
      font-weight: 700;
    }

    .confirm-btn {
      background: #f4c400;
      color: #111;
      margin-top: 18px;
      font-size: 16px;
    }

    .confirm-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .message.error {
      display: block;
      background: #ffe8e8;
      color: #b42318;
    }

    .message.success {
      display: block;
      background: #e8f8ee;
      color: #16743a;
    }

    @media(max-width:600px) {
      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .product-card img {
        height: 220px;
      }

      .checkout-card {
        padding: 18px;
      }

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">Fame Store</div>

    <div class="wallet">
      Wallet:
      <span id="walletBalance">₦0.00</span>
    </div>
  </div>
</header>


<!-- ================= PRODUCTS ================= -->

<section class="products-section" id="productsSection">

  <div class="container">

    <div class="page-title">
      <h1>🇺🇸 Gifts for United States</h1>
      <p>Choose a gift to send to someone special.</p>
    </div>

    <div class="products" id="products"></div>

  </div>

</section>


<!-- ================= CHECKOUT ================= -->

<section class="checkout" id="checkout">

  <div class="checkout-card">

    <button class="back-btn" onclick="goBack()">
      ← Back to Gifts
    </button>

    <h2>Checkout</h2>

    <div id="message" class="message"></div>

    <!-- Selected Product -->

    <div class="selected-product">

      <img id="selectedImage" src="" alt="Gift">

      <div>
        <strong id="selectedName"></strong>

        <div class="price" id="selectedPrice"></div>
      </div>

    </div>


    <!-- CONTACT INFO -->

    <div class="section-title">
      Contact Info
    </div>

    <label>Your Phone</label>

    <input
      type="tel"
      id="yourPhone"
      placeholder="Enter your phone number"
      required
    >


    <!-- DELIVERY INFO -->

    <div class="section-title">
      Delivery Info
    </div>

    <label>Sender Name</label>

    <input
      type="text"
      id="senderName"
      placeholder="Enter sender name"
      required
    >


    <label>Recipient Name</label>

    <input
      type="text"
      id="recipientName"
      placeholder="Enter recipient name"
      required
    >


    <label>Recipient Phone</label>

    <input
      type="tel"
      id="recipientPhone"
      placeholder="Recipient phone number"
      required
    >


    <label>Street / House Address</label>

    <input
      type="text"
      id="streetAddress"
      placeholder="Street / house address"
      required
    >


    <div class="row">

      <div>
        <label>City</label>

        <input
          type="text"
          id="city"
          placeholder="City"
          required
        >
      </div>

      <div>
        <label>State</label>

        <input
          type="text"
          id="state"
          placeholder="State"
          required
        >
      </div>

    </div>


    <div class="row">

      <div>
        <label>Country</label>

        <input
          type="text"
          id="country"
          value="United States"
          required
        >
      </div>

      <div>
        <label>ZIP Code</label>

        <input
          type="text"
          id="zipCode"
          placeholder="ZIP Code"
          required
        >
      </div>

    </div>


    <!-- NOTES -->

    <div class="section-title">
      Additional Notes
    </div>

    <textarea
      id="additionalNotes"
      placeholder="Gift message or additional delivery instructions..."
    ></textarea>


    <!-- PAYMENT SUMMARY -->

    <div class="section-title">
      Payment Summary
    </div>

    <div class="summary">

      <div class="summary-row">
        <span>Base Price</span>
        <strong id="basePrice">₦0.00</strong>
      </div>

      <div class="summary-row total">
        <span>Total</span>
        <strong id="totalPrice">₦0.00</strong>
      </div>

      <div class="summary-row">
        <span>Your Balance</span>
        <strong
          class="balance"
          id="checkoutBalance"
        >
          ₦0.00
        </strong>
      </div>

    </div>


    <button
      class="confirm-btn"
      id="confirmOrderBtn"
      onclick="confirmOrder()"
    >
      Confirm Order
    </button>

  </div>

</section>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    runTransaction,
    collection,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


  // ==========================================================
  // FIREBASE CONFIG
  // REPLACE THESE WITH YOUR EXISTING FAME STORE CONFIG
  // ==========================================================

  const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "YOUR_PROJECT.firebaseapp.com",

    projectId: "YOUR_PROJECT_ID",

    storageBucket: "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

    appId: "YOUR_APP_ID"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  // ==========================================================
  // PRODUCTS
  // ==========================================================

  const products = [

    {
      id: "glass-flower-1",
      name: "Glass Flower",
      price: 25000,
      image: "https://i.ibb.co/REPLACE-1/image.jpg"
    },

    {
      id: "glass-flower-2",
      name: "Glass Flower",
      price: 25000,
      image: "https://i.ibb.co/REPLACE-2/image.jpg"
    },

    {
      id: "glass-flower-3",
      name: "Glass Flower",
      price: 25000,
      image: "https://i.ibb.co/REPLACE-3/image.jpg"
    },

    {
      id: "glass-flower-4",
      name: "Glass Flower",
      price: 25000,
      image: "https://i.ibb.co/REPLACE-4/image.jpg"
    },

    {
      id: "preserved-roses-1",
      name: "Preserved Roses 4",
      description:
        "Preserved Roses in a Box, Eternal Rose Flowers for Delivery, Forever Preserved Roses",
      price: 40000,
      image: "https://i.ibb.co/REPLACE-5/image.jpg"
    },

    {
      id: "preserved-roses-2",
      name: "Preserved Roses 4",
      description:
        "Preserved Roses in a Box, Eternal Rose Flowers for Delivery, Forever Preserved Roses",
      price: 40000,
      image: "https://i.ibb.co/REPLACE-6/image.jpg"
    },

    {
      id: "artificial-rose-1",
      name: "Artificial Rose Flower Bouquet",
      price: 45000,
      image: "https://i.ibb.co/REPLACE-7/image.jpg"
    },

    {
      id: "artificial-rose-2",
      name: "Artificial Rose Flower Bouquet",
      price: 45000,
      image: "https://i.ibb.co/REPLACE-8/image.jpg"
    },

    {
      id: "artificial-rose-3",
      name: "Artificial Rose Flower Bouquet",
      price: 45000,
      image: "https://i.ibb.co/REPLACE-9/image.jpg"
    },

    {
      id: "fresh-cut-1",
      name: "Fresh Cut Flower",
      price: 50000,
      image: "https://i.ibb.co/REPLACE-10/image.jpg"
    },

    {
      id: "fresh-cut-2",
      name: "Fresh Cut Flower",
      price: 50000,
      image: "https://i.ibb.co/REPLACE-11/image.jpg"
    }

  ];


  let currentUser = null;

  let currentProduct = null;

  let currentBalance = 0;

  let submitting = false;


  const money = amount =>
    "₦" + Number(amount).toLocaleString("en-NG", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });


  // ==========================================================
  // DISPLAY PRODUCTS
  // ==========================================================

  const productsContainer =
    document.getElementById("products");


  products.forEach(product => {

    const card = document.createElement("div");

    card.className = "product-card";

    card.innerHTML = `

      <img
        src="${product.image}"
        alt="${product.name}"
        onerror="this.style.opacity='.3'"
      >

      <div class="product-info">

        <h3>${product.name}</h3>

        ${
          product.description
          ? `<p style="font-size:13px;color:#687386;margin-bottom:10px;">
              ${product.description}
             </p>`
          : ""
        }

        <div class="price">
          ${money(product.price)}
        </div>

        <button
          class="gift-btn"
          data-product-id="${product.id}"
        >
          Send as Gift
        </button>

      </div>

    `;

    card
      .querySelector(".gift-btn")
      .addEventListener("click", () => {

        openCheckout(product);

      });

    productsContainer.appendChild(card);

  });


  // ==========================================================
  // AUTH
  // ==========================================================

  onAuthStateChanged(auth, async user => {

    if (!user) {

      alert("Please login to send a gift.");

      return;

    }

    currentUser = user;

    await loadWallet();

  });


  // ==========================================================
  // LOAD CUSTOMER WALLET
  // ==========================================================

  async function loadWallet() {

    if (!currentUser) return;

    try {

      const userRef =
        doc(db, "users", currentUser.uid);

      const userSnap =
        await getDoc(userRef);

      if (!userSnap.exists()) {

        currentBalance = 0;

      } else {

        const data = userSnap.data();

        currentBalance =
          Number(data.walletBalance || 0);

      }

      document.getElementById("walletBalance")
        .textContent = money(currentBalance);

      document.getElementById("checkoutBalance")
        .textContent = money(currentBalance);

    } catch (error) {

      console.error(error);

    }

  }


  // ==========================================================
  // OPEN CHECKOUT
  // ==========================================================

  window.openCheckout = function(product) {

    if (!currentUser) {

      alert("Please login first.");

      return;

    }

    currentProduct = product;

    document
      .getElementById("productsSection")
      .classList.add("hidden");

    document
      .getElementById("checkout")
      .classList.add("active");


    document.getElementById("selectedImage")
      .src = product.image;

    document.getElementById("selectedName")
      .textContent = product.name;

    document.getElementById("selectedPrice")
      .textContent = money(product.price);

    document.getElementById("basePrice")
      .textContent = money(product.price);

    document.getElementById("totalPrice")
      .textContent = money(product.price);

    document.getElementById("checkoutBalance")
      .textContent = money(currentBalance);

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  };


  // ==========================================================
  // BACK
  // ==========================================================

  window.goBack = function() {

    document
      .getElementById("checkout")
      .classList.remove("active");

    document
      .getElementById("productsSection")
      .classList.remove("hidden");

    hideMessage();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  };


  // ==========================================================
  // VALIDATE FORM
  // ==========================================================

  function validateForm() {

    const fields = [

      "yourPhone",
      "senderName",
      "recipientName",
      "recipientPhone",
      "streetAddress",
      "city",
      "state",
      "country",
      "zipCode"

    ];


    for (const id of fields) {

      const field =
        document.getElementById(id);

      if (!field.value.trim()) {

        showMessage(
          "Please complete all required delivery information.",
          "error"
        );

        field.focus();

        return false;

      }

    }

    return true;

  }


  // ==========================================================
  // CONFIRM ORDER
  // ==========================================================

  window.confirmOrder = async function() {

    if (submitting) return;

    if (!currentUser) {

      showMessage(
        "Please login before placing an order.",
        "error"
      );

      return;

    }

    if (!currentProduct) {

      showMessage(
        "Please select a gift first.",
        "error"
      );

      return;

    }

    if (!validateForm()) return;


    const total =
      Number(currentProduct.price);


    // Refresh wallet before payment

    await loadWallet();


    if (currentBalance < total) {

      showMessage(
        `Insufficient wallet balance. You need ${money(total)} but your balance is ${money(currentBalance)}.`,
        "error"
      );

      return;

    }


    submitting = true;


    const button =
      document.getElementById("confirmOrderBtn");

    button.disabled = true;

    button.textContent = "Processing...";


    try {

      const userRef =
        doc(db, "users", currentUser.uid);

      const orderRef =
        doc(collection(db, "giftOrders"));


      await runTransaction(db, async transaction => {

        const userSnap =
          await transaction.get(userRef);


        if (!userSnap.exists()) {

          throw new Error(
            "Customer account was not found."
          );

        }


        const userData =
          userSnap.data();


        const wallet =
          Number(userData.walletBalance || 0);


        if (wallet < total) {

          throw new Error(
            "Insufficient wallet balance."
          );

        }


        // Deduct wallet

        transaction.update(
          userRef,
          {
            walletBalance: wallet - total
          }
        );


        // Create gift order

        transaction.set(
          orderRef,
          {

            customerUID:
              currentUser.uid,

            customerEmail:
              currentUser.email || "",


            productId:
              currentProduct.id,

            productName:
              currentProduct.name,

            productImage:
              currentProduct.image,

            basePrice:
              total,

            total:
              total,


            customerPhone:
              document
                .getElementById("yourPhone")
                .value.trim(),


            senderName:
              document
                .getElementById("senderName")
                .value.trim(),


            recipientName:
              document
                .getElementById("recipientName")
                .value.trim(),


            recipientPhone:
              document
                .getElementById("recipientPhone")
                .value.trim(),


            streetAddress:
              document
                .getElementById("streetAddress")
                .value.trim(),


            city:
              document
                .getElementById("city")
                .value.trim(),


            state:
              document
                .getElementById("state")
                .value.trim(),


            country:
              document
                .getElementById("country")
                .value.trim(),


            zipCode:
              document
                .getElementById("zipCode")
                .value.trim(),


            additionalNotes:
              document
                .getElementById("additionalNotes")
                .value.trim(),


            deliveryCountry:
              "United States",


            status:
              "pending",


            paymentStatus:
              "paid",


            paymentMethod:
              "wallet",


            createdAt:
              serverTimestamp()

          }
        );

      });


      currentBalance -= total;


      document.getElementById("walletBalance")
        .textContent = money(currentBalance);


      document.getElementById("checkoutBalance")
        .textContent = money(currentBalance);


      showMessage(
        "Gift order confirmed successfully. Your order is now pending.",
        "success"
      );


      button.textContent =
        "Order Confirmed";


      // Optional redirect after 2 seconds

      setTimeout(() => {

        window.location.href =
          "gift-orders.html";

      }, 2000);


    } catch (error) {

      console.error(error);


      showMessage(
        error.message ||
        "Unable to complete your gift order. Please try again.",
        "error"
      );


      button.disabled = false;

      button.textContent =
        "Confirm Order";


      await loadWallet();

    } finally {

      submitting = false;

    }

  };


  // ==========================================================
  // MESSAGES
  // ==========================================================

  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

  }


  function hideMessage() {

    const message =
      document.getElementById("message");

    message.textContent = "";

    message.className =
      "message";

  }

</script>

</body>
</html>
