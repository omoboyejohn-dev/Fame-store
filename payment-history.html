<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment History | Fame Store</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#f5f9ff;
    color:#101828;
    min-height:100vh;
}

.header{
    background:#fff;
    border-bottom:1px solid #e5eaf1;
    padding:18px;
    text-align:center;
}

.logo{
    width:55px;
    height:55px;
    background:#ffc928;
    border-radius:15px;
    display:grid;
    place-items:center;
    margin:auto;
    font-size:26px;
}

.header h1{
    color:#0757d9;
    font-size:23px;
    margin-top:9px;
}

.header p{
    color:#667085;
    font-size:12px;
    margin-top:4px;
}

.container{
    width:min(700px,100%);
    margin:auto;
    padding:25px 15px 45px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.top h2{
    font-size:20px;
}

.refresh{
    border:1px solid #d9e0ea;
    background:#fff;
    color:#0757d9;
    padding:9px 13px;
    border-radius:9px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.history{
    display:grid;
    gap:14px;
}

.card{
    background:#fff;
    border:1px solid #e5eaf1;
    border-radius:16px;
    padding:18px;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:15px;
}

.amount{
    color:#0757d9;
    font-size:19px;
    font-weight:800;
}

.date{
    color:#98a2b3;
    font-size:10px;
    margin-top:4px;
}

.status{
    padding:7px 10px;
    border-radius:20px;
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    white-space:nowrap;
}

.status.pending{
    background:#fff8dd;
    color:#8a6500;
}

.status.approved{
    background:#ecfff4;
    color:#087443;
}

.status.rejected{
    background:#fff1f0;
    color:#b42318;
}

.details{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.detail{
    background:#f8fafc;
    border-radius:10px;
    padding:11px;
    min-width:0;
}

.label{
    display:block;
    color:#667085;
    font-size:9px;
    margin-bottom:5px;
}

.value{
    display:block;
    font-size:12px;
    font-weight:700;
    word-break:break-word;
}

.loading{
    text-align:center;
    color:#667085;
    padding:35px;
    font-size:12px;
}

.empty{
    background:#fff;
    border:1px solid #e5eaf1;
    border-radius:16px;
    padding:45px 20px;
    text-align:center;
}

.empty-icon{
    font-size:40px;
    margin-bottom:10px;
}

.empty p{
    color:#667085;
    font-size:12px;
    margin-top:5px;
}

.back{
    display:block;
    text-align:center;
    color:#0757d9;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    margin-top:20px;
}

@media(max-width:500px){

    .details{
        grid-template-columns:1fr;
    }

    .card-top{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<header class="header">

    <div class="logo">💳</div>

    <h1>Fame Store</h1>

    <p>Payment History</p>

</header>

<main class="container">

    <div class="top">

        <h2>Payment History</h2>

        <button
            class="refresh"
            id="refreshButton">

            ↻ Refresh

        </button>

    </div>

    <div id="loading" class="loading">
        Loading payment history...
    </div>

    <div
        id="history"
        class="history">
    </div>

    <div
        id="empty"
        class="empty"
        style="display:none">

        <div class="empty-icon">💳</div>

        <h3>No Payment History</h3>

        <p>
            Your deposit payments will appear here.
        </p>

    </div>

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</main>

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    getDocs,
    query,
    where,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const loading =
    document.getElementById("loading");

const historyContainer =
    document.getElementById("history");

const empty =
    document.getElementById("empty");

const refreshButton =
    document.getElementById("refreshButton");

let currentUser=null;

function money(value){

    return "₦"+Number(value||0).toLocaleString(
        "en-NG",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function formatDate(timestamp){

    if(!timestamp) return "Pending";

    try{

        return timestamp.toDate().toLocaleString(
            "en-NG",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }catch{

        return "Unknown date";

    }

}

function statusClass(status){

    if(status==="approved") return "approved";
    if(status==="rejected") return "rejected";

    return "pending";

}

async function loadHistory(){

    if(!currentUser) return;

    loading.style.display="block";
    historyContainer.innerHTML="";
    empty.style.display="none";

    try{

        const q=query(
            collection(db,"deposits"),
            where("uid","==",currentUser.uid),
            orderBy("createdAt","desc")
        );

        const snapshot=await getDocs(q);

        loading.style.display="none";

        if(snapshot.empty){

            empty.style.display="block";
            return;

        }

        snapshot.forEach(depositDoc=>{

            const data=depositDoc.data();

            const status =
                String(data.status || "pending")
                .toLowerCase();

            const card=document.createElement("div");

            card.className="card";

            card.innerHTML=`

                <div class="card-top">

                    <div>

                        <div class="amount">
                            ${money(data.amount)}
                        </div>

                        <div class="date">
                            Submitted:
                            ${formatDate(data.createdAt)}
                        </div>

                    </div>

                    <div class="status ${statusClass(status)}">

                        ${escapeHTML(status)}

                    </div>

                </div>

                <div class="details">

                    <div class="detail">

                        <span class="label">
                            Sender Name
                        </span>

                        <span class="value">
                            ${escapeHTML(
                                data.senderName || "-"
                            )}
                        </span>

                    </div>

                    <div class="detail">

                        <span class="label">
                            Transaction Reference
                        </span>

                        <span class="value">
                            ${escapeHTML(
                                data.transactionReference || "-"
                            )}
                        </span>

                    </div>

                    <div class="detail">

                        <span class="label">
                            Deposit ID
                        </span>

                        <span class="value">
                            ${escapeHTML(
                                depositDoc.id
                            )}
                        </span>

                    </div>

                    <div class="detail">

                        <span class="label">
                            ${status==="approved"
                                ? "Approved"
                                : status==="rejected"
                                ? "Rejected"
                                : "Status"
                            }
                        </span>

                        <span class="value">

                            ${
                                status==="approved"
                                ? formatDate(data.approvedAt)
                                : status==="rejected"
                                ? formatDate(data.rejectedAt)
                                : "Waiting for review"
                            }

                        </span>

                    </div>

                </div>

            `;

            historyContainer.appendChild(card);

        });

    }catch(error){

        console.error(
            "Payment history error:",
            error
        );

        loading.style.display="none";

        historyContainer.innerHTML=`

            <div class="empty">

                <div class="empty-icon">⚠️</div>

                <h3>Unable to Load History</h3>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

    }

}

onAuthStateChanged(auth,async user=>{

    if(!user){

        window.location.href="login.html";
        return;

    }

    currentUser=user;

    await loadHistory();

});

refreshButton.addEventListener(
    "click",
    async()=>{

        refreshButton.disabled=true;
        refreshButton.textContent="Refreshing...";

        await loadHistory();

        refreshButton.disabled=false;
        refreshButton.textContent="↻ Refresh";

    }
);

</script>

</body>
</html>
