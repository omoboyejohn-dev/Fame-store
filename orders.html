<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Order Management | Fame Store</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --blue:#0757d9;
    --dark-blue:#063b91;
    --yellow:#ffc928;
    --black:#101828;
    --gray:#667085;
    --border:#e5eaf1;
    --green:#087443;
    --red:#b42318;
}

body{
    font-family:Arial,sans-serif;
    background:
        linear-gradient(
            135deg,
            #f5f9ff,
            #ffffff,
            #fffbea
        );
    color:var(--black);
    min-height:100vh;
}


/* HEADER */

.header{
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-icon{
    width:43px;
    height:43px;
    background:var(--yellow);
    border-radius:12px;
    display:grid;
    place-items:center;
    font-size:22px;
}

.brand h1{
    color:var(--blue);
    font-size:20px;
}

.brand p{
    color:var(--gray);
    font-size:11px;
    margin-top:3px;
}

.admin-badge{
    background:#eaf2ff;
    color:var(--blue);
    padding:8px 12px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}


/* CONTAINER */

.container{
    width:min(1150px,100%);
    margin:auto;
    padding:25px 18px 50px;
}


/* TITLE */

.page-title{
    margin-bottom:22px;
}

.page-title h2{
    font-size:25px;
    margin-bottom:6px;
}

.page-title p{
    color:var(--gray);
    font-size:13px;
}


/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    padding:20px;
}

.stat-label{
    color:var(--gray);
    font-size:12px;
    margin-bottom:8px;
}

.stat-value{
    font-size:25px;
    font-weight:800;
}

.blue{
    color:var(--blue);
}

.yellow{
    color:#b78100;
}

.green{
    color:var(--green);
}

.red{
    color:var(--red);
}


/* MESSAGE */

.message{
    display:none;
    padding:13px 15px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:13px;
    line-height:1.5;
}

.message.show{
    display:block;
}

.message.success{
    color:var(--green);
    background:#ecfff4;
    border:1px solid #b9efd1;
}

.message.error{
    color:var(--red);
    background:#fff1f0;
    border:1px solid #ffd3d0;
}


/* ACTION BAR */

.action-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.action-bar h3{
    font-size:18px;
}

.refresh-btn{
    border:1px solid #d9e0ea;
    background:#fff;
    color:var(--blue);
    border-radius:9px;
    padding:10px 15px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.refresh-btn:hover{
    background:#f5f9ff;
}

.refresh-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* LOADING */

.loading{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    padding:35px;
    text-align:center;
    color:var(--gray);
    font-size:13px;
}


/* EMPTY */

.empty{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    padding:45px 20px;
    text-align:center;
    display:none;
}

.empty-icon{
    font-size:42px;
    margin-bottom:10px;
}

.empty h3{
    margin-bottom:5px;
}

.empty p{
    color:var(--gray);
    font-size:13px;
}


/* ORDERS */

.orders{
    display:grid;
    gap:15px;
}

.order-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    padding:20px;
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:18px;
}

.order-title{
    font-size:15px;
    font-weight:800;
    word-break:break-word;
}

.order-id{
    color:#98a2b3;
    font-size:10px;
    margin-top:5px;
    word-break:break-all;
}

.status{
    padding:7px 11px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    white-space:nowrap;
}

.status.processing{
    background:#fff8dd;
    color:#8a6500;
}

.status.delivered{
    background:#ecfff4;
    color:var(--green);
}

.status.cancelled{
    background:#fff1f0;
    color:var(--red);
}


/* DETAILS */

.details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:15px;
}

.detail{
    background:#f8fafc;
    border-radius:10px;
    padding:12px;
    min-width:0;
}

.detail-label{
    display:block;
    color:var(--gray);
    font-size:10px;
    margin-bottom:5px;
}

.detail-value{
    display:block;
    font-size:13px;
    font-weight:700;
    word-break:break-word;
}

.amount{
    color:var(--blue);
    font-size:16px;
}


/* CUSTOMER */

.customer-box{
    background:#f8fafc;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
}

.customer-box span{
    display:block;
}

.customer-label{
    color:var(--gray);
    font-size:10px;
    margin-bottom:5px;
}

.customer-value{
    font-size:12px;
    font-weight:700;
    word-break:break-all;
}


/* DELIVERY */

.delivery-box{
    background:#f5f9ff;
    border:1px solid #dce8ff;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.delivery-title{
    color:var(--blue);
    font-size:13px;
    font-weight:800;
    margin-bottom:10px;
}

.delivery-row{
    margin-bottom:8px;
}

.delivery-row:last-child{
    margin-bottom:0;
}

.delivery-label{
    color:var(--gray);
    display:block;
    font-size:10px;
    margin-bottom:3px;
}

.delivery-value{
    display:block;
    font-size:13px;
    font-weight:700;
    line-height:1.5;
    word-break:break-word;
}


/* ACTIONS */

.order-actions{
    display:flex;
    gap:10px;
}

.deliver-btn,
.cancel-btn{
    flex:1;
    height:45px;
    border:0;
    border-radius:9px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}

.deliver-btn{
    background:var(--green);
    color:#fff;
}

.deliver-btn:hover{
    background:#065c35;
}

.cancel-btn{
    background:#fff1f0;
    color:var(--red);
    border:1px solid #ffd3d0;
}

.cancel-btn:hover{
    background:#ffe4e1;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* PROCESSED */

.processed-info{
    background:#f8fafc;
    border-radius:10px;
    padding:12px;
    color:var(--gray);
    font-size:11px;
    line-height:1.5;
}


/* FOOTER */

.footer{
    background:#061c43;
    color:#fff;
    padding:22px 15px;
    text-align:center;
}

.footer p{
    color:#9eafc9;
    font-size:10px;
}


/* MOBILE */

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .details{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .header{
        padding:15px;
    }

    .container{
        padding:20px 12px 40px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .details{
        grid-template-columns:1fr;
    }

    .order-top{
        flex-direction:column;
    }

    .status{
        align-self:flex-start;
    }

    .order-actions{
        flex-direction:column;
    }

}

</footer><script type="module">

/* =====================================
   FIREBASE
===================================== */

import {
    auth,
    db
} from "./firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    orderBy,
    getDocs,
    getDoc,
    doc,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================
   ELEMENTS
===================================== */

const ordersContainer =
    document.getElementById("orders");

const loading =
    document.getElementById("loading");

const empty =
    document.getElementById("empty");

const refreshBtn =
    document.getElementById("refreshBtn");

const message =
    document.getElementById("message");

const totalCount =
    document.getElementById("totalCount");

const processingCount =
    document.getElementById("processingCount");

const deliveredCount =
    document.getElementById("deliveredCount");

const cancelledCount =
    document.getElementById("cancelledCount");


let currentAdmin = null;


/* =====================================
   MESSAGE
===================================== */

function showMessage(text,type){

    message.textContent =
        text;

    message.className =
        "message show " + type;

}


/* =====================================
   MONEY
===================================== */

function formatMoney(amount){

    return "₦" +
        Number(amount || 0).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =====================================
   DATE
===================================== */

function formatDate(timestamp){

    if(!timestamp){
        return "Unknown";
    }

    try{

        if(
            typeof timestamp.toDate ===
            "function"
        ){

            return timestamp
                .toDate()
                .toLocaleString(
                    "en-NG",
                    {
                        day:"2-digit",
                        month:"short",
                        year:"numeric",
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        }

        return "Unknown";

    }catch{

        return "Unknown";

    }

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================
   CHECK ADMIN
===================================== */

async function checkAdmin(user){

    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    const snapshot =
        await getDoc(userRef);


    if(!snapshot.exists()){

        throw new Error(
            "Admin profile was not found."
        );

    }


    const data =
        snapshot.data();


    if(data.role !== "admin"){

        throw new Error(
            "Access denied. This account is not an admin."
        );

    }


    currentAdmin = user;

}


/* =====================================
   LOAD ORDERS
===================================== */

async function loadOrders(){

    loading.style.display =
        "block";

    empty.style.display =
        "none";

    ordersContainer.innerHTML =
        "";


    try{

        const ordersRef =
            collection(
                db,
                "orders"
            );


        let snapshot;


        /*
         Try newest first.
         Fall back if createdAt query
         cannot be used.
        */

        try{

            const ordersQuery =
                query(
                    ordersRef,
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                );


            snapshot =
                await getDocs(
                    ordersQuery
                );

        }catch(queryError){

            console.warn(
                "Ordered query failed:",
                queryError
            );


            snapshot =
                await getDocs(
                    ordersRef
                );

        }


        const orders = [];


        let processing = 0;

        let delivered = 0;

        let cancelled = 0;


        snapshot.forEach(
            orderDoc => {

                const data =
                    orderDoc.data();


                const order = {

                    id:
                        orderDoc.id,

                    ...data

                };


                orders.push(
                    order
                );


                const status =
                    String(
                        data.status ||
                        "processing"
                    ).toLowerCase();


                if(status === "processing"){
                    processing++;
                }

                else if(status === "delivered"){
                    delivered++;
                }

                else if(status === "cancelled"){
                    cancelled++;
                }

            }
        );


        totalCount.textContent =
            orders.length;

        processingCount.textContent =
            processing;

        deliveredCount.textContent =
            delivered;

        cancelledCount.textContent =
            cancelled;


        loading.style.display =
            "none";


        if(orders.length === 0){

            empty.style.display =
                "block";

            return;

        }


        orders.sort(
            (a,b) => {

                const aTime =
                    a.createdAt &&
                    typeof a.createdAt.toMillis ===
                    "function"
                    ? a.createdAt.toMillis()
                    : 0;

                const bTime =
                    b.createdAt &&
                    typeof b.createdAt.toMillis ===
                    "function"
                    ? b.createdAt.toMillis()
                    : 0;

                return bTime - aTime;

            }
        );


        orders.forEach(
            order => {

                renderOrder(
                    order
                );

            }
        );


    }catch(error){

        console.error(
            "Load orders error:",
            error
        );


        loading.style.display =
            "none";


        showMessage(
            "Unable to load orders: " +
            error.message,
            "error"
        );

    }

}


/* =====================================
   RENDER ORDER
===================================== */

function renderOrder(order){

    const card =
        document.createElement("div");


    card.className =
        "order-card";


    const status =
        String(
            order.status ||
            "processing"
        ).toLowerCase();


    let statusText =
        "PROCESSING";


    if(status === "delivered"){
        statusText = "DELIVERED";
    }

    if(status === "cancelled"){
        statusText = "CANCELLED";
    }


    const statusClass =
        status === "delivered"
            ? "delivered"
            : status === "cancelled"
                ? "cancelled"
                : "processing";


    const customerEmail =
        order.customerEmail ||
        order.email ||
        "Unknown customer";


    const customerUid =
        order.uid ||
        order.userId ||
        "";


    let actionsHTML = "";


    if(status === "processing"){

        actionsHTML = `

            <div class="order-actions">

                <button
                    class="deliver-btn"
                    data-action="deliver">

                    ✓ Mark as Delivered

                </button>

                <button
                    class="cancel-btn"
                    data-action="cancel">

                    ✕ Cancel Order

                </button>

            </div>

        `;

    }else{

        actionsHTML = `

            <div class="processed-info">

                ${
                    status === "delivered"
                    ? "✓ This order has been marked as delivered."
                    : "✕ This order has been cancelled."
                }

            </div>

        `;

    }


    card.innerHTML = `

        <div class="order-top">

            <div>

                <div class="order-title">

                    ${escapeHTML(
                        order.productName ||
                        "Gift Order"
                    )}

                </div>

                <div class="order-id">

                    Order ID:
                    ${escapeHTML(
                        order.id
                    )}

                </div>

            </div>


            <div class="status ${statusClass}">

                ${statusText}

            </div>

        </div>


        <div class="details">


            <div class="detail">

                <span class="detail-label">
                    Order Amount
                </span>

                <span class="detail-value amount">

                    ${formatMoney(
                        order.productPrice
                    )}

                </span>

            </div>


            <div class="detail">

                <span class="detail-label">
                    Delivery Country
                </span>

                <span class="detail-value">

                    ${escapeHTML(
                        order.deliveryCountry ||
                        order.country ||
                        "-"
                    )}

                </span>

            </div>


            <div class="detail">

                <span class="detail-label">
                    Payment
                </span>

                <span class="detail-value">

                    ${escapeHTML(
                        order.paymentStatus ||
                        "paid"
                    )}

                </span>

            </div>


            <div class="detail">

                <span class="detail-label">
                    Ordered
                </span>

                <span class="detail-value">

                    ${formatDate(
                        order.createdAt
                    )}

                </span>

            </div>


        </div>


        <div class="customer-box">

            <span class="customer-label">
                Customer Email
            </span>

            <span class="customer-value">

                ${escapeHTML(
                    customerEmail
                )}

            </span>

            <span class="customer-label"
                  style="margin-top:8px;">

                Customer UID
            </span>

            <span class="customer-value">

                ${escapeHTML(
                    customerUid || "-"
                )}

            </span>

        </div>


        <div class="delivery-box">

            <div class="delivery-title">
                📦 Delivery Details
            </div>


            <div class="delivery-row">

                <span class="delivery-label">
                    Recipient
                </span>

                <span class="delivery-value">

                    ${escapeHTML(
                        order.recipientName ||
                        "-"
                    )}

                </span>

            </div>


            <div class="delivery-row">

                <span class="delivery-label">
                    Phone
                </span>

                <span class="delivery-value">

                    ${escapeHTML(
                        order.recipientPhone ||
                        "-"
                    )}

                </span>

            </div>


            <div class="delivery-row">

                <span class="delivery-label">
                    Country
                </span>

                <span class="delivery-value">

                    ${escapeHTML(
                        order.deliveryCountry ||
                        order.country ||
                        "-"
                    )}

                </span>

            </div>


            <div class="delivery-row">

                <span class="delivery-label">
                    Address
                </span>

                <span class="delivery-value">

                    ${escapeHTML(
                        order.deliveryAddress ||
                        "-"
                    )}

                </span>

            </div>


            <div class="delivery-row">

                <span class="delivery-label">
                    Additional Notes
                </span>

                <span class="delivery-value">

                    ${escapeHTML(
                        order.additionalNotes ||
                        "None"
                    )}

                </span>

            </div>

        </div>


        ${actionsHTML}

    `;


    ordersContainer.appendChild(
        card
    );


    if(status === "processing"){

        const deliverButton =
            card.querySelector(
                '[data-action="deliver"]'
            );


        const cancelButton =
            card.querySelector(
                '[data-action="cancel"]'
            );


        deliverButton.addEventListener(
            "click",
            () => {

                updateOrderStatus(
                    order.id,
                    "delivered",
                    deliverButton
                );

            }
        );


        cancelButton.addEventListener(
            "click",
            () => {

                updateOrderStatus(
                    order.id,
                    "cancelled",
                    cancelButton
                );

            }
        );

    }

}


/* =====================================
   UPDATE ORDER STATUS
===================================== */

async function updateOrderStatus(
    orderId,
    newStatus,
    button
){

    if(!currentAdmin){

        showMessage(
            "Admin authentication is missing.",
            "error"
        );

        return;

    }


    const actionText =
        newStatus === "delivered"
            ? "mark this order as delivered"
            : "cancel this order";


    const confirmed =
        confirm(
            "Are you sure you want to " +
            actionText +
            "?"
        );


    if(!confirmed){
        return;
    }


    button.disabled =
        true;


    button.textContent =
        newStatus === "delivered"
            ? "Updating..."
            : "Cancelling...";


    try{

        await runTransaction(
            db,
            async transaction => {

                const orderRef =
                    doc(
                        db,
                        "orders",
                        orderId
                    );


                const orderSnap =
                    await transaction.get(
                        orderRef
                    );


                if(!orderSnap.exists()){

                    throw new Error(
                        "ORDER_NOT_FOUND"
                    );

                }


                const data =
                    orderSnap.data();


                const currentStatus =
                    String(
                        data.status ||
                        "processing"
                    ).toLowerCase();


                /*
                 Do not allow an already
                 processed order to change.
                */

                if(
                    currentStatus !==
                    "processing"
                ){

                    throw new Error(
                        "ALREADY_PROCESSED"
                    );

                }


                transaction.update(
                    orderRef,
                    {

                        status:
                            newStatus,

                        updatedAt:
                            serverTimestamp(),

                        processedBy:
                            currentAdmin.uid

                    }
                );

            }
        );


        showMessage(
            newStatus === "delivered"
                ? "Order marked as delivered successfully."
                : "Order cancelled successfully.",
            "success"
        );


        await loadOrders();


    }catch(error){

        console.error(
            "Order update error:",
            error
        );


        let text =
            "Unable to update order. " +
            error.message;


        if(
            error.message ===
            "ALREADY_PROCESSED"
        ){

            text =
                "This order has already been processed.";

        }


        else if(
            error.message ===
            "ORDER_NOT_FOUND"
        ){

            text =
                "This order no longer exists.";

        }


        else if(
            error.code ===
            "permission-denied"
        ){

            text =
                "Permission denied. Check the Firestore Rules for admin order management.";

        }


        showMessage(
            text,
            "error"
        );


        button.disabled =
            false;


        button.textContent =
            newStatus === "delivered"
                ? "✓ Mark as Delivered"
                : "✕ Cancel Order";

    }

}


/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        try{

            await checkAdmin(
                user
            );


            await loadOrders();


        }catch(error){

            console.error(
                "Admin authentication error:",
                error
            );


            loading.style.display =
                "none";


            showMessage(
                error.message,
                "error"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "login.html";

                },
                1500
            );

        }

    }
);


/* =====================================
   REFRESH
===================================== */

refreshBtn.addEventListener(
    "click",
    async () => {

        refreshBtn.disabled =
            true;

        refreshBtn.textContent =
            "Refreshing...";


        try{

            await loadOrders();

        }finally{

            refreshBtn.disabled =
                false;

            refreshBtn.textContent =
                "↻ Refresh";

        }

    }
);
