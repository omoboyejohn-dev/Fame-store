<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | Fame Store</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#f5f9ff;
    color:#101828;
    min-height:100vh;
}

.header{
    background:#fff;
    border-bottom:1px solid #e5eaf1;
    padding:18px 20px;
    text-align:center;
}

.logo{
    width:55px;
    height:55px;
    background:#ffc928;
    border-radius:15px;
    display:grid;
    place-items:center;
    margin:auto;
    font-size:26px;
}

.header h1{
    color:#0757d9;
    font-size:23px;
    margin-top:9px;
}

.header p{
    color:#667085;
    font-size:12px;
    margin-top:4px;
}

.container{
    width:min(520px,100%);
    margin:auto;
    padding:25px 15px 45px;
}

.card{
    background:#fff;
    border:1px solid #e5eaf1;
    border-radius:18px;
    padding:22px;
    margin-bottom:16px;
}

.profile-top{
    text-align:center;
    margin-bottom:25px;
}

.avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#0757d9;
    color:#fff;
    display:grid;
    place-items:center;
    margin:auto;
    font-size:30px;
    font-weight:800;
}

.profile-top h2{
    margin-top:12px;
    font-size:20px;
}

.profile-top p{
    color:#667085;
    font-size:12px;
    margin-top:5px;
    word-break:break-word;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:7px;
}

input{
    width:100%;
    height:48px;
    border:1px solid #d9e0ea;
    border-radius:10px;
    padding:0 13px;
    font-size:14px;
    outline:none;
}

input:focus{
    border-color:#0757d9;
    box-shadow:0 0 0 3px rgba(7,87,217,.08);
}

input:disabled{
    background:#f2f4f7;
    color:#667085;
}

.btn{
    width:100%;
    height:48px;
    border:0;
    border-radius:10px;
    background:#0757d9;
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.btn:disabled{
    opacity:.6;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:16px;
    font-size:12px;
    line-height:1.5;
}

.message.show{display:block}

.success{
    background:#ecfff4;
    color:#087443;
    border:1px solid #b9efd1;
}

.error{
    background:#fff1f0;
    color:#b42318;
    border:1px solid #ffd3d0;
}

.info-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid #edf0f5;
    font-size:12px;
}

.info-row:last-child{border-bottom:0}

.info-label{color:#667085}
.info-value{font-weight:700;text-align:right;word-break:break-word}

.back{
    display:block;
    text-align:center;
    color:#0757d9;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    margin-top:20px;
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">🛍️</div>
    <h1>Fame Store</h1>
    <p>My Profile</p>
</header>

<main class="container">

    <div class="card">

        <div class="profile-top">
            <div class="avatar" id="avatar">?</div>
            <h2 id="profileName">Loading...</h2>
            <p id="profileEmail">Loading...</p>
        </div>

        <div id="message" class="message"></div>

        <form id="profileForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    disabled>
            </div>

            <div class="form-group">
                <label>Customer UID</label>
                <input
                    type="text"
                    id="uid"
                    disabled>
            </div>

            <button
                type="submit"
                class="btn"
                id="saveButton">
                Save Changes
            </button>

        </form>

    </div>

    <div class="card">

        <div class="info-row">
            <span class="info-label">Wallet Balance</span>
            <span class="info-value" id="walletBalance">₦0.00</span>
        </div>

        <div class="info-row">
            <span class="info-label">Account Status</span>
            <span class="info-value">Active</span>
        </div>

    </div>

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</main>

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    getDoc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const profileForm = document.getElementById("profileForm");
const fullName = document.getElementById("fullName");
const email = document.getElementById("email");
const uid = document.getElementById("uid");
const profileName = document.getElementById("profileName");
const profileEmail = document.getElementById("profileEmail");
const avatar = document.getElementById("avatar");
const walletBalance = document.getElementById("walletBalance");
const saveButton = document.getElementById("saveButton");
const message = document.getElementById("message");

let currentUser = null;

function showMessage(text,type){
    message.textContent = text;
    message.className = "message show " + type;
}

function money(value){
    return "₦" + Number(value || 0).toLocaleString("en-NG",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}

function updateAvatar(name){
    const text = String(name || "?").trim();
    avatar.textContent = text
        ? text.charAt(0).toUpperCase()
        : "?";
}

onAuthStateChanged(auth, async user => {

    if(!user){
        window.location.href="login.html";
        return;
    }

    currentUser = user;

    email.value = user.email || "";
    uid.value = user.uid;
    profileEmail.textContent = user.email || "";

    try{

        const userRef = doc(db,"users",user.uid);
        const snap = await getDoc(userRef);

        if(snap.exists()){

            const data = snap.data();

            const name =
                data.fullName ||
                data.name ||
                "Fame Store Customer";

            fullName.value = name;
            profileName.textContent = name;
            walletBalance.textContent =
                money(data.walletBalance);

            updateAvatar(name);

        }else{

            profileName.textContent =
                "Fame Store Customer";

        }

    }catch(error){

        showMessage(
            "Unable to load your profile: " +
            error.message,
            "error"
        );

    }

});

profileForm.addEventListener("submit",async event=>{

    event.preventDefault();

    if(!currentUser) return;

    const name = fullName.value.trim();

    if(!name){
        showMessage(
            "Please enter your full name.",
            "error"
        );
        return;
    }

    saveButton.disabled=true;
    saveButton.textContent="Saving...";

    try{

        await updateDoc(
            doc(db,"users",currentUser.uid),
            {
                fullName:name
            }
        );

        profileName.textContent=name;
        updateAvatar(name);

        showMessage(
            "Profile updated successfully.",
            "success"
        );

    }catch(error){

        showMessage(
            "Unable to update profile: " +
            error.message,
            "error"
        );

    }finally{

        saveButton.disabled=false;
        saveButton.textContent="Save Changes";

    }

});

</script>

</body>
</html>
