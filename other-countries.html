<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Other Countries | Fame Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #f5f9ff,
                #ffffff,
                #fffbea
            );
            color: #101828;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
        }

        .container {
            width: min(460px, 100%);
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo {
            width: 58px;
            height: 58px;
            background: #ffc928;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 28px;
            margin: 0 auto 10px;
        }

        .header h1 {
            color: #0757d9;
            font-size: 25px;
            font-weight: 800;
        }

        .header p {
            color: #667085;
            font-size: 12px;
            margin-top: 5px;
        }

        /* CARD */

        .card {
            background: #ffffff;
            border: 1px solid #e5eaf1;
            border-radius: 22px;
            padding: 32px 25px;
            text-align: center;
            box-shadow:
                0 20px 60px rgba(7, 87, 217, 0.12);
        }

        .icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #eef5ff;
            display: grid;
            place-items: center;
            font-size: 35px;
            margin: 0 auto 20px;
        }

        .card h2 {
            font-size: 23px;
            margin-bottom: 12px;
        }

        .card p {
            color: #667085;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .whatsapp-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            border-radius: 11px;
            background: #25D366;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: .2s;
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);
            opacity: .92;
        }

        .back-btn {
            display: block;
            margin-top: 15px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 11px;
            background: #0757d9;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .back-btn:hover {
            background: #063b91;
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 20px;
            }

            .card h2 {
                font-size: 21px;
            }
        }
    </style>

</head>

<body>

<div class="page">

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <div class="logo">
                🛍️
            </div>

            <h1>
                Fame Store
            </h1>

            <p>
                Send gifts 🎁, share love ❤️
            </p>

        </div>


        <!-- CARD -->

        <div class="card">

            <div class="icon">
                🌍
            </div>

            <h2>
                Other Countries
            </h2>

            <p>
                Join our WhatsApp channel and tell us
                which country you want to send a gift to.
                We're still working on adding more
                countries and products to Fame Store.
            </p>


            <a
                href="https://whatsapp.com/channel/0029VbDpD8RIyPtZiIkHkx3u"
                target="_blank"
                rel="noopener noreferrer"
                class="whatsapp-btn">

                💬 Join WhatsApp Channel

            </a>


            <a
                href="dashboard.html"
                class="back-btn">

                ← Back to Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
