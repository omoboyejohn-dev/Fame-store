<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | Fame Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: #ffffff;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================== */

        .header {
            height: 70px;
            background: #0b0b0b;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
        }

        .logo span {
            color: #1e90ff;
        }

        .back-btn {
            border: none;
            background: #151515;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #1e90ff;
        }

        /* =========================
           MAIN
        ========================== */

        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 30px 18px 60px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
        }

        .page-subtitle {
            color: #999;
            font-size: 14px;
            margin-top: 5px;
        }

        .refresh-btn {
            border: 1px solid #333;
            background: #111;
            color: #fff;
            padding: 11px 17px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .refresh-btn:hover {
            background: #1e90ff;
            border-color: #1e90ff;
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* =========================
           NOTIFICATIONS
        ========================== */

        .notifications {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notification {
            background: #0d0d0d;
            border: 1px solid #242424;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            gap: 15px;
            position: relative;
            transition: 0.2s;
        }

        .notification:hover {
            border-color: #333;
            transform: translateY(-1px);
        }

        .notification.unread {
            border-color: rgba(30, 144, 255, 0.5);
            background: #0b1118;
        }

        .notification-icon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 12px;
            background: #171717;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .notification-content {
            flex: 1;
            min-width: 0;
        }

        .notification-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #fff;
        }

        .notification-message {
            color: #b7b7b7;
            font-size: 14px;
            line-height: 1.55;
        }

        .notification-time {
            color: #777;
            font-size: 12px;
            margin-top: 9px;
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1e90ff;
            position: absolute;
            top: 18px;
            right: 18px;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-successful {
            background: rgba(0, 200, 100, 0.12);
            color: #00d878;
        }

        .status-cancelled {
            background: rgba(255, 60, 60, 0.12);
            color: #ff5c5c;
        }

        .status-pending {
            background: rgba(255, 190, 0, 0.12);
            color: #ffc400;
        }

        /* =========================
           LOADING
        ========================== */

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 3px solid #222;
            border-top-color: #1e90ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           EMPTY
        ========================== */

        .empty {
            text-align: center;
            padding: 70px 20px;
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 14px;
        }

        .empty-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .empty p {
            color: #888;
            font-size: 14px;
        }

        /* =========================
           ERROR
        ========================== */

        .error-box {
            background: #160909;
            border: 1px solid #4d1c1c;
            color: #ff7777;
            padding: 18px;
            border-radius: 12px;
            line-height: 1.5;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .header {
                padding: 0 15px;
                height: 64px;
            }

            .logo {
                font-size: 21px;
            }

            .container {
                padding: 22px 12px 45px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-title {
                font-size: 24px;
            }

            .refresh-btn {
                width: 100%;
            }

            .notification {
                padding: 15px;
                gap: 12px;
            }

            .notification-icon {
                width: 42px;
                height: 42px;
                min-width: 42px;
                font-size: 20px;
            }

            .notification-title {
                font-size: 15px;
            }

            .notification-message {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">
        Fame<span>Store</span>
    </div>

    <button class="back-btn" onclick="goBack()">
        ← Back
    </button>

</header>


<main class="container">

    <div class="page-header">

        <div>
            <h1 class="page-title">
                Notifications
            </h1>

            <p class="page-subtitle">
                Stay updated about your orders and account.
            </p>
        </div>

        <button
            class="refresh-btn"
            id="refreshButton"
        >
            ↻ Refresh
        </button>

    </div>


    <div
        id="loading"
        class="loading"
    >
        <div class="spinner"></div>
        <p>Loading notifications...</p>
    </div>


    <div
        id="notificationsContainer"
        class="notifications"
    ></div>


    <div
        id="empty"
        class="empty"
        style="display:none;"
    >
        <div class="empty-icon">
            🔔
        </div>

        <h3>
            No Notifications
        </h3>

        <p>
            You don't have any notifications yet.
        </p>
    </div>

</main>


<script type="module">

    /* =========================================
       FIREBASE
    ========================================== */

    import { auth, db } from "./firebase-config.js";

    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
        collection,
        query,
        where,
        onSnapshot,
        getDocs
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================================
       ELEMENTS
    ========================================== */

    const loading =
        document.getElementById("loading");

    const empty =
        document.getElementById("empty");

    const notificationsContainer =
        document.getElementById("notificationsContainer");

    const refreshButton =
        document.getElementById("refreshButton");


    /* =========================================
       VARIABLES
    ========================================== */

    let currentUser = null;

    let unsubscribeNotifications = null;


    /* =========================================
       ESCAPE HTML
    ========================================== */

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================================
       DATE FORMAT
    ========================================== */

    function formatDate(timestamp) {

        if (!timestamp) {
            return "Just now";
        }

        try {

            let date;

            if (
                timestamp &&
                typeof timestamp.toDate === "function"
            ) {
                date = timestamp.toDate();
            }

            else if (
                timestamp &&
                typeof timestamp.toMillis === "function"
            ) {
                date = new Date(timestamp.toMillis());
            }

            else if (
                timestamp instanceof Date
            ) {
                date = timestamp;
            }

            else if (
                typeof timestamp === "number"
            ) {
                date = new Date(timestamp);
            }

            else {
                return "Just now";
            }

            return date.toLocaleString([], {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });

        } catch (error) {

            return "Just now";

        }
    }


    /* =========================================
       GET TIME FOR SORTING
    ========================================== */

    function getTime(timestamp) {

        try {

            if (
                timestamp &&
                typeof timestamp.toMillis === "function"
            ) {
                return timestamp.toMillis();
            }

            if (
                timestamp &&
                typeof timestamp.toDate === "function"
            ) {
                return timestamp.toDate().getTime();
            }

            if (
                timestamp instanceof Date
            ) {
                return timestamp.getTime();
            }

            if (
                typeof timestamp === "number"
            ) {
                return timestamp;
            }

        } catch (error) {

        }

        return 0;
    }


    /* =========================================
       MONEY FORMAT
    ========================================== */

    function money(amount) {

        const value = Number(amount || 0);

        return "₦" + value.toLocaleString(
            "en-NG",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );
    }


    /* =========================================
       ICON
    ========================================== */

    function getNotificationIcon(notification) {

        if (notification.icon) {
            return notification.icon;
        }

        const type =
            String(notification.type || "").toLowerCase();

        const status =
            String(notification.status || "").toLowerCase();

        if (
            type.includes("cancel") ||
            status === "cancelled"
        ) {
            return "❌";
        }

        if (
            type.includes("success") ||
            status === "successful"
        ) {
            return "🎁";
        }

        if (
            type.includes("refund")
        ) {
            return "💰";
        }

        if (
            type.includes("deposit")
        ) {
            return "💳";
        }

        if (
            type.includes("support")
        ) {
            return "💬";
        }

        return "🔔";
    }


    /* =========================================
       STATUS HTML
    ========================================== */

    function getStatusHTML(status) {

        if (!status) {
            return "";
        }

        const normalized =
            String(status).toLowerCase();

        if (normalized === "successful") {

            return `
                <div class="status status-successful">
                    ✓ Successful
                </div>
            `;
        }

        if (normalized === "cancelled") {

            return `
                <div class="status status-cancelled">
                    ❌ Cancelled
                </div>
            `;
        }

        if (normalized === "pending") {

            return `
                <div class="status status-pending">
                    ⏳ Pending
                </div>
            `;
        }

        return `
            <div class="status">
                ${escapeHTML(status)}
            </div>
        `;
    }


    /* =========================================
       DISPLAY NOTIFICATIONS
    ========================================== */

    function displayNotifications(list) {

        loading.style.display = "none";

        notificationsContainer.innerHTML = "";

        if (!list || list.length === 0) {

            empty.style.display = "block";

            return;
        }

        empty.style.display = "none";


        list.forEach(notification => {

            const item =
                document.createElement("div");

            item.className = "notification";


            if (notification.read === false) {
                item.classList.add("unread");
            }


            const icon =
                getNotificationIcon(notification);


            const title =
                notification.title ||
                "Notification";


            const message =
                notification.message ||
                notification.body ||
                "You have a new notification.";


            const statusHTML =
                getStatusHTML(notification.status);


            item.innerHTML = `

                ${
                    notification.read === false
                    ? `<div class="unread-dot"></div>`
                    : ""
                }

                <div class="notification-icon">
                    ${escapeHTML(icon)}
                </div>

                <div class="notification-content">

                    <div class="notification-title">
                        ${escapeHTML(title)}
                    </div>

                    <div class="notification-message">
                        ${escapeHTML(message)}
                    </div>

                    ${statusHTML}

                    <div class="notification-time">
                        ${formatDate(notification.createdAt)}
                    </div>

                </div>

            `;


            notificationsContainer.appendChild(item);

        });
    }


    /* =========================================
       REAL-TIME NOTIFICATIONS
       
       IMPORTANT:
       We ONLY query by UID.
       
       We DO NOT use:
       
       orderBy("createdAt", "desc")
       
       This prevents the composite index error.
    ========================================== */

    function listenForNotifications() {

        if (!currentUser) {
            return;
        }


        /* Stop previous listener */

        if (unsubscribeNotifications) {

            unsubscribeNotifications();

            unsubscribeNotifications = null;
        }


        loading.style.display = "block";

        empty.style.display = "none";

        notificationsContainer.innerHTML = "";


        const notificationsQuery =
            query(
                collection(db, "notifications"),
                where(
                    "uid",
                    "==",
                    currentUser.uid
                )
            );


        unsubscribeNotifications =
            onSnapshot(

                notificationsQuery,

                snapshot => {

                    const list = [];


                    snapshot.forEach(
                        notificationDoc => {

                            list.push({

                                id:
                                    notificationDoc.id,

                                ...notificationDoc.data()

                            });

                        }
                    );


                    /*
                     * Sort newest first
                     * WITHOUT Firestore orderBy.
                     */

                    list.sort(
                        (a, b) => {

                            const aTime =
                                getTime(a.createdAt);

                            const bTime =
                                getTime(b.createdAt);

                            return bTime - aTime;

                        }
                    );


                    displayNotifications(list);

                },


                error => {

                    console.error(
                        "Notification error:",
                        error
                    );


                    loading.style.display =
                        "none";


                    empty.style.display =
                        "none";


                    notificationsContainer.innerHTML = `

                        <div class="error-box">

                            <strong>
                                ⚠️ Unable to Load Notifications
                            </strong>

                            <br><br>

                            ${escapeHTML(error.message)}

                        </div>

                    `;

                }

            );

    }


    /* =========================================
       MANUAL REFRESH
       
       Also uses ONLY uid.
       No composite index required.
    ========================================== */

    async function refreshNotifications() {

        if (!currentUser) {
            return;
        }


        refreshButton.disabled = true;

        refreshButton.textContent =
            "Refreshing...";


        try {

            const notificationsQuery =
                query(
                    collection(db, "notifications"),
                    where(
                        "uid",
                        "==",
                        currentUser.uid
                    )
                );


            const snapshot =
                await getDocs(
                    notificationsQuery
                );


            const list = [];


            snapshot.forEach(
                notificationDoc => {

                    list.push({

                        id:
                            notificationDoc.id,

                        ...notificationDoc.data()

                    });

                }
            );


            /*
             * Sort in JavaScript.
             */

            list.sort(
                (a, b) => {

                    const aTime =
                        getTime(a.createdAt);

                    const bTime =
                        getTime(b.createdAt);

                    return bTime - aTime;

                }
            );


            displayNotifications(list);


        } catch (error) {

            console.error(
                "Refresh notification error:",
                error
            );


            notificationsContainer.innerHTML = `

                <div class="error-box">

                    <strong>
                        ⚠️ Refresh Failed
                    </strong>

                    <br><br>

                    ${escapeHTML(error.message)}

                </div>

            `;

        }


        refreshButton.disabled = false;

        refreshButton.textContent =
            "↻ Refresh";

    }


    /* =========================================
       AUTH STATE
    ========================================== */

    onAuthStateChanged(
        auth,
        user => {

            if (!user) {

                currentUser = null;


                if (unsubscribeNotifications) {

                    unsubscribeNotifications();

                    unsubscribeNotifications =
                        null;
                }


                window.location.href =
                    "login.html";

                return;
            }


            currentUser = user;


            listenForNotifications();

        }
    );


    /* =========================================
       REFRESH BUTTON
    ========================================== */

    refreshButton.addEventListener(
        "click",
        refreshNotifications
    );


    /* =========================================
       BACK BUTTON
    ========================================== */

    window.goBack = function() {

        if (document.referrer) {

            history.back();

        } else {

            window.location.href =
                "dashboard.html";

        }

    };


    /* =========================================
       CLEANUP
    ========================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            if (unsubscribeNotifications) {

                unsubscribeNotifications();

            }

        }
    );

</script>

</body>
</html>
