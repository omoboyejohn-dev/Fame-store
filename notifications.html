<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | Fame Store</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#f5f9ff;
    color:#101828;
    min-height:100vh;
}

.header{
    background:#fff;
    border-bottom:1px solid #e5eaf1;
    padding:18px;
    text-align:center;
}

.logo{
    width:55px;
    height:55px;
    background:#ffc928;
    border-radius:15px;
    display:grid;
    place-items:center;
    margin:auto;
    font-size:26px;
}

.header h1{
    color:#0757d9;
    font-size:23px;
    margin-top:9px;
}

.header p{
    color:#667085;
    font-size:12px;
    margin-top:4px;
}

.container{
    width:min(650px,100%);
    margin:auto;
    padding:25px 15px 45px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
    gap:10px;
}

.top h2{
    font-size:20px;
}

.refresh{
    border:1px solid #d9e0ea;
    background:#fff;
    color:#0757d9;
    padding:9px 13px;
    border-radius:9px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.notifications{
    display:grid;
    gap:12px;
}

.notification{
    background:#fff;
    border:1px solid #e5eaf1;
    border-radius:15px;
    padding:17px;
}

.notification.unread{
    border-left:4px solid #0757d9;
}

.notification-top{
    display:flex;
    gap:12px;
    align-items:flex-start;
}

.icon{
    width:40px;
    height:40px;
    flex-shrink:0;
    border-radius:12px;
    background:#eaf2ff;
    display:grid;
    place-items:center;
    font-size:19px;
}

.notification h3{
    font-size:14px;
    margin-bottom:5px;
}

.notification p{
    color:#667085;
    font-size:12px;
    line-height:1.6;
}

.date{
    color:#98a2b3;
    font-size:10px;
    margin-top:10px;
}

.empty{
    background:#fff;
    border:1px solid #e5eaf1;
    border-radius:15px;
    padding:45px 20px;
    text-align:center;
}

.empty-icon{
    font-size:40px;
    margin-bottom:10px;
}

.empty p{
    color:#667085;
    font-size:12px;
    margin-top:5px;
}

.loading{
    text-align:center;
    color:#667085;
    font-size:12px;
    padding:30px;
}

.back{
    display:block;
    text-align:center;
    color:#0757d9;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    margin-top:20px;
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">🔔</div>

    <h1>Fame Store</h1>

    <p>Notifications</p>

</header>

<main class="container">

    <div class="top">

        <h2>Notifications</h2>

        <button
            class="refresh"
            id="refreshButton">

            ↻ Refresh

        </button>

    </div>

    <div id="loading" class="loading">
        Loading notifications...
    </div>

    <div
        id="notifications"
        class="notifications">
    </div>

    <div
        id="empty"
        class="empty"
        style="display:none">

        <div class="empty-icon">🔔</div>

        <h3>No Notifications</h3>

        <p>
            You don't have any notifications yet.
        </p>

    </div>

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</main>

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    getDocs,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const loading =
    document.getElementById("loading");

const container =
    document.getElementById("notifications");

const empty =
    document.getElementById("empty");

const refreshButton =
    document.getElementById("refreshButton");

let currentUser=null;

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function formatDate(timestamp){

    if(!timestamp) return "Date unavailable";

    try{

        return timestamp.toDate().toLocaleString(
            "en-NG",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }catch{

        return "Date unavailable";

    }

}

async function loadNotifications(){

    if(!currentUser) return;

    loading.style.display="block";
    container.innerHTML="";
    empty.style.display="none";

    try{

        const q=query(
            collection(db,"notifications"),
            orderBy("createdAt","desc")
        );

        const snapshot=await getDocs(q);

        const list=[];

        snapshot.forEach(notificationDoc=>{

            const data=notificationDoc.data();

            /*
             * Notifications with:
             * uid = customer's UID
             * OR customerUid = customer's UID
             * OR recipientUid = customer's UID
             * OR broadcast = true
             */

            const belongsToUser =
                data.uid === currentUser.uid ||
                data.customerUid === currentUser.uid ||
                data.recipientUid === currentUser.uid ||
                data.broadcast === true ||
                data.type === "global";

            if(belongsToUser){

                list.push({
                    id:notificationDoc.id,
                    ...data
                });

            }

        });

        loading.style.display="none";

        if(list.length===0){

            empty.style.display="block";
            return;

        }

        list.forEach(notification=>{

            const card=document.createElement("div");

            card.className =
                "notification " +
                (
                    notification.read === false
                    ? "unread"
                    : ""
                );

            card.innerHTML=`

                <div class="notification-top">

                    <div class="icon">
                        ${escapeHTML(
                            notification.icon || "🔔"
                        )}
                    </div>

                    <div>

                        <h3>
                            ${escapeHTML(
                                notification.title ||
                                "Fame Store Notification"
                            )}
                        </h3>

                        <p>
                            ${escapeHTML(
                                notification.message ||
                                notification.body ||
                                "You have a new notification."
                            )}
                        </p>

                    </div>

                </div>

                <div class="date">
                    ${formatDate(notification.createdAt)}
                </div>

            `;

            container.appendChild(card);

        });

    }catch(error){

        console.error(error);

        loading.style.display="none";

        container.innerHTML=`

            <div class="empty">

                <div class="empty-icon">⚠️</div>

                <h3>Unable to Load Notifications</h3>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

    }

}

onAuthStateChanged(auth,async user=>{

    if(!user){

        window.location.href="login.html";
        return;

    }

    currentUser=user;

    await loadNotifications();

});

refreshButton.addEventListener(
    "click",
    async()=>{

        refreshButton.disabled=true;
        refreshButton.textContent="Refreshing...";

        await loadNotifications();

        refreshButton.disabled=false;
        refreshButton.textContent="↻ Refresh";

    }
);

</script>

</body>
</html>
