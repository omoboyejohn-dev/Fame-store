<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | Fame Store</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f9ff;
    color:#101828;
    min-height:100vh;
}

.header{
    background:#fff;
    border-bottom:1px solid #e5eaf1;
    padding:18px;
    text-align:center;
}

.logo{
    width:55px;
    height:55px;
    background:#ffc928;
    border-radius:15px;
    display:grid;
    place-items:center;
    margin:auto;
    font-size:26px;
}

.header h1{
    color:#0757d9;
    font-size:23px;
    margin-top:9px;
}

.header p{
    color:#667085;
    font-size:12px;
    margin-top:4px;
}

.container{
    width:min(650px,100%);
    margin:auto;
    padding:25px 15px 45px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
    gap:10px;
}

.top h2{
    font-size:20px;
}

.refresh{
    border:1px solid #d9e0ea;
    background:#fff;
    color:#0757d9;
    padding:9px 13px;
    border-radius:9px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.refresh:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.notifications{
    display:grid;
    gap:12px;
}

.notification{
    background:#fff;
    border:1px solid #e5eaf1;
    border-radius:15px;
    padding:17px;
    transition:.2s;
}

.notification:hover{
    transform:translateY(-1px);
}

.notification.unread{
    border-left:4px solid #0757d9;
    background:#fbfdff;
}

.notification-top{
    display:flex;
    gap:12px;
    align-items:flex-start;
}

.icon{
    width:40px;
    height:40px;
    flex-shrink:0;
    border-radius:12px;
    background:#eaf2ff;
    display:grid;
    place-items:center;
    font-size:19px;
}

.notification-content{
    flex:1;
}

.notification h3{
    font-size:14px;
    margin-bottom:6px;
}

.notification p{
    color:#667085;
    font-size:12px;
    line-height:1.6;
}

.order-info{
    margin-top:10px;
    padding:9px 11px;
    background:#f7f9fc;
    border-radius:8px;
    color:#475467;
    font-size:10px;
    line-height:1.6;
}

.date{
    color:#98a2b3;
    font-size:10px;
    margin-top:10px;
}

.status{
    display:inline-block;
    margin-top:8px;
    padding:5px 8px;
    border-radius:6px;
    font-size:9px;
    font-weight:700;
}

.status.successful{
    background:#e9f9ef;
    color:#16803c;
}

.status.cancelled{
    background:#fff0f0;
    color:#d92d20;
}

.status.info{
    background:#eaf2ff;
    color:#0757d9;
}

.empty{
    background:#fff;
    border:1px solid #e5eaf1;
    border-radius:15px;
    padding:45px 20px;
    text-align:center;
}

.empty-icon{
    font-size:40px;
    margin-bottom:10px;
}

.empty p{
    color:#667085;
    font-size:12px;
    margin-top:5px;
}

.loading{
    text-align:center;
    color:#667085;
    font-size:12px;
    padding:30px;
}

.back{
    display:block;
    text-align:center;
    color:#0757d9;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    margin-top:20px;
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">🔔</div>

    <h1>Fame Store</h1>

    <p>Notifications</p>

</header>


<main class="container">

    <div class="top">

        <h2>Notifications</h2>

        <button
            class="refresh"
            id="refreshButton">

            ↻ Refresh

        </button>

    </div>


    <div
        id="loading"
        class="loading">

        Loading notifications...

    </div>


    <div
        id="notifications"
        class="notifications">
    </div>


    <div
        id="empty"
        class="empty"
        style="display:none">

        <div class="empty-icon">
            🔔
        </div>

        <h3>
            No Notifications
        </h3>

        <p>
            You don't have any notifications yet.
        </p>

    </div>


    <a
        href="dashboard.html"
        class="back">

        ← Back to Dashboard

    </a>

</main>


<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    orderBy,
    onSnapshot,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const loading =
    document.getElementById("loading");

const notificationsContainer =
    document.getElementById("notifications");

const empty =
    document.getElementById("empty");

const refreshButton =
    document.getElementById("refreshButton");


let currentUser = null;

let unsubscribeNotifications = null;


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ================================
   FORMAT DATE
================================ */

function formatDate(timestamp){

    if(!timestamp){

        return "Date unavailable";

    }

    try{

        if(typeof timestamp.toDate === "function"){

            return timestamp.toDate().toLocaleString(
                "en-NG",
                {
                    dateStyle:"medium",
                    timeStyle:"short"
                }
            );

        }

        return "Date unavailable";

    }catch(error){

        return "Date unavailable";

    }

}


/* ================================
   GET STATUS
================================ */

function getStatusClass(notification){

    const type =
        String(notification.type || "")
        .toLowerCase();

    const status =
        String(notification.status || "")
        .toLowerCase();


    if(
        type.includes("success") ||
        type.includes("deliver") ||
        status === "successful"
    ){

        return "successful";

    }


    if(
        type.includes("cancel") ||
        type.includes("refund") ||
        status === "cancelled"
    ){

        return "cancelled";

    }


    return "info";

}


/* ================================
   RENDER NOTIFICATION
================================ */

function renderNotification(notification){

    const card =
        document.createElement("div");


    const isUnread =
        notification.read === false ||
        notification.read === undefined;


    card.className =
        "notification " +
        (isUnread ? "unread" : "");


    const statusClass =
        getStatusClass(notification);


    let statusText = "";


    if(statusClass === "successful"){

        statusText =
            `<span class="status successful">
                ✓ Gift Delivered Successfully
             </span>`;

    }
    else if(statusClass === "cancelled"){

        statusText =
            `<span class="status cancelled">
                ✕ Order Cancelled / Refunded
             </span>`;

    }
    else{

        statusText =
            `<span class="status info">
                ℹ Information
             </span>`;

    }


    let orderInfo = "";


    if(
        notification.orderId ||
        notification.productName ||
        notification.total
    ){

        orderInfo = `

            <div class="order-info">

                ${
                    notification.orderId
                    ? `<b>Order:</b>
                       ${escapeHTML(notification.orderId)}<br>`
                    : ""
                }

                ${
                    notification.productName
                    ? `<b>Gift:</b>
                       ${escapeHTML(notification.productName)}<br>`
                    : ""
                }

                ${
                    notification.total
                    ? `<b>Total:</b>
                       ₦${Number(notification.total).toLocaleString("en-NG")}`
                    : ""
                }

            </div>

        `;

    }


    card.innerHTML = `

        <div class="notification-top">

            <div class="icon">

                ${escapeHTML(
                    notification.icon || "🔔"
                )}

            </div>


            <div class="notification-content">

                <h3>

                    ${escapeHTML(
                        notification.title ||
                        "Fame Store Notification"
                    )}

                </h3>


                <p>

                    ${escapeHTML(
                        notification.message ||
                        notification.body ||
                        "You have a new notification."
                    )}

                </p>


                ${statusText}

                ${orderInfo}

            </div>

        </div>


        <div class="date">

            ${formatDate(
                notification.createdAt
            )}

        </div>

    `;


    notificationsContainer.appendChild(card);

}


/* ================================
   DISPLAY NOTIFICATIONS
================================ */

function displayNotifications(list){

    notificationsContainer.innerHTML = "";

    loading.style.display = "none";


    if(!list.length){

        empty.style.display = "block";

        return;

    }


    empty.style.display = "none";


    list.forEach(notification => {

        renderNotification(notification);

    });

}


/* ================================
   LOAD NOTIFICATIONS REALTIME
================================ */

function listenForNotifications(){

    if(!currentUser){

        return;

    }


    if(unsubscribeNotifications){

        unsubscribeNotifications();

        unsubscribeNotifications = null;

    }


    loading.style.display = "block";

    empty.style.display = "none";

    notificationsContainer.innerHTML = "";


    /*
     * IMPORTANT:
     *
     * We query only the current
     * customer's notifications.
     *
     * This matches the Firestore
     * security rules.
     */

    const notificationsQuery = query(

        collection(db,"notifications"),

        where(
            "uid",
            "==",
            currentUser.uid
        ),

        orderBy(
            "createdAt",
            "desc"
        )

    );


    unsubscribeNotifications =
        onSnapshot(

            notificationsQuery,

            snapshot => {

                const list = [];


                snapshot.forEach(notificationDoc => {

                    list.push({

                        id: notificationDoc.id,

                        ...notificationDoc.data()

                    });

                });


                displayNotifications(list);

            },


            error => {

                console.error(
                    "Notification error:",
                    error
                );


                loading.style.display = "none";


                notificationsContainer.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h3>
                            Unable to Load Notifications
                        </h3>

                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>

                `;

            }

        );

}


/* ================================
   MANUAL REFRESH
================================ */

async function refreshNotifications(){

    if(!currentUser){

        return;

    }


    refreshButton.disabled = true;

    refreshButton.textContent =
        "Refreshing...";


    try{

        const notificationsQuery = query(

            collection(db,"notifications"),

            where(
                "uid",
                "==",
                currentUser.uid
            ),

            orderBy(
                "createdAt",
                "desc"
            )

        );


        const snapshot =
            await getDocs(
                notificationsQuery
            );


        const list = [];


        snapshot.forEach(notificationDoc => {

            list.push({

                id: notificationDoc.id,

                ...notificationDoc.data()

            });

        });


        displayNotifications(list);


    }catch(error){

        console.error(error);

    }


    refreshButton.disabled = false;

    refreshButton.textContent =
        "↻ Refresh";

}


/* ================================
   AUTH
================================ */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser = user;

        listenForNotifications();

    }
);


/* ================================
   REFRESH BUTTON
================================ */

refreshButton.addEventListener(
    "click",
    refreshNotifications
);


/* ================================
   CLEANUP
================================ */

window.addEventListener(
    "beforeunload",
    () => {

        if(unsubscribeNotifications){

            unsubscribeNotifications();

        }

    }
);

</script>

</body>
</html>
