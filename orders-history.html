<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Orders History | Fame Store</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #f5f9ff,
                #ffffff,
                #fffbea
            );
            color: #101828;
        }

        a {
            text-decoration: none;
        }

        .page {
            min-height: 100vh;
            padding: 25px 15px 40px;
        }

        .container {
            width: min(850px, 100%);
            margin: auto;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            background: #ffc928;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 28px;
            margin: 0 auto 10px;
        }

        .header h1 {
            color: #0757d9;
            font-size: 25px;
            font-weight: 800;
        }

        .header p {
            color: #667085;
            font-size: 12px;
            margin-top: 5px;
        }


        /* =========================
           TITLE
        ========================= */

        .title-card {
            background: #ffffff;
            border: 1px solid #e5eaf1;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow:
                0 10px 35px rgba(7, 87, 217, .08);
        }

        .title-card h2 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .title-card p {
            color: #667085;
            font-size: 13px;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 13px;
            display: none;
        }

        .message.error {
            display: block;
            color: #b42318;
            background: #fff1f0;
            border: 1px solid #ffd3d0;
        }


        /* =========================
           ORDER CARD
        ========================= */

        .orders {
            display: grid;
            gap: 17px;
        }

        .order-card {
            background: #ffffff;
            border: 1px solid #e5eaf1;
            border-radius: 18px;
            padding: 18px;
            box-shadow:
                0 10px 35px rgba(7, 87, 217, .07);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #edf0f5;
        }

        .order-number {
            font-size: 13px;
            font-weight: 800;
            color: #0757d9;
        }

        .order-date {
            color: #667085;
            font-size: 11px;
            margin-top: 5px;
        }


        /* STATUS */

        .status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status.processing {
            color: #9a6700;
            background: #fff7d6;
        }

        .status.shipped {
            color: #0757d9;
            background: #eaf2ff;
        }

        .status.delivered {
            color: #087443;
            background: #eafff3;
        }

        .status.cancelled {
            color: #b42318;
            background: #fff0ef;
        }


        /* PRODUCT */

        .product {
            display: flex;
            gap: 15px;
            padding: 18px 0;
        }

        .product-image {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            object-fit: cover;
            background: #f2f4f7;
            border: 1px solid #eaecf0;
            flex-shrink: 0;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .product-price {
            color: #0757d9;
            font-size: 15px;
            font-weight: 800;
        }


        /* DETAILS */

        .details {
            background: #f8faff;
            border-radius: 12px;
            padding: 14px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 6px 0;
            font-size: 12px;
        }

        .detail-row span:first-child {
            color: #667085;
        }

        .detail-row span:last-child {
            text-align: right;
            font-weight: 700;
        }


        /* EMPTY */

        .empty {
            background: #ffffff;
            border: 1px solid #e5eaf1;
            border-radius: 20px;
            padding: 45px 25px;
            text-align: center;
            box-shadow:
                0 10px 35px rgba(7, 87, 217, .07);
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .empty p {
            color: #667085;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .gift-btn {
            display: inline-block;
            background: #0757d9;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
        }


        /* LOADING */

        .loading {
            text-align: center;
            padding: 40px;
            color: #667085;
            font-size: 13px;
        }


        /* BACK BUTTON */

        .back-dashboard {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #667085;
            font-size: 13px;
            font-weight: 700;
        }

        .back-dashboard:hover {
            color: #0757d9;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .page {
                padding: 20px 12px 35px;
            }

            .order-top {
                align-items: flex-start;
            }

            .product-image {
                width: 75px;
                height: 75px;
            }

            .product-name {
                font-size: 14px;
            }

            .detail-row {
                flex-direction: column;
                gap: 3px;
            }

            .detail-row span:last-child {
                text-align: left;
            }

        }

    </style>

</head>


<body>


<div class="page">

    <div class="container">


        <!-- =========================
             HEADER
        ========================= -->

        <div class="header">

            <div class="brand-icon">
                🛍️
            </div>

            <h1>
                Fame Store
            </h1>

            <p>
                Send gifts 🎁, share love ❤️
            </p>

        </div>



        <!-- =========================
             TITLE
        ========================= -->

        <div class="title-card">

            <h2>
                Orders History
            </h2>

            <p>
                View your gift orders and delivery status.
            </p>

        </div>



        <!-- =========================
             MESSAGE
        ========================= -->

        <div
            id="message"
            class="message">
        </div>



        <!-- =========================
             ORDERS
        ========================= -->

        <div
            id="orders"
            class="orders">

            <div class="loading">
                Loading your orders...
            </div>

        </div>



        <!-- =========================
             BACK
        ========================= -->

        <a
            href="dashboard.html"
            class="back-dashboard">

            ← Back to Dashboard

        </a>


    </div>

</div>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    auth,
    db
} from "./firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    orderBy,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* =========================
   ELEMENTS
========================= */

const ordersContainer =
    document.getElementById("orders");

const message =
    document.getElementById("message");



/* =========================
   MESSAGE
========================= */

function showError(text) {

    message.textContent = text;

    message.className =
        "message error";

}



/* =========================
   FORMAT MONEY
========================= */

function formatMoney(amount) {

    return "₦" + Number(amount || 0)
        .toLocaleString("en-NG", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

}



/* =========================
   FORMAT DATE
========================= */

function formatDate(timestamp) {

    if (!timestamp) {
        return "Date unavailable";
    }

    try {

        const date =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(timestamp);

        return date.toLocaleDateString(
            "en-NG",
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );

    } catch {

        return "Date unavailable";

    }

}



/* =========================
   STATUS
========================= */

function getStatusClass(status) {

    const value =
        String(status || "Processing")
            .toLowerCase();

    if (value === "delivered") {
        return "delivered";
    }

    if (value === "shipped") {
        return "shipped";
    }

    if (value === "cancelled") {
        return "cancelled";
    }

    return "processing";

}



/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(user) {

    ordersContainer.innerHTML = `
        <div class="loading">
            Loading your orders...
        </div>
    `;


    try {

        /*
         * Orders are connected to
         * the customer's Firebase UID.
         */

        const ordersRef =
            collection(db, "orders");


        const ordersQuery =
            query(
                ordersRef,
                where(
                    "userId",
                    "==",
                    user.uid
                ),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        const snapshot =
            await getDocs(
                ordersQuery
            );


        if (snapshot.empty) {

            showEmpty();

            return;

        }


        ordersContainer.innerHTML = "";


        snapshot.forEach(
            orderDoc => {

                const order =
                    orderDoc.data();

                createOrderCard(
                    orderDoc.id,
                    order
                );

            }
        );


    } catch (error) {

        console.error(
            "ORDERS ERROR:",
            error
        );


        /*
         * If the Firestore index has not
         * been created yet, try again without
         * orderBy so the customer can still
         * see their orders.
         */

        try {

            const fallbackQuery =
                query(
                    collection(
                        db,
                        "orders"
                    ),
                    where(
                        "userId",
                        "==",
                        user.uid
                    )
                );


            const fallbackSnapshot =
                await getDocs(
                    fallbackQuery
                );


            if (
                fallbackSnapshot.empty
            ) {

                showEmpty();

                return;

            }


            ordersContainer.innerHTML = "";


            const orderList = [];


            fallbackSnapshot.forEach(
                orderDoc => {

                    orderList.push({
                        id: orderDoc.id,
                        data: orderDoc.data()
                    });

                }
            );


            orderList.sort(
                (a, b) => {

                    const aTime =
                        a.data.createdAt?.toMillis
                            ? a.data.createdAt.toMillis()
                            : 0;

                    const bTime =
                        b.data.createdAt?.toMillis
                            ? b.data.createdAt.toMillis()
                            : 0;

                    return bTime - aTime;

                }
            );


            orderList.forEach(
                item => {

                    createOrderCard(
                        item.id,
                        item.data
                    );

                }
            );


        } catch (fallbackError) {

            console.error(
                "FALLBACK ORDERS ERROR:",
                fallbackError
            );


            showError(
                "Unable to load your orders. Please try again."
            );


            ordersContainer.innerHTML = "";

        }

    }

}



/* =========================
   CREATE ORDER CARD
========================= */

function createOrderCard(
    orderId,
    order
) {

    const status =
        order.status || "Processing";


    const statusClass =
        getStatusClass(status);


    const orderNumber =
        order.orderNumber ||
        orderId;


    const productName =
        order.productName ||
        "Gift Item";


    const productPrice =
        order.productPrice ??
        order.amount ??
        0;


    const productImage =
        order.productImage ||
        "";


    const recipientName =
        order.recipientName ||
        "Not provided";


    const recipientPhone =
        order.recipientPhone ||
        "Not provided";


    const country =
        order.country ||
        "Not provided";


    const address =
        order.address ||
        order.streetAddress ||
        "Not provided";


    const createdDate =
        formatDate(
            order.createdAt
        );


    const imageHTML =
        productImage
            ? `
                <img
                    class="product-image"
                    src="${escapeHTML(productImage)}"
                    alt="${escapeHTML(productName)}"
                    onerror="this.style.display='none';"
                >
              `
            : `
                <div
                    class="product-image"
                    style="
                        display:grid;
                        place-items:center;
                        font-size:30px;
                    ">
                    🎁
                </div>
              `;


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "order-card";


    card.innerHTML = `

        <div class="order-top">

            <div>

                <div class="order-number">
                    Order #${escapeHTML(orderNumber)}
                </div>

                <div class="order-date">
                    ${escapeHTML(createdDate)}
                </div>

            </div>


            <div class="status ${statusClass}">
                ${escapeHTML(status)}
            </div>

        </div>


        <div class="product">

            ${imageHTML}

            <div class="product-info">

                <div class="product-name">
                    ${escapeHTML(productName)}
                </div>

                <div class="product-price">
                    ${formatMoney(productPrice)}
                </div>

            </div>

        </div>


        <div class="details">

            <div class="detail-row">

                <span>
                    Recipient
                </span>

                <span>
                    ${escapeHTML(recipientName)}
                </span>

            </div>


            <div class="detail-row">

                <span>
                    Phone
                </span>

                <span>
                    ${escapeHTML(recipientPhone)}
                </span>

            </div>


            <div class="detail-row">

                <span>
                    Country
                </span>

                <span>
                    ${escapeHTML(country)}
                </span>

            </div>


            <div class="detail-row">

                <span>
                    Delivery Address
                </span>

                <span>
                    ${escapeHTML(address)}
                </span>

            </div>

        </div>

    `;


    ordersContainer.appendChild(
        card
    );

}



/* =========================
   EMPTY ORDERS
========================= */

function showEmpty() {

    ordersContainer.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                📦
            </div>

            <h3>
                No Orders Yet
            </h3>

            <p>
                You haven't sent any gifts yet.
                Start sending a gift to someone
                you love.
            </p>

            <a
                href="dashboard.html"
                class="gift-btn">

                🎁 Send a Gift

            </a>

        </div>

    `;

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value ?? "");

    return div.innerHTML;

}



/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(
    auth,
    user => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        loadOrders(user);

    }
);

</script>

</body>

</html>
