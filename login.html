<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Fame Store</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #f5f9ff,
                #ffffff,
                #fffbea
            );
            color: #101828;
        }

        a {
            text-decoration: none;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
        }

        .login-container {
            width: min(460px, 100%);
        }

        /* BRAND */

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: #ffc928;
            border-radius: 15px;
            display: grid;
            place-items: center;
            font-size: 28px;
            margin: 0 auto 10px;
        }

        .brand h1 {
            color: #0757d9;
            font-size: 24px;
            font-weight: 800;
        }

        .brand p {
            color: #667085;
            font-size: 12px;
            margin-top: 4px;
        }


        /* CARD */

        .login-card {
            background: #ffffff;
            border: 1px solid #e5eaf1;
            border-radius: 22px;
            padding: 35px;
            box-shadow:
                0 20px 60px rgba(7, 87, 217, 0.12);
        }

        .login-card h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            font-size: 13px;
            margin-bottom: 28px;
        }


        /* MESSAGE */

        .message {
            display: none;
            padding: 12px;
            border-radius: 9px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 17px;
        }

        .message.error {
            display: block;
            color: #b42318;
            background: #fff1f0;
            border: 1px solid #ffd3d0;
        }

        .message.success {
            display: block;
            color: #087443;
            background: #ecfff4;
            border: 1px solid #b9efd1;
        }


        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
        }

        .input {
            width: 100%;
            height: 51px;
            border: 1px solid #d9e0ea;
            border-radius: 10px;
            padding: 0 15px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            background: #fff;
            transition: .2s;
        }

        .input:focus {
            border-color: #0757d9;
            box-shadow:
                0 0 0 3px rgba(7, 87, 217, .08);
        }

        .password-toggle {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 17px;
        }


        /* OPTIONS */

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0 22px;
            gap: 10px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #667085;
            font-size: 12px;
            cursor: pointer;
        }

        .remember input {
            accent-color: #0757d9;
        }

        .forgot {
            color: #0757d9;
            font-size: 12px;
            font-weight: 700;
        }


        /* LOGIN BUTTON */

        .login-btn {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 11px;
            background: #0757d9;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
        }

        .login-btn:hover {
            background: #063b91;
        }

        .login-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
        }


        /* REGISTER */

        .register-text {
            text-align: center;
            color: #667085;
            font-size: 13px;
            margin-top: 22px;
        }

        .register-text a {
            color: #0757d9;
            font-weight: 700;
        }


        /* BACK */

        .back-home {
            display: block;
            text-align: center;
            color: #667085;
            font-size: 12px;
            margin-top: 20px;
        }

        .back-home:hover {
            color: #0757d9;
        }


        /* MOBILE */

        @media (max-width: 500px) {

            .login-card {
                padding: 25px 20px;
            }

            .login-card h2 {
                font-size: 24px;
            }

            .login-page {
                padding: 25px 15px;
            }

        }

    </style>

</head>


<body>


<div class="login-page">

    <div class="login-container">


        <!-- BRAND -->

        <div class="brand">

            <div class="brand-icon">
                🛍️
            </div>

            <h1>
                Fame Store
            </h1>

            <p>
                Send gifts 🎁, share love
            </p>

        </div>


        <!-- LOGIN CARD -->

        <div class="login-card">

            <h2>
                Welcome Back
            </h2>

            <p class="subtitle">
                Login to your Fame Store account
            </p>


            <!-- MESSAGE -->

            <div id="message"
                 class="message">
            </div>


            <!-- FORM -->

            <form id="loginForm">


                <!-- GMAIL -->

                <div class="form-group">

                    <label for="email">
                        Gmail
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="input"
                        placeholder="Enter your Gmail address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            class="input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword">

                            👁️

                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a
                        href="#"
                        id="forgotPassword"
                        class="forgot">

                        Forgot Password?

                    </a>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn">

                    Login Account

                </button>


            </form>


            <!-- REGISTER -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>


        <a
            href="index.html"
            class="back-home">

            ← Back to Fame Store

        </a>

    </div>

</div>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword,
        setPersistence,
        browserLocalPersistence,
        browserSessionPersistence,
        onAuthStateChanged,
        sendPasswordResetEmail
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyDMqdl_6k3iRAx96fX8g9LUpQtcZlSTIJg",

        authDomain:
            "fame-store-ea8b7.firebaseapp.com",

        projectId:
            "fame-store-ea8b7",

        storageBucket:
            "fame-store-ea8b7.firebasestorage.app",

        messagingSenderId:
            "484192010044",

        appId:
            "1:484192010044:web:8b1c496d5baa492d74a839",

        measurementId:
            "G-YTGM3N01V6"

    };


    /* =========================
       INITIALIZE
    ========================= */

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    /* =========================
       ELEMENTS
    ========================= */

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const rememberMe =
        document.getElementById("rememberMe");

    const loginBtn =
        document.getElementById("loginBtn");

    const message =
        document.getElementById("message");


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    /* =========================
       PASSWORD TOGGLE
    ========================= */

    document
        .getElementById("togglePassword")
        .addEventListener("click", () => {

            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

            } else {

                passwordInput.type =
                    "password";

            }

        });


    /* =========================
       CHECK EXISTING LOGIN
    ========================= */

    onAuthStateChanged(auth, user => {

        if (user) {

            window.location.href =
                "dashboard.html";

        }

    });


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();

            const password =
                passwordInput.value;


            if (!email.endsWith("@gmail.com")) {

                showMessage(
                    "Please enter a valid Gmail address.",
                    "error"
                );

                return;

            }


            if (!password) {

                showMessage(
                    "Please enter your password.",
                    "error"
                );

                return;

            }


            loginBtn.disabled = true;

            loginBtn.textContent =
                "Logging in...";


            try {

                /* =========================
                   PERSISTENCE
                ========================= */

                await setPersistence(
                    auth,
                    rememberMe.checked
                        ? browserLocalPersistence
                        : browserSessionPersistence
                );


                /* =========================
                   SIGN IN
                ========================= */

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                showMessage(
                    "Login successful. Redirecting...",
                    "success"
                );


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 700);


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                let errorMessage =
                    "Unable to login. Please try again.";


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    errorMessage =
                        "Incorrect Gmail or password.";

                }

                else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    errorMessage =
                        "No account was found with this Gmail.";

                }

                else if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    errorMessage =
                        "Incorrect password.";

                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    errorMessage =
                        "Too many login attempts. Please try again later.";

                }

                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    errorMessage =
                        "Network error. Check your internet connection.";

                }


                showMessage(
                    errorMessage,
                    "error"
                );


                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login Account";

            }

        }
    );


    /* =========================
       FORGOT PASSWORD
    ========================= */

    document
        .getElementById("forgotPassword")
        .addEventListener(
            "click",
            async event => {

                event.preventDefault();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                if (!email) {

                    showMessage(
                        "Enter your Gmail first, then click Forgot Password.",
                        "error"
                    );

                    emailInput.focus();

                    return;

                }


                if (!email.endsWith("@gmail.com")) {

                    showMessage(
                        "Please enter a valid Gmail address.",
                        "error"
                    );

                    return;

                }


                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );


                    showMessage(
                        "Password reset email sent. Check your Gmail inbox.",
                        "success"
                    );


                } catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );


                    if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        showMessage(
                            "No account was found with this Gmail.",
                            "error"
                        );

                    } else {

                        showMessage(
                            "Unable to send the reset email. Please try again.",
                            "error"
                        );

                    }

                }

            }
        );

</script>

</body>
</html>
