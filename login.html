<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Fame Store</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#f5f9ff,#fff,#fffbea);
    color:#101828;
}

a{
    text-decoration:none;
}

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

.login-container{
    width:min(460px,100%);
}

.brand{
    text-align:center;
    margin-bottom:24px;
}

.brand-icon{
    width:58px;
    height:58px;
    background:#ffc928;
    border-radius:16px;
    display:grid;
    place-items:center;
    font-size:28px;
    margin:0 auto 10px;
}

.brand h1{
    color:#0757d9;
    font-size:25px;
    font-weight:800;
}

.brand p{
    color:#667085;
    font-size:12px;
    margin-top:5px;
}

.login-card{
    background:#fff;
    border:1px solid #e5eaf1;
    border-radius:22px;
    padding:35px;
    box-shadow:0 20px 60px rgba(7,87,217,.12);
}

.login-card h2{
    text-align:center;
    font-size:27px;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#667085;
    font-size:13px;
    margin-bottom:27px;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    font-size:12px;
    line-height:1.5;
    text-align:center;
    margin-bottom:17px;
}

.message.show{
    display:block;
}

.message.error{
    color:#b42318;
    background:#fff1f0;
    border:1px solid #ffd3d0;
}

.message.success{
    color:#087443;
    background:#ecfff4;
    border:1px solid #b9efd1;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.input-wrapper{
    position:relative;
}

.input{
    width:100%;
    height:51px;
    border:1px solid #d9e0ea;
    border-radius:10px;
    padding:0 15px;
    outline:none;
    font-family:inherit;
    font-size:14px;
    background:#fff;
}

.input:focus{
    border-color:#0757d9;
    box-shadow:0 0 0 3px rgba(7,87,217,.08);
}

.password-toggle{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:17px;
}

.login-options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:4px 0 22px;
    gap:10px;
}

.remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:#667085;
    font-size:12px;
    cursor:pointer;
}

.remember input{
    accent-color:#0757d9;
}

.forgot{
    color:#0757d9;
    font-size:12px;
    font-weight:700;
}

.login-btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#0757d9;
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.login-btn:hover{
    background:#063b91;
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.register-text{
    text-align:center;
    color:#667085;
    font-size:13px;
    margin-top:22px;
}

.register-text a{
    color:#0757d9;
    font-weight:700;
}

.back-home{
    display:block;
    text-align:center;
    color:#667085;
    font-size:12px;
    margin-top:20px;
}

.back-home:hover{
    color:#0757d9;
}

@media(max-width:500px){
    .login-card{
        padding:25px 20px;
    }

    .login-card h2{
        font-size:24px;
    }

    .login-page{
        padding:25px 15px;
    }
}
</style>
</head>

<body>

<div class="login-page">

<div class="login-container">

<div class="brand">
    <div class="brand-icon">🛍️</div>

    <h1>Fame Store</h1>

    <p>Send gifts 🎁, share love</p>
</div>

<div class="login-card">

<h2>Welcome Back</h2>

<p class="subtitle">
    Login to your Fame Store account
</p>

<div id="message" class="message"></div>

<form id="loginForm">

<div class="form-group">

<label for="email">
    Gmail
</label>

<input
    type="email"
    id="email"
    class="input"
    placeholder="Enter your Gmail address"
    autocomplete="email"
    required
>

</div>

<div class="form-group">

<label for="password">
    Password
</label>

<div class="input-wrapper">

<input
    type="password"
    id="password"
    class="input"
    placeholder="Enter your password"
    autocomplete="current-password"
    required
>

<button
    type="button"
    class="password-toggle"
    id="togglePassword"
>
    👁️
</button>

</div>

</div>

<div class="login-options">

<label class="remember">

<input
    type="checkbox"
    id="rememberMe"
>

<span>Remember me</span>

</label>

<a
    href="#"
    id="forgotPassword"
    class="forgot"
>
    Forgot Password?
</a>

</div>

<button
    type="submit"
    class="login-btn"
    id="loginBtn"
>
    Login Account
</button>

</form>

<p class="register-text">

Don't have an account?

<a href="register.html">
    Create Account
</a>

</p>

</div>

<a
    href="index.html"
    class="back-home"
>
    ← Back to Fame Store
</a>

</div>

</div>

<script type="module">

import {
    auth,
    db
} from "./firebase-config.js";

import {
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence,
    onAuthStateChanged,
    sendPasswordResetEmail,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const rememberMe =
    document.getElementById("rememberMe");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const togglePassword =
    document.getElementById("togglePassword");

const forgotPassword =
    document.getElementById("forgotPassword");


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message show " + type;
}


togglePassword.addEventListener(
    "click",
    () => {

        if(passwordInput.type === "password"){

            passwordInput.type = "text";

            togglePassword.textContent = "🙈";

        }else{

            passwordInput.type = "password";

            togglePassword.textContent = "👁️";

        }

    }
);


async function redirectByRole(user){

    const userRef =
        doc(
            db,
            "users",
            user.uid
        );

    const userSnap =
        await getDoc(userRef);

    if(!userSnap.exists()){

        throw new Error(
            "Your account profile was not found."
        );
    }

    const userData =
        userSnap.data();

    if(userData.role === "admin"){

        window.location.replace(
            "admin-dashboard.html"
        );

    }else{

        window.location.replace(
            "dashboard.html"
        );

    }
}


loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const email =
            emailInput.value.trim().toLowerCase();

        const password =
            passwordInput.value;

        if(!email.endsWith("@gmail.com")){

            showMessage(
                "Please enter a valid Gmail address.",
                "error"
            );

            return;
        }

        if(!password){

            showMessage(
                "Please enter your password.",
                "error"
            );

            return;
        }

        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";

        try{

            await setPersistence(
                auth,
                rememberMe.checked
                    ? browserLocalPersistence
                    : browserSessionPersistence
            );

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            const user =
                credential.user;

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );

            const userSnap =
                await getDoc(userRef);

            if(!userSnap.exists()){

                await signOut(auth);

                throw new Error(
                    "Your account profile was not found in Firestore."
                );
            }

            const userData =
                userSnap.data();

            if(userData.role === "admin"){

                showMessage(
                    "Admin login successful. Opening admin dashboard...",
                    "success"
                );

            }else{

                showMessage(
                    "Login successful. Opening your dashboard...",
                    "success"
                );

            }

            setTimeout(
                () => {

                    if(userData.role === "admin"){

                        window.location.replace(
                            "admin-dashboard.html"
                        );

                    }else{

                        window.location.replace(
                            "dashboard.html"
                        );

                    }

                },
                500
            );

        }catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );

            let text =
                "Unable to login. Please try again.";

            if(
                error.code === "auth/invalid-credential" ||
                error.code === "auth/wrong-password"
            ){

                text =
                    "Incorrect Gmail or password.";

            }else if(
                error.code === "auth/user-not-found"
            ){

                text =
                    "No account was found with this Gmail.";

            }else if(
                error.code === "auth/too-many-requests"
            ){

                text =
                    "Too many login attempts. Please try again later.";

            }else if(
                error.code === "auth/network-request-failed"
            ){

                text =
                    "Network error. Check your internet connection.";

            }else if(
                error.code === "permission-denied"
            ){

                text =
                    "Unable to read your account profile.";

            }else if(error.message){

                text =
                    error.message;

            }

            showMessage(
                text,
                "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
                "Login Account";
        }

    }
);


forgotPassword.addEventListener(
    "click",
    async event => {

        event.preventDefault();

        const email =
            emailInput.value.trim().toLowerCase();

        if(!email){

            showMessage(
                "Enter your Gmail first, then click Forgot Password.",
                "error"
            );

            emailInput.focus();

            return;
        }

        if(!email.endsWith("@gmail.com")){

            showMessage(
                "Please enter a valid Gmail address.",
                "error"
            );

            return;
        }

        try{

            await sendPasswordResetEmail(
                auth,
                email
            );

            showMessage(
                "Password reset email sent. Check your Gmail inbox.",
                "success"
            );

        }catch(error){

            console.error(
                "PASSWORD RESET ERROR:",
                error
            );

            showMessage(
                "Unable to send the reset email. Please check the Gmail address.",
                "error"
            );

        }

    }
);


onAuthStateChanged(
    auth,
    async user => {

        if(!user){
            return;
        }

        try{

            await redirectByRole(user);

        }catch(error){

            console.error(
                "SESSION CHECK ERROR:",
                error
            );

        }

    }
);

</script>

</body>
</html>
