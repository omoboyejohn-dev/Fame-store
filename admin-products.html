<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products Management | Fame Store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --blue:#0757d9;
    --dark-blue:#063b91;
    --yellow:#ffc928;
    --white:#fff;
    --black:#101828;
    --gray:#667085;
    --light:#f5f8fc;
    --border:#e5eaf1;
    --green:#087443;
    --red:#b42318;
}

body{
    font-family:"Inter",sans-serif;
    background:var(--light);
    color:var(--black);
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

a{
    text-decoration:none;
    color:inherit;
}


/* =========================
   HEADER
========================= */

.header{
    background:white;
    border-bottom:1px solid var(--border);
    min-height:70px;
    padding:15px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-icon{
    width:43px;
    height:43px;
    background:var(--yellow);
    border-radius:12px;
    display:grid;
    place-items:center;
    font-size:21px;
}

.brand-name{
    color:var(--blue);
    font-size:18px;
    font-weight:800;
}

.brand-role{
    color:var(--gray);
    font-size:9px;
    margin-top:3px;
}

.admin-badge{
    background:#eaf2ff;
    color:var(--blue);
    padding:8px 13px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
}


/* =========================
   CONTAINER
========================= */

.container{
    width:min(1200px,100%);
    margin:auto;
    padding:28px 18px 60px;
}


/* =========================
   TITLE
========================= */

.page-title{
    margin-bottom:22px;
}

.page-title h1{
    font-size:25px;
    font-weight:800;
}

.page-title p{
    color:var(--gray);
    font-size:12px;
    margin-top:6px;
}


/* =========================
   MESSAGE
========================= */

.message{
    display:none;
    padding:13px 15px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:12px;
}

.message.show{
    display:block;
}

.message.success{
    color:var(--green);
    background:#ecfff4;
    border:1px solid #b9efd1;
}

.message.error{
    color:var(--red);
    background:#fff1f0;
    border:1px solid #ffd3d0;
}


/* =========================
   ADD PRODUCT CARD
========================= */

.form-card{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    margin-bottom:25px;
}

.form-header{
    margin-bottom:20px;
}

.form-header h2{
    font-size:16px;
}

.form-header p{
    color:var(--gray);
    font-size:11px;
    margin-top:5px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:11px;
    font-weight:700;
}

.form-group input,
.form-group select{
    width:100%;
    height:45px;
    border:1px solid #d9e0ea;
    border-radius:9px;
    padding:0 13px;
    outline:none;
    background:white;
    font-size:12px;
}

.form-group input:focus,
.form-group select:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(7,87,217,.08);
}

.form-actions{
    margin-top:18px;
    display:flex;
    gap:10px;
}

.primary-btn{
    height:45px;
    padding:0 20px;
    border:0;
    border-radius:9px;
    background:var(--blue);
    color:white;
    font-size:12px;
    font-weight:800;
}

.primary-btn:hover{
    background:var(--dark-blue);
}

.secondary-btn{
    height:45px;
    padding:0 20px;
    border:1px solid #d9e0ea;
    border-radius:9px;
    background:white;
    color:#475467;
    font-size:12px;
    font-weight:700;
}

.secondary-btn:hover{
    background:#f8fafc;
}


/* =========================
   PRODUCTS HEADER
========================= */

.products-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.products-header h2{
    font-size:17px;
}

.product-count{
    color:var(--gray);
    font-size:11px;
}


/* =========================
   PRODUCTS
========================= */

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.product-card{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
}

.product-image{
    width:100%;
    height:210px;
    background:#f8fafc;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-content{
    padding:17px;
}

.product-name{
    font-size:14px;
    font-weight:800;
    line-height:1.4;
}

.product-price{
    color:var(--blue);
    font-size:16px;
    font-weight:800;
    margin-top:7px;
}

.product-destination{
    display:inline-block;
    margin-top:9px;
    padding:5px 8px;
    border-radius:15px;
    background:#f2f4f7;
    color:#475467;
    font-size:9px;
    font-weight:700;
}

.product-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.edit-btn,
.delete-btn{
    flex:1;
    height:38px;
    border-radius:8px;
    font-size:10px;
    font-weight:800;
}

.edit-btn{
    border:1px solid #cddcff;
    background:#edf4ff;
    color:var(--blue);
}

.delete-btn{
    border:1px solid #ffd3d0;
    background:#fff1f0;
    color:var(--red);
}


/* =========================
   LOADING
========================= */

.loading,
.empty{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:40px 20px;
    text-align:center;
    color:var(--gray);
    font-size:12px;
}

.empty{
    display:none;
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(16,24,40,.55);

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;
    z-index:500;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(500px,100%);
    max-height:90vh;
    overflow:auto;

    background:white;
    border-radius:17px;
    padding:22px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h2{
    font-size:17px;
}

.close-btn{
    width:34px;
    height:34px;
    border:0;
    border-radius:8px;
    background:#f2f4f7;
    font-size:18px;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-actions button{
    flex:1;
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .products{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .products{
        grid-template-columns:1fr;
    }

    .header{
        padding:14px;
    }

    .container{
        padding:20px 12px 50px;
    }

}

</style>

</head>

        </div>

<script type="module">


/* =====================================
   FIREBASE
===================================== */

import {
    auth,
    db
} from "./firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* =====================================
   ELEMENTS
===================================== */

const message =
    document.getElementById("message");

const productForm =
    document.getElementById("productForm");

const productsContainer =
    document.getElementById("products");

const loading =
    document.getElementById("loading");

const empty =
    document.getElementById("empty");

const productCount =
    document.getElementById("productCount");

const refreshBtn =
    document.getElementById("refreshBtn");

const editModal =
    document.getElementById("editModal");

const editForm =
    document.getElementById("editForm");

const closeModal =
    document.getElementById("closeModal");

const cancelEdit =
    document.getElementById("cancelEdit");


let currentAdmin = null;



/* =====================================
   MESSAGE
===================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message show " + type;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    setTimeout(() => {

        message.className =
            "message";

    },5000);

}



/* =====================================
   MONEY
===================================== */

function formatMoney(amount){

    return "₦" +
        Number(amount || 0).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}



/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =====================================
   CHECK ADMIN
===================================== */

async function checkAdmin(user){

    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    const snapshot =
        await getDoc(userRef);


    if(!snapshot.exists()){

        throw new Error(
            "Admin profile was not found."
        );

    }


    const data =
        snapshot.data();


    if(data.role !== "admin"){

        throw new Error(
            "Access denied. This account is not an admin."
        );

    }


    currentAdmin = user;

}



/* =====================================
   LOAD PRODUCTS
===================================== */

async function loadProducts(){

    loading.style.display =
        "block";

    empty.style.display =
        "none";

    productsContainer.innerHTML =
        "";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "products"
                )
            );


        const products = [];


        snapshot.forEach(
            productDoc => {

                products.push({

                    id:productDoc.id,

                    ...productDoc.data()

                });

            }
        );


        loading.style.display =
            "none";


        productCount.textContent =
            products.length +
            (
                products.length === 1
                    ? " product"
                    : " products"
            );


        if(products.length === 0){

            empty.style.display =
                "block";

            return;

        }


        products.forEach(
            product => {

                renderProduct(
                    product
                );

            }
        );


    }catch(error){

        console.error(
            "Load products error:",
            error
        );


        loading.style.display =
            "none";


        showMessage(
            "Unable to load products: " +
            error.message,
            "error"
        );

    }

}



/* =====================================
   RENDER PRODUCT
===================================== */

function renderProduct(product){

    const card =
        document.createElement("div");


    card.className =
        "product-card";


    const image =
        product.image ||
        product.imageUrl ||
        "";


    const name =
        product.name ||
        "Unnamed Product";


    const price =
        Number(
            product.price || 0
        );


    const destination =
        product.destination ||
        "USA & Canada";


    const category =
        product.category ||
        "Other";


    card.innerHTML = `

        <div class="product-image">

            ${
                image
                ?
                `
                <img
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(name)}"
                    loading="lazy"
                    onerror="this.style.display='none'">
                `
                :
                `
                <span style="font-size:40px;">
                    🛍️
                </span>
                `
            }

        </div>


        <div class="product-content">

            <div class="product-name">

                ${escapeHTML(name)}

            </div>


            <div class="product-price">

                ${formatMoney(price)}

            </div>


            <span class="product-destination">

                🌎 ${escapeHTML(destination)}

                • ${escapeHTML(category)}

            </span>


            <div class="product-actions">

                <button
                    type="button"
                    class="edit-btn"
                    data-edit>

                    ✏️ Edit

                </button>


                <button
                    type="button"
                    class="delete-btn"
                    data-delete>

                    🗑️ Delete

                </button>

            </div>

        </div>

    `;


    productsContainer.appendChild(
        card
    );


    card
        .querySelector("[data-edit]")
        .addEventListener(
            "click",
            () => {

                openEditModal(
                    product
                );

            }
        );


    card
        .querySelector("[data-delete]")
        .addEventListener(
            "click",
            () => {

                deleteProduct(
                    product.id,
                    name
                );

            }
        );

}



/* =====================================
   ADD PRODUCT
===================================== */

productForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        if(!currentAdmin){

            showMessage(
                "Admin authentication is missing.",
                "error"
            );

            return;

        }


        const name =
            document
                .getElementById("productName")
                .value
                .trim();


        const price =
            Number(
                document
                    .getElementById("productPrice")
                    .value
            );


        const image =
            document
                .getElementById("productImage")
                .value
                .trim();


        const destination =
            document
                .getElementById("productDestination")
                .value;


        const category =
            document
                .getElementById("productCategory")
                .value;


        if(!name){

            showMessage(
                "Enter a product name.",
                "error"
            );

            return;

        }


        if(
            !Number.isFinite(price) ||
            price < 0
        ){

            showMessage(
                "Enter a valid price.",
                "error"
            );

            return;

        }


        if(!image){

            showMessage(
                "Enter the product image URL.",
                "error"
            );

            return;

        }


        const button =
            document.getElementById(
                "addProductBtn"
            );


        button.disabled =
            true;

        button.textContent =
            "Adding...";


        try{

            await addDoc(
                collection(
                    db,
                    "products"
                ),
                {

                    name:name,

                    price:price,

                    image:image,

                    destination:destination,

                    category:category,

                    active:true,

                    createdAt:
                        serverTimestamp(),

                    createdBy:
                        currentAdmin.uid

                }
            );


            showMessage(
                "Product added successfully.",
                "success"
            );


            productForm.reset();


            await loadProducts();


        }catch(error){

            console.error(
                "Add product error:",
                error
            );


            if(
                error.code ===
                "permission-denied"
            ){

                showMessage(
                    "Permission denied. Your Firestore Rules must allow admins to manage products.",
                    "error"
                );

            }else{

                showMessage(
                    "Unable to add product: " +
                    error.message,
                    "error"
                );

            }

        }finally{

            button.disabled =
                false;

            button.textContent =
                "Add Product";

        }

    }
);



/* =====================================
   OPEN EDIT
===================================== */

function openEditModal(product){

    document.getElementById(
        "editId"
    ).value =
        product.id;


    document.getElementById(
        "editName"
    ).value =
        product.name || "";


    document.getElementById(
        "editPrice"
    ).value =
        product.price || 0;


    document.getElementById(
        "editImage"
    ).value =
        product.image ||
        product.imageUrl ||
        "";


    document.getElementById(
        "editDestination"
    ).value =
        product.destination ||
        "USA & Canada";


    document.getElementById(
        "editCategory"
    ).value =
        product.category ||
        "Other";


    editModal.classList.add(
        "show"
    );

}



/* =====================================
   CLOSE EDIT
===================================== */

function closeEditModal(){

    editModal.classList.remove(
        "show"
    );

}


closeModal.addEventListener(
    "click",
    closeEditModal
);


cancelEdit.addEventListener(
    "click",
    closeEditModal
);


editModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            editModal
        ){

            closeEditModal();

        }

    }
);



/* =====================================
   SAVE EDIT
===================================== */

editForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        if(!currentAdmin){

            showMessage(
                "Admin authentication is missing.",
                "error"
            );

            return;

        }


        const id =
            document
                .getElementById("editId")
                .value;


        const name =
            document
                .getElementById("editName")
                .value
                .trim();


        const price =
            Number(
                document
                    .getElementById("editPrice")
                    .value
            );


        const image =
            document
                .getElementById("editImage")
                .value
                .trim();


        const destination =
            document
                .getElementById("editDestination")
                .value;


        const category =
            document
                .getElementById("editCategory")
                .value;


        if(!name){

            showMessage(
                "Product name is required.",
                "error"
            );

            return;

        }


        if(
            !Number.isFinite(price) ||
            price < 0
        ){

            showMessage(
                "Enter a valid price.",
                "error"
            );

            return;

        }


        if(!image){

            showMessage(
                "Product image URL is required.",
                "error"
            );

            return;

        }


        const button =
            document.getElementById(
                "saveEditBtn"
            );


        button.disabled =
            true;

        button.textContent =
            "Saving...";


        try{

            await updateDoc(
                doc(
                    db,
                    "products",
                    id
                ),
                {

                    name:name,

                    price:price,

                    image:image,

                    destination:destination,

                    category:category,

                    updatedAt:
                        serverTimestamp(),

                    updatedBy:
                        currentAdmin.uid

                }
            );


            closeEditModal();


            showMessage(
                "Product updated successfully.",
                "success"
            );


            await loadProducts();


        }catch(error){

            console.error(
                "Update product error:",
                error
            );


            if(
                error.code ===
                "permission-denied"
            ){

                showMessage(
                    "Permission denied. Check your Firestore Rules.",
                    "error"
                );

            }else{

                showMessage(
                    "Unable to update product: " +
                    error.message,
                    "error"
                );

            }

        }finally{

            button.disabled =
                false;

            button.textContent =
                "Save Changes";

        }

    }
);



/* =====================================
   DELETE PRODUCT
===================================== */

async function deleteProduct(
    productId,
    productName
){

    if(!currentAdmin){

        showMessage(
            "Admin authentication is missing.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "Delete this product?\n\n" +
            productName +
            "\n\nThis action cannot be undone."
        );


    if(!confirmed){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "products",
                productId
            )
        );


        showMessage(
            "Product deleted successfully.",
            "success"
        );


        await loadProducts();


    }catch(error){

        console.error(
            "Delete product error:",
            error
        );


        if(
            error.code ===
            "permission-denied"
        ){

            showMessage(
                "Permission denied. Check your Firestore Rules.",
                "error"
            );

        }else{

            showMessage(
                "Unable to delete product: " +
                error.message,
                "error"
            );

        }

    }

}



/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        try{

            await checkAdmin(
                user
            );


            await loadProducts();


        }catch(error){

            console.error(
                "Admin authentication error:",
                error
            );


            loading.style.display =
                "none";


            showMessage(
                error.message,
                "error"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "login.html";

                },
                1500
            );

        }

    }
);



/* =====================================
   REFRESH
===================================== */

refreshBtn.addEventListener(
    "click",
    async () => {

        refreshBtn.disabled =
            true;

        refreshBtn.textContent =
            "Refreshing...";


        try{

            await loadProducts();

        }finally{

            refreshBtn.disabled =
                false;

            refreshBtn.textContent =
                "↻ Refresh";

        }

    }
);

</script>
