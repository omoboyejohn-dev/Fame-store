<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Fame Store | Order History</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f6f9ff;
    color:#101828;
}

.header{
    background:#fff;
    border-bottom:1px solid #e5eaf1;
    padding:22px 16px;
    text-align:center;
}

.logo{
    font-size:25px;
    font-weight:800;
    color:#0757d9;
}

.subtitle{
    color:#667085;
    font-size:13px;
    margin-top:6px;
}

.container{
    width:min(900px,100%);
    margin:auto;
    padding:25px 16px 40px;
}

.page-title{
    text-align:center;
    margin-bottom:25px;
}

.page-title h1{
    font-size:27px;
    margin-bottom:7px;
}

.page-title p{
    color:#667085;
    font-size:13px;
}

.orders{
    display:grid;
    gap:16px;
}

.order-card{
    background:#fff;
    border:1px solid #e4e9f0;
    border-radius:18px;
    padding:16px;
    box-shadow:0 8px 25px rgba(16,24,40,.06);
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
    margin-bottom:15px;
}

.product{
    display:flex;
    gap:13px;
    align-items:center;
    min-width:0;
}

.product img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:11px;
    background:#eef2f6;
    flex-shrink:0;
}

.product-name{
    font-size:14px;
    font-weight:800;
    line-height:1.4;
}

.country{
    color:#667085;
    font-size:12px;
    margin-top:5px;
}

.price{
    color:#0757d9;
    font-size:16px;
    font-weight:800;
    white-space:nowrap;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
    margin-bottom:14px;
}

.status.processing{
    background:#fff4d6;
    color:#9a6700;
}

.status.completed{
    background:#e8fff2;
    color:#087443;
}

.status.cancelled{
    background:#ffe8e8;
    color:#b42318;
}

.details{
    border-top:1px solid #edf0f4;
    padding-top:14px;
}

.detail-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:9px;
    font-size:13px;
}

.detail-row span{
    color:#667085;
    flex-shrink:0;
}

.detail-row strong{
    text-align:right;
    overflow-wrap:anywhere;
}

.empty{
    background:#fff;
    border:1px solid #e4e9f0;
    border-radius:18px;
    padding:40px 20px;
    text-align:center;
}

.empty-icon{
    font-size:42px;
    margin-bottom:12px;
}

.empty h3{
    font-size:19px;
    margin-bottom:7px;
}

.empty p{
    color:#667085;
    font-size:13px;
    line-height:1.6;
}

.back{
    display:block;
    width:max-content;
    margin:25px auto 0;
    padding:12px 20px;
    border-radius:10px;
    background:#0757d9;
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:800;
}

.loading{
    text-align:center;
    padding:40px;
    color:#667085;
    font-size:14px;
}

.error{
    background:#fff0f0;
    border:1px solid #ffd0d0;
    color:#b42318;
    border-radius:12px;
    padding:16px;
    text-align:center;
    font-size:13px;
}

@media(max-width:600px){

    .order-top{
        flex-direction:column;
    }

    .price{
        margin-left:83px;
    }

    .product img{
        width:62px;
        height:62px;
    }

    .detail-row{
        align-items:flex-start;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="logo">
        🛍️ Fame Store
    </div>

    <div class="subtitle">
        Your Gift Order History
    </div>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            Order History
        </h1>

        <p>
            Track the status of your gift orders.
        </p>

    </div>


    <div
        id="orders"
        class="orders">

        <div class="loading">
            Loading your orders...
        </div>

    </div>


    <a
        href="dashboard.html"
        class="back">

        ← Back to Dashboard

    </a>

</main>


<script type="module">

import {
    auth,
    db
} from "./firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const ordersBox =
    document.getElementById("orders");


/* ==================================================
   MONEY
================================================== */

function money(value){

    return "₦" +
        Number(value || 0).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* ==================================================
   DATE
================================================== */

function formatDate(timestamp){

    if(!timestamp)
        return "Processing";

    try{

        const date =
            timestamp.toDate();

        return date.toLocaleString(
            "en-NG",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "Processing";

    }

}


/* ==================================================
   STATUS
================================================== */

function statusClass(status){

    const value =
        String(
            status || "Processing"
        ).toLowerCase();

    if(value === "completed")
        return "completed";

    if(value === "cancelled")
        return "cancelled";

    return "processing";

}


function statusIcon(status){

    const value =
        String(
            status || "Processing"
        ).toLowerCase();

    if(value === "completed")
        return "✓";

    if(value === "cancelled")
        return "✕";

    return "⏳";

}


/* ==================================================
   AUTH
================================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            ordersBox.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🔐
                    </div>

                    <h3>
                        Login Required
                    </h3>

                    <p>
                        Please login to view your order history.
                    </p>

                </div>

            `;

            return;

        }


        await loadOrders(
            user.uid
        );

    }
);


/* ==================================================
   LOAD ORDERS
================================================== */

async function loadOrders(uid){

    try{

        const ordersRef =
            collection(
                db,
                "giftOrders"
            );


        /*
         * Only use WHERE.
         * No orderBy here, so a composite
         * Firestore index is not required.
         */

        const ordersQuery =
            query(
                ordersRef,
                where(
                    "customerUID",
                    "==",
                    uid
                )
            );


        const snapshot =
            await getDocs(
                ordersQuery
            );


        if(snapshot.empty){

            ordersBox.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🎁
                    </div>

                    <h3>
                        No Orders Yet
                    </h3>

                    <p>
                        You have not placed any gift orders yet.
                    </p>

                </div>

            `;

            return;

        }


        /*
         * Convert Firestore documents
         * into an array.
         */

        const orders = [];


        snapshot.forEach(
            orderDoc => {

                orders.push({

                    id:
                        orderDoc.id,

                    data:
                        orderDoc.data()

                });

            }
        );


        /*
         * Sort newest orders first.
         */

        orders.sort(
            (a,b) => {

                const dateA =
                    a.data.createdAt
                    ?.toMillis?.() || 0;

                const dateB =
                    b.data.createdAt
                    ?.toMillis?.() || 0;

                return dateB - dateA;

            }
        );


        ordersBox.innerHTML = "";


        orders.forEach(
            orderItem => {

                const order =
                    orderItem.data;

                const orderId =
                    orderItem.id;


                const status =
                    order.status ||
                    "Processing";


                const image =
                    order.productImage ||
                    "";


                const productName =
                    order.productName ||
                    "Gift";


                const total =
                    order.total ||
                    order.price ||
                    0;


                const recipient =
                    order.recipientName ||
                    "-";


                const recipientPhone =
                    order.recipientPhone ||
                    "-";


                const address =
                    [
                        order.streetAddress,
                        order.city,
                        order.state,
                        order.zipCode
                    ]
                    .filter(Boolean)
                    .join(", ") || "-";


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                card.innerHTML = `

                    <div class="order-top">

                        <div class="product">

                            <img
                                src="${escapeHTML(image)}"
                                alt="Gift"
                            >

                            <div>

                                <div class="product-name">
                                    ${escapeHTML(
                                        productName
                                    )}
                                </div>

                                <div class="country">

                                    ${order.countryFlag || "🌍"}

                                    ${escapeHTML(
                                        order.country ||
                                        "International"
                                    )}

                                </div>

                            </div>

                        </div>


                        <div class="price">

                            ${money(total)}

                        </div>

                    </div>


                    <div>

                        <span
                            class="status ${statusClass(status)}">

                            ${statusIcon(status)}

                            ${escapeHTML(status)}

                        </span>

                    </div>


                    <div class="details">


                        <div class="detail-row">

                            <span>
                                Order ID
                            </span>

                            <strong>
                                ${escapeHTML(orderId)}
                            </strong>

                        </div>


                        <div class="detail-row">

                            <span>
                                Recipient
                            </span>

                            <strong>
                                ${escapeHTML(recipient)}
                            </strong>

                        </div>


                        <div class="detail-row">

                            <span>
                                Recipient Phone
                            </span>

                            <strong>
                                ${escapeHTML(recipientPhone)}
                            </strong>

                        </div>


                        <div class="detail-row">

                            <span>
                                Delivery Address
                            </span>

                            <strong>
                                ${escapeHTML(address)}
                            </strong>

                        </div>


                        <div class="detail-row">

                            <span>
                                Payment
                            </span>

                            <strong>
                                ${escapeHTML(
                                    order.paymentStatus ||
                                    "Paid"
                                )}
                            </strong>

                        </div>


                        <div class="detail-row">

                            <span>
                                Order Date
                            </span>

                            <strong>
                                ${formatDate(
                                    order.createdAt
                                )}
                            </strong>

                        </div>

                    </div>

                `;


                ordersBox.appendChild(
                    card
                );

            }
        );


    }catch(error){

        console.error(
            "ORDER HISTORY ERROR:",
            error
        );


        ordersBox.innerHTML = `

            <div class="error">

                <strong>
                    Unable to load your order history.
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Please try again."
                )}

            </div>

        `;

    }

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>

</body>
</html>
