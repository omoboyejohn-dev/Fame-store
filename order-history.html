<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Fame Store | Order History</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f6f9ff;
    color:#101828;
}

.header{
    background:#fff;
    border-bottom:1px solid #e5eaf1;
    padding:22px 16px;
    text-align:center;
}

.logo{
    font-size:25px;
    font-weight:800;
    color:#0757d9;
}

.subtitle{
    color:#667085;
    font-size:13px;
    margin-top:6px;
}

.container{
    width:min(900px,100%);
    margin:auto;
    padding:25px 16px 40px;
}

.page-title{
    text-align:center;
    margin-bottom:25px;
}

.page-title h1{
    font-size:27px;
    margin-bottom:7px;
}

.page-title p{
    color:#667085;
    font-size:13px;
}

.orders{
    display:grid;
    gap:16px;
}

.order-card{
    background:#fff;
    border:1px solid #e4e9f0;
    border-radius:18px;
    padding:16px;
    box-shadow:0 8px 25px rgba(16,24,40,.06);
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
    margin-bottom:15px;
}

.product{
    display:flex;
    gap:13px;
    align-items:center;
    min-width:0;
}

.product img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:11px;
    background:#eef2f6;
    flex-shrink:0;
}

.product-name{
    font-size:14px;
    font-weight:800;
    line-height:1.4;
}

.country{
    color:#667085;
    font-size:12px;
    margin-top:5px;
}

.price{
    color:#0757d9;
    font-size:16px;
    font-weight:800;
    white-space:nowrap;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
    margin-bottom:14px;
}

.status.pending{
    background:#fff4d6;
    color:#9a6700;
}

.status.successful{
    background:#e8fff2;
    color:#087443;
}

.status.cancelled{
    background:#ffe8e8;
    color:#b42318;
}

.refund-box{
    background:#e8fff2;
    border:1px solid #b7ebcf;
    color:#087443;
    border-radius:11px;
    padding:12px;
    margin-bottom:14px;
    font-size:12px;
    line-height:1.6;
}

.refund-box strong{
    display:block;
    font-size:13px;
    margin-bottom:3px;
}

.details{
    border-top:1px solid #edf0f4;
    padding-top:14px;
}

.detail-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:9px;
    font-size:13px;
}

.detail-row span{
    color:#667085;
    flex-shrink:0;
}

.detail-row strong{
    text-align:right;
    overflow-wrap:anywhere;
}

.empty{
    background:#fff;
    border:1px solid #e4e9f0;
    border-radius:18px;
    padding:40px 20px;
    text-align:center;
}

.empty-icon{
    font-size:42px;
    margin-bottom:12px;
}

.empty h3{
    font-size:19px;
    margin-bottom:7px;
}

.empty p{
    color:#667085;
    font-size:13px;
    line-height:1.6;
}

.back{
    display:block;
    width:max-content;
    margin:25px auto 0;
    padding:12px 20px;
    border-radius:10px;
    background:#0757d9;
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:800;
}

.loading{
    text-align:center;
    padding:40px;
    color:#667085;
    font-size:14px;
}

.error{
    background:#fff0f0;
    border:1px solid #ffd0d0;
    color:#b42318;
    border-radius:12px;
    padding:16px;
    text-align:center;
    font-size:13px;
}

@media(max-width:600px){

    .order-top{
        flex-direction:column;
    }

    .price{
        margin-left:83px;
    }

    .product img{
        width:62px;
        height:62px;
    }

    .detail-row{
        align-items:flex-start;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="logo">
        🛍️ Fame Store
    </div>

    <div class="subtitle">
        Your Gift Order History
    </div>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            Order History
        </h1>

        <p>
            Track the status of your gift orders.
        </p>

    </div>


    <div
        id="orders"
        class="orders">

        <div class="loading">
            Loading your orders...
        </div>

    </div>


    <a
        href="dashboard.html"
        class="back">

        ← Back to Dashboard

    </a>

</main>


<script type="module">

import {
    auth,
    db
} from "./firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const ordersBox =
    document.getElementById("orders");


/* ==================================================
   MONEY
================================================== */

function money(value){

    return "₦" +
        Number(value || 0).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* ==================================================
   DATE
================================================== */

function formatDate(timestamp){

    if(!timestamp)
        return "Processing";

    try{

        const date =
            timestamp.toDate();

        return date.toLocaleString(
            "en-NG",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch{

        return "Processing";

    }

}


/* ==================================================
   STATUS NORMALIZATION
================================================== */

function normalizeStatus(status){

    const value =
        String(
            status || "pending"
        ).trim().toLowerCase();

    if(
        value === "successful" ||
        value === "success" ||
        value === "delivered" ||
        value === "completed"
    ){

        return "successful";

    }

    if(
        value === "cancelled" ||
        value === "canceled"
    ){

        return "cancelled";

    }

    return "pending";

}


/* ==================================================
   STATUS CLASS
================================================== */

function statusClass(status){

    const value =
        normalizeStatus(status);

    return value;

}


/* ==================================================
   STATUS ICON
================================================== */

function statusIcon(status){

    const value =
        normalizeStatus(status);

    if(value === "successful")
        return "✓";

    if(value === "cancelled")
        return "✕";

    return "⏳";

}


/* ==================================================
   STATUS TEXT
================================================== */

function statusText(status){

    const value =
        normalizeStatus(status);

    if(value === "successful")
        return "Successful";

    if(value === "cancelled")
        return "Order Cancelled";

    return "Pending";

}


/* ==================================================
   AUTH
================================================== */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            ordersBox.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🔐
                    </div>

                    <h3>
                        Login Required
                    </h3>

                    <p>
                        Please login to view your order history.
                    </p>

                </div>

            `;

            return;

        }


        loadOrders(
            user.uid
        );

    }
);


/* ==================================================
   LOAD ORDERS
================================================== */

function loadOrders(uid){

    try{

        const ordersRef =
            collection(
                db,
                "giftOrders"
            );


        /*
         * Customer can only see their
         * own orders.
         */

        const ordersQuery =
            query(
                ordersRef,
                where(
                    "customerUID",
                    "==",
                    uid
                )
            );


        /*
         * REAL-TIME LISTENER
         *
         * When admin changes:
         *
         * Pending → Successful
         *
         * or
         *
         * Pending → Cancelled
         *
         * the customer page updates
         * automatically.
         */

        onSnapshot(

            ordersQuery,

            snapshot => {

                if(snapshot.empty){

                    ordersBox.innerHTML = `

                        <div class="empty">

                            <div class="empty-icon">
                                🎁
                            </div>

                            <h3>
                                No Orders Yet
                            </h3>

                            <p>
                                You have not placed any gift orders yet.
                            </p>

                        </div>

                    `;

                    return;

                }


                const orders = [];


                snapshot.forEach(
                    orderDoc => {

                        orders.push({

                            id:
                                orderDoc.id,

                            data:
                                orderDoc.data()

                        });

                    }
                );


                /*
                 * Newest first.
                 */

                orders.sort(
                    (a,b) => {

                        const dateA =
                            a.data.createdAt
                            ?.toMillis?.() || 0;

                        const dateB =
                            b.data.createdAt
                            ?.toMillis?.() || 0;

                        return dateB - dateA;

                    }
                );


                renderOrders(
                    orders
                );

            },

            error => {

                console.error(
                    "ORDER HISTORY ERROR:",
                    error
                );


                ordersBox.innerHTML = `

                    <div class="error">

                        <strong>
                            Unable to load your order history.
                        </strong>

                        <br><br>

                        ${escapeHTML(
                            error.message ||
                            "Please try again."
                        )}

                    </div>

                `;

            }

        );

    }catch(error){

        console.error(
            "ORDER HISTORY ERROR:",
            error
        );

    }

}


/* ==================================================
   RENDER ORDERS
================================================== */

function renderOrders(orders){

    ordersBox.innerHTML = "";


    orders.forEach(
        orderItem => {

            const order =
                orderItem.data;

            const orderId =
                orderItem.id;


            const status =
                normalizeStatus(
                    order.status
                );


            const image =
                order.productImage ||
                "";


            const productName =
                order.productName ||
                "Gift";


            const total =
                Number(
                    order.total ??
                    order.price ??
                    order.basePrice ??
                    order.productPrice ??
                    0
                );


            const recipient =
                order.recipientName ||
                "-";


            const recipientPhone =
                order.recipientPhone ||
                "-";


            const address =
                [
                    order.streetAddress,
                    order.city,
                    order.state,
                    order.zipCode,
                    order.country
                ]
                .filter(Boolean)
                .join(", ") || "-";


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order-card";


            let refundHTML = "";


            /*
             * Show refund message only
             * after the order has been cancelled
             * and the admin has processed the refund.
             */

            if(
                status === "cancelled" &&
                order.refundProcessed === true
            ){

                const refundAmount =
                    Number(
                        order.refundAmount ??
                        total
                    );


                refundHTML = `

                    <div class="refund-box">

                        <strong>
                            💰 Money Returned to Wallet
                        </strong>

                        ${money(refundAmount)}
                        has been returned to your Fame Store wallet.

                    </div>

                `;

            }


            card.innerHTML = `

                <div class="order-top">

                    <div class="product">

                        <img
                            src="${escapeHTML(image)}"
                            alt="Gift"
                            onerror="this.style.display='none'"
                        >

                        <div>

                            <div class="product-name">
                                ${escapeHTML(
                                    productName
                                )}
                            </div>

                            <div class="country">

                                ${escapeHTML(
                                    order.countryFlag ||
                                    "🌍"
                                )}

                                ${escapeHTML(
                                    order.country ||
                                    "International"
                                )}

                            </div>

                        </div>

                    </div>


                    <div class="price">

                        ${money(total)}

                    </div>

                </div>


                <div>

                    <span
                        class="status ${statusClass(status)}"
                    >

                        ${statusIcon(status)}

                        ${statusText(status)}

                    </span>

                </div>


                ${refundHTML}


                <div class="details">


                    <div class="detail-row">

                        <span>
                            Order ID
                        </span>

                        <strong>
                            ${escapeHTML(orderId)}
                        </strong>

                    </div>


                    <div class="detail-row">

                        <span>
                            Recipient
                        </span>

                        <strong>
                            ${escapeHTML(recipient)}
                        </strong>

                    </div>


                    <div class="detail-row">

                        <span>
                            Recipient Phone
                        </span>

                        <strong>
                            ${escapeHTML(recipientPhone)}
                        </strong>

                    </div>


                    <div class="detail-row">

                        <span>
                            Delivery Address
                        </span>

                        <strong>
                            ${escapeHTML(address)}
                        </strong>

                    </div>


                    <div class="detail-row">

                        <span>
                            Payment
                        </span>

                        <strong>

                            ${escapeHTML(
                                order.refundProcessed === true
                                    ? "Refunded to Wallet"
                                    : (
                                        order.paymentStatus ||
                                        "Paid"
                                    )
                            )}

                        </strong>

                    </div>


                    ${
                        order.refundProcessed === true
                        ? `

                        <div class="detail-row">

                            <span>
                                Refund Amount
                            </span>

                            <strong>
                                ${money(
                                    order.refundAmount ??
                                    total
                                )}
                            </strong>

                        </div>

                        `
                        : ""
                    }


                    <div class="detail-row">

                        <span>
                            Order Date
                        </span>

                        <strong>
                            ${formatDate(
                                order.createdAt
                            )}
                        </strong>

                    </div>


                    ${
                        order.cancelledAt
                        ? `

                        <div class="detail-row">

                            <span>
                                Cancelled Date
                            </span>

                            <strong>
                                ${formatDate(
                                    order.cancelledAt
                                )}
                            </strong>

                        </div>

                        `
                        : ""
                    }


                    ${
                        order.successfulAt
                        ? `

                        <div class="detail-row">

                            <span>
                                Successful Date
                            </span>

                            <strong>
                                ${formatDate(
                                    order.successfulAt
                                )}
                            </strong>

                        </div>

                        `
                        : ""
                    }

                </div>

            `;


            ordersBox.appendChild(
                card
            );

        }
    );

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}

</script>

</body>
</html>
